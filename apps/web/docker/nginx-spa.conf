server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA на корне: try_files отдаёт index.html для любых неподходящих путей
    # (роутер throne сам разберётся). В prod за Caddy /api/* и /login и др. сюда
    # не доходят — Caddy их перехватывает выше. /api/ proxy ниже работает только
    # для локального `docker compose --profile full` без reverse-proxy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:5008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
