server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA смонтирована под /app/. Vite собран с base="/app/", роутер с basename="/app".
    # Caddy наверху проксирует /api/* напрямую в throne-api, сюда они не попадают.
    location = /app { return 301 /app/; }

    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }
}
