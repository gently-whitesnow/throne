name: publish-mcp-stdio

# Publishes Throne.Mcp.Stdio to NuGet.org on tags shaped like v*.
# Tag drives PackageVersion (vX.Y.Z[-prerelease] → X.Y.Z[-prerelease]).
#
# Required repo secrets:
#   NUGET_API_KEY — NuGet.org API key with push rights to Throne.Mcp.Stdio.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit PackageVersion to publish (e.g. 0.1.0). Required for manual runs.'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive package version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF##*/}"
            VERSION="${REF#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Throne.Mcp.Stdio $VERSION"

      - name: Pack
        working-directory: apps/api
        run: |
          dotnet pack src/Throne.Mcp.Stdio/Throne.Mcp.Stdio.csproj \
            -c Release \
            -o ../../artifacts \
            -p:PackageVersion=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "artifacts/Throne.Mcp.Stdio.${{ steps.version.outputs.version }}.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: Throne.Mcp.Stdio-${{ steps.version.outputs.version }}
          path: artifacts/Throne.Mcp.Stdio.${{ steps.version.outputs.version }}.nupkg
