name: release

# Slice 6 packaging (ADR-0048). On a pushed `vX.Y.Z` tag, build the SPA once and
# cross-publish the self-contained single-file `throne` binary for every RID from a
# single Linux runner, bundle each (binary + wwwroot + skills + specs + bin) and
# attach the archives to the GitHub Release for that tag.
#
# Asset names MUST match what `throne update` looks for: `throne-<rid>.tar.gz`
# (and `throne-win-x64.zip` for Windows).

on:
  push:
    tags:
      - "v*"
  # Manual publish button in Actions: same build/bundle/release path, version comes
  # from the input instead of the tag ref. action-gh-release creates the `v<version>`
  # tag at the checked-out commit. Asset names and `throne update` are unchanged.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.2.3 (no leading v)"
        required: true
        type: string

# Required so action-gh-release can create the release and upload assets.
permissions:
  contents: write

jobs:
  # One matrix leg per RID. .NET cross-publishes self-contained single-file bundles
  # for win/osx/linux from ubuntu-latest, so no per-OS runners are needed.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64, linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm version comes from "packageManager" in apps/web/package.json (pnpm@10.14.0).
      - name: Enable corepack
        run: corepack enable

      # Build the SPA once; csproj links apps/web/dist into wwwroot at publish.
      - name: Install web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Build web
        run: pnpm build
        working-directory: apps/web

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Tag push → strip the leading `v` from the ref; manual dispatch → take the input.
      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # -r <rid> flips the csproj to self-contained single-file `throne` (AssemblyName=throne).
      # Output dir holds: throne(.exe) + wwwroot + skills + specs/manifest + bin.
      - name: Publish
        run: >
          dotnet publish apps/api/src/Throne.Api/Throne.Api.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.ver.outputs.value }}
          -o out/${{ matrix.rid }}

      # Archive name == the asset name `throne update` downloads. win-x64 → .zip, rest → .tar.gz.
      - name: Bundle
        run: |
          mkdir -p dist
          # Referenced projects emit .pdb files next to the binary; the single-file
          # bundle has no use for them, so keep them out of the shipped archive.
          rm -f out/${{ matrix.rid }}/*.pdb
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd out/${{ matrix.rid }} && zip -r "$GITHUB_WORKSPACE/dist/throne-${{ matrix.rid }}.zip" .)
          else
            tar -czf "dist/throne-${{ matrix.rid }}.tar.gz" -C out/${{ matrix.rid }} .
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: throne-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # Single release job: gather every matrix bundle and publish one release for the tag.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Tag push → reuse the pushed tag; manual dispatch → `v<version>` (created by the release step).
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist/*
          fail_on_unmatched_files: true
