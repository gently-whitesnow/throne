# Throne user-prompt seed — starter set of user-scope prompt parts (ADR-0051).
#
# This file is the single source of truth for the FIRST-RUN seed of editable
# user-scope parts. A hosted seeder (`UserPromptSeedSeeder`) reads it and writes
# the parts into the real EF store — but ONLY when `prompt_parts(scope=user)` is
# completely empty (a truly first boot). Once any user part exists the seeder is a
# no-op: it never resurrects deleted parts and never tops up running instances.
#
# Unlike the system manifest (whose texts are read-only and managed by PR), these
# texts are lightweight ready-to-use starter directives the operator tunes for their
# own context. They become normal editable user parts after the seed runs.
#
# Per part: {key, text, description?, mode_roles[]}. `mode_roles` mirrors the
# PromptPart domain model: {mode, role, order}. Core parts (common/work/interview/
# review/dream) carry `mandatory` roles matching the system manifest's bundles;
# the module examples are `default_off` (available, not selected by default).

version: 1

seed_parts:
  - key: common
    description: Общие договорённости для всех режимов.
    mode_roles:
      - { mode: interview, role: mandatory, order: 1 }
      - { mode: work,      role: mandatory, order: 1 }
      - { mode: review,    role: mandatory, order: 1 }
      - { mode: dream,     role: mandatory, order: 1 }
    text: |
      Веди диалог на языке оператора

  - key: interview
    description: Заготовка под режим interview.
    mode_roles:
      - { mode: interview, role: mandatory, order: 2 }
    text: |
      - Задавай вопросы, которые сильнее всего снижают неопределённость.

  - key: work
    description: Заготовка под режим work.
    mode_roles:
      - { mode: work, role: mandatory, order: 2 }
    text: |
      - Не плоди новые сущности, слои и workflow без явной необходимости.

  - key: review
    description: Заготовка под режим review.
    mode_roles:
      - { mode: review, role: mandatory, order: 2 }
    text: |
      - Проверь, были ли нарушения заложенного code style.

  - key: dream
    description: Заготовка под режим dream.
    mode_roles:
      - { mode: dream, role: mandatory, order: 2 }
    text: |
      - Объём задаёт оператор — не бери больше, чем просили.

  - key: review_recommendation
    description: Опциональная фича — записать артефакт review_recommendation по итогам ревью.
    mode_roles:
      - { mode: review, role: default_off, order: 10 }
    text: |
      По итогам ревью запиши единственный артефакт `review_recommendation`.
      - Записывай его только через статический скрипт `skills/review/bin/throne-review` в workspace сессии. Не пиши PR-артефакты напрямую в persistence или через provider-specific реализацию.
      - Payload соответствует `PutPullRequestArtifactRequest` (`specs/contracts/repositories/openapi.yaml`): `render`, `content`, `summary`, `source`, `source_refs`, `head_sha`, `review_recommendation`, `produced_at`. Для review используй `source="agent"`, обычно `render="markdown"` (markdown-тело рекомендации в `content`).
      - Заполняй типизированный `review_recommendation` (схема `ReviewRecommendationContent`): сейчас в схеме только `file_order[{path, reason, risk}]` — упорядочи от самых рисковых/корневых файлов к листьям (`risk` ∈ `high|medium|low`).
      - Проставляй `head_sha` ревьюенного PR/MR (`gh pr view --json headRefOid` / `glab` / `git rev-parse HEAD`): по нему UI помечает артефакт устаревшим, когда PR уезжает вперёд.
      - В финале кратко доложи, что записал в `review_recommendation`, какие provider-комментарии отправил или почему не отправил.

  - key: analysis
    description: Пример модульной части под анализ.
    mode_roles:
      - { mode: dream, role: default_off, order: 10 }
    text: |
      Аналитический проход — диагностика / инвентаризация / ресёрч без правок кода.
      - Не меняй файлы. Выход — диагноз + actionable-заметки + 2-3 варианта решения с pro/contra и подтверждением из кода/доков.
      - Жди явного апрува оператора на фикс.

  - key: commit
    description: Пример модульной части с правилами коммитов.
    mode_roles:
      - { mode: work, role: default_off, order: 11 }
    text: |
      Сделай чекаут и создай пул-реквест по выполненной работе

  - key: tests
    description: Пример модульной части про тесты.
    mode_roles:
      - { mode: work, role: default_off, order: 12 }
    text: |
      Напиши тесты на проделанную работу

  - key: contracts
    description: Пример модульной части про контракты.
    mode_roles:
      - { mode: work, role: default_off, order: 13 }
    text: |
      - Сначала reuse, потом расширение.
      - Следуй стандартным методам (AIP / Geewax): list / get / create / update / delete. Кастомные методы (resource:action) — только когда стандартные физически не выражают операцию.
