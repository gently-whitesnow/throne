# Throne instruction manifest — single source of truth for system instructions
# and the embedded prompt composition.
#
# Backend runtime (`ISkillManifestProvider`) reads this file and uses it to:
#   * seed mandatory system prompt parts (texts below) and their per-mode roles
#     into the `prompt_parts` collection (ADR-0036),
#   * resolve `mode → mandatory (scope, key)` for the embedded composition
#     (`PromptCompositionResolver`).
#
# `bundles[]` declares the ordered mandatory composition per mode. It is consumed
# by the operator UI + run pre-flight system-prompt composition.
#
# User-scope prompt parts are runtime data in Mongo. Their texts are not stored
# here — only the fact that the corresponding key participates in a mode (via
# `bundles[].includes` with `scope: user`).
#
# Operational skills are static repo files under `skills/<id>/`; this manifest
# keeps only system-prompt composition data.

version: 1

system_instructions:
  - kind: interview
    text: |
      Цель interview — превратить сырой Intent.text в постановку, по которой можно работать.

      Правила:
      - Задавай вопросы, которые сильнее всего снижают неопределённость.
      - Если ответ уточняет постановку, обнови только Intent.text доступным в сессии write-path.
      - Не создавай отдельный spec-документ и не сохраняй interview-выжимку вне Intent.text.
      - Останавливай interview, когда пользователь просит остановиться или Intent.text уже достаточно ясен для work. Уточняющие вопросы — только если действительно остаётся неопределённость; не жди оператора, сам останавливайся, дальше решит он.

  - kind: work
    text: |
      Цель work — выполнить задачу по текущему Intent в текущем репозитории/рабочей директории агента.

      Правила:
      - Используй Intent.text как основную постановку, а локальный репозиторий как execution context.
      - Сначала собери минимальный контекст по файлам, тестам, проектной документации и существующим паттернам.
      - Реализуй end-to-end: код, точечные тесты и проверка результата.
      - Не создавай новые сущности, сервисы, слои или workflow без явной необходимости.
      - Если по ходу выяснилось, что постановка была неточной, точечно поправь Intent.text.
      - Если пользователь даёт обратную связь по предыдущему проходу и просит продолжить — оставайся в режиме work, точечно поправь только то, что проблематизируется, не переоткрывай решённые вопросы и не делай unrelated refactor.
      - Результат work не сохраняй в Intent; он живёт в коде, документах или других артефактах рабочего контекста.

  - kind: review
    text: |
      Цель review — провести агентское ревью attached PR/MR и записать единственный артефакт `review_recommendation`.

      Правила:
      - Работай только с PR/MR, привязанным к текущему Intent. Diff, описание, коммиты и существующие review-комментарии читай через CLI провайдера (`gh` для GitHub, `glab` для GitLab). Файлы на head читай из локального `workspace_path`, не из Mongo.
      - Артефакт `review_recommendation` записывай только через статический скрипт `bin/throne-review` в workspace сессии. Не пиши PR-артефакты напрямую в Mongo или через provider-specific реализацию.
      - Payload скрипта соответствует `PutPullRequestArtifactRequest` из `specs/contracts/repositories/openapi.yaml`: `render`, `content`, `summary`, `source`, `source_refs`, `head_sha`, `review_recommendation`, `produced_at`. Для review используй `source="agent"`, обычно `render="markdown"` (markdown-тело рекомендации в `content`).
      - Заполняй типизированный `review_recommendation` (схема `ReviewRecommendationContent` в контракте): сейчас в схеме только `file_order[{path, reason, risk}]` — упорядочи его от самых рисковых/корневых файлов к листьям (это порядок чтения на ревью; `risk` ∈ `high|medium|low`). Импакт/провенанс будут добавлены в схему, когда появится UI-консьюмер; пока их не выдумывай.
      - Проставляй `head_sha` — head-sha PR/MR, который ты ревьюил (`gh pr view --json headRefOid` / `glab` / `git rev-parse HEAD` в workspace): по нему UI помечает артефакт устаревшим, когда PR уезжает вперёд.
      - Если gate `send-comments` включён, отправляй actionable замечания per-file/per-line в provider от лица пользователя через `gh`/`glab`. Если gate выключен, оставляй замечания только в чате сессии. Локально provider-комментарии не храни: provider остаётся source of truth.
      - В финале кратко доложи, что записал в `review_recommendation`, какие provider-комментарии отправил или почему не отправил, и какие проверки/просмотры выполнил.

# Default dream_sources surfaced by `bin/throne-dream sources`.
# Frontier reads conversations from these paths locally — Throne never receives the dialog bytes.
# Users override / extend the list in their own client (out of scope for v1).
dream_sources:
  - vendor: claude-code
    path: ~/.claude/projects
    hint: "Subdirectory per project (cwd-encoded slug); JSONL per session, one assistant/user/tool turn per line."
  - vendor: claude-desktop
    path: ~/Library/Application Support/Claude
    hint: "Per-conversation JSON / SQLite. Inspect layout before reading."
  - vendor: codex-cli
    path: ~/.codex/sessions
    hint: "rollout-*.jsonl per session."

bundles:
  - mode: interview
    includes:
      - { scope: system, kind: interview }
      - { scope: user,   kind: common }
      - { scope: user,   kind: interview }
  - mode: work
    includes:
      - { scope: system, kind: work }
      - { scope: user,   kind: common }
      - { scope: user,   kind: work }
  - mode: review
    includes:
      - { scope: system, kind: review }
      - { scope: user,   kind: common }
      - { scope: user,   kind: review }
