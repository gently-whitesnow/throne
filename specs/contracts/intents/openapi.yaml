openapi: "3.1.0"
info:
  title: Throne Intents
  version: "1.0.0"
  x-csharp-namespace: Throne.Intents.Contracts.Generated
paths:
  /api/v1/intents:
    get:
      operationId: listIntents
      tags: [Intents]
      summary: List intents (metadata + short text preview).
      description: >
        Returns intent metadata (id, current_version, tags, timestamps) and a short text preview.
        Does not include qa or reviews. Full text must be fetched via a dedicated read endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentListItemDto'
    post:
      operationId: createIntent
      tags: [Intents]
      summary: Create a new Intent (user-driven).
      description: Creates an Intent and seeds v1 of its text. ChangedBy=user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
  /api/v1/intents/{id}:
    get:
      operationId: getIntent
      tags: [Intents]
      summary: Get a single intent (full text).
      description: Returns the full intent including canonical text, tags and version.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteIntent
      tags: [Intents]
      summary: Delete an Intent and cascade its text_versions.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/status:
    post:
      operationId: setIntentStatus
      tags: [Intents]
      summary: Set intent status (user-driven).
      description: >
        User-driven status change for an intent. Allows any supported status.
        When status=reject, reject_reason is required and appended to the end of Intent.text.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntentStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: State conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/replace-text:
    post:
      operationId: replaceIntentText
      tags: [Intents]
      summary: Replace a unique substring of Intent.text (user-driven).
      description: >
        User-driven counterpart to MCP replace_intent_text. Optimistic concurrency via expected_version.
        ChangedBy=user.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../shared.yaml#/components/schemas/ReplaceTextRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Match not found or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/versions:
    get:
      operationId: listIntentVersions
      tags: [Intents]
      summary: List the text-version history of an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../shared.yaml#/components/schemas/TextVersionDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments:
    get:
      operationId: listIntentAttachments
      tags: [Intents]
      summary: List file attachments for an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentAttachmentDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    post:
      operationId: uploadIntentAttachment
      tags: [Intents]
      summary: Upload one file attachment for an intent.
      description: >
        Multipart upload of a single file. Separate from create/update intent text.
        Server enforces at most 10 attachments per intent and 10 MiB per file.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File bytes (any content type; images are the primary use case).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentAttachmentDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '413':
          description: File exceeds maximum size
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Too many attachments for this intent
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments/{attachment_id}:
    delete:
      operationId: deleteIntentAttachment
      tags: [Intents]
      summary: Delete one file attachment from an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        - in: path
          name: attachment_id
          required: true
          schema:
            type: string
          description: Attachment identifier.
      responses:
        '204':
          description: Deleted
        '404':
          description: Intent or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments/{attachment_id}/content:
    get:
      operationId: downloadIntentAttachment
      tags: [Intents]
      summary: Download one file attachment from an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        - in: path
          name: attachment_id
          required: true
          schema:
            type: string
          description: Attachment identifier.
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Intent or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    CreateIntentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Initial text of the Intent.
        tags:
          type: array
          items:
            type: string
          description: Optional tags for filtering.
    IntentStatus:
      type: string
      enum:
        - draft
        - interview
        - work
        - ready_for_review
        - done
        - reject
      description: Current workflow status of the intent.
    SetIntentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/IntentStatus'
        reject_reason:
          type: string
          minLength: 1
          description: Required when status=reject. Appended to the end of Intent.text.
    IntentListItemDto:
      type: object
      required:
        - id
        - status
        - current_version
        - tags
        - text_short
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        status:
          $ref: '#/components/schemas/IntentStatus'
        current_version:
          type: integer
          format: int32
          minimum: 1
          description: Current text version of the intent.
        tags:
          type: array
          items:
            type: string
          description: Normalized list of tags (deduplicated, trimmed).
        text_short:
          type: string
          maxLength: 140
          description: First 140 characters of Intent.Text (no ellipsis); full text via separate read endpoint.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntentDetailDto:
      type: object
      required:
        - id
        - status
        - current_version
        - tags
        - text
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        status:
          $ref: '#/components/schemas/IntentStatus'
        current_version:
          type: integer
          format: int32
          minimum: 1
        tags:
          type: array
          items:
            type: string
        text:
          type: string
          description: Full canonical Intent.Text.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntentAttachmentDto:
      type: object
      required:
        - id
        - intent_id
        - file_name
        - content_type
        - size_bytes
        - created_at
      properties:
        id:
          type: string
          description: Attachment identifier (24 hex chars, ObjectId-shaped).
        intent_id:
          type: string
          description: Owning intent id.
        file_name:
          type: string
          description: Original file name from the upload.
        content_type:
          type: string
          description: Declared MIME type of the uploaded file.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Stored size in bytes.
        created_at:
          type: string
          format: date-time
