openapi: "3.1.0"
info:
  title: Throne Intents
  version: "1.0.0"
  x-csharp-namespace: Throne.Intents.Contracts.Generated
paths:
  /api/v1/intents:
    get:
      operationId: listIntents
      tags: [Intents]
      summary: List intents (metadata + short text preview).
      description: >
        Returns intent metadata (id, current_version, tags, timestamps) and a short text preview.
        Does not include qa or reviews. Full text must be fetched via a dedicated read endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentListItemDto'
    post:
      operationId: createIntent
      tags: [Intents]
      summary: Create a new Intent (user-driven).
      description: Creates an Intent and seeds v1 of its text. ChangedBy=user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
  /api/v1/intents/{id}:
    get:
      operationId: getIntent
      tags: [Intents]
      summary: Get a single intent (full text).
      description: Returns the full intent including canonical text, tags and version.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteIntent
      tags: [Intents]
      summary: Delete an Intent and cascade its text_versions.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/replace-text:
    post:
      operationId: replaceIntentText
      tags: [Intents]
      summary: Replace a unique substring of Intent.text (user-driven).
      description: >
        User-driven counterpart to MCP replace_intent_text. Optimistic concurrency via expected_version.
        ChangedBy=user.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../shared.yaml#/components/schemas/ReplaceTextRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Match not found or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/versions:
    get:
      operationId: listIntentVersions
      tags: [Intents]
      summary: List the text-version history of an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../shared.yaml#/components/schemas/TextVersionDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    CreateIntentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Initial text of the Intent.
        tags:
          type: array
          items:
            type: string
          description: Optional tags for filtering.
    IntentListItemDto:
      type: object
      required:
        - id
        - current_version
        - tags
        - text_short
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        current_version:
          type: integer
          format: int32
          minimum: 1
          description: Current text version of the intent.
        tags:
          type: array
          items:
            type: string
          description: Normalized list of tags (deduplicated, trimmed).
        text_short:
          type: string
          maxLength: 140
          description: First 140 characters of Intent.Text (no ellipsis); full text via separate read endpoint.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntentDetailDto:
      type: object
      required:
        - id
        - current_version
        - tags
        - text
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        current_version:
          type: integer
          format: int32
          minimum: 1
        tags:
          type: array
          items:
            type: string
        text:
          type: string
          description: Full canonical Intent.Text.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
