openapi: "3.1.0"
info:
  title: Throne Intents
  version: "1.0.0"
  x-csharp-namespace: Throne.Intents.Contracts.Generated
paths:
  /api/v1/intents:
    get:
      operationId: listIntents
      tags: [Intents]
      summary: List intents (metadata + short text preview).
      description: >
        Returns intent metadata (id, current_version, tags, timestamps) and a short text preview.
        Does not include qa or reviews. Full text must be fetched via a dedicated read endpoint.
        Optional `status` query parameter narrows the result to intents in the specified statuses;
        repeat the parameter for multiple values (e.g. `?status=interview&status=work`).
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IntentStatus'
          style: form
          explode: true
          description: Filter by one or more workflow statuses. Omit to return all intents.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentListItemDto'
    post:
      operationId: createIntent
      tags: [Intents]
      summary: Create a new Intent (user-driven).
      description: Creates an Intent and seeds v1 of its text. ChangedBy=user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
  /api/v1/intents/{id}:
    get:
      operationId: getIntent
      tags: [Intents]
      summary: Get a single intent (full text).
      description: Returns the full intent including canonical text, tags and version.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteIntent
      tags: [Intents]
      summary: Delete an Intent and cascade its text_versions.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/status:
    post:
      operationId: setIntentStatus
      tags: [Intents]
      summary: Set intent status (user-driven).
      description: >
        User-driven status change for an intent. Allows any supported status.
        When status=reject, reject_reason is required and appended to the end of Intent.text.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntentStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: State conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/tags:
    put:
      operationId: setIntentTags
      tags: [Intents]
      summary: Replace the set of tags attached to an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntentTagsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Intent or tag not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/replace-text:
    post:
      operationId: replaceIntentText
      tags: [Intents]
      summary: Replace a unique substring of Intent.text (user-driven).
      description: >
        User-driven counterpart to MCP replace_intent_text. Optimistic concurrency via expected_version.
        ChangedBy=user.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../shared.yaml#/components/schemas/ReplaceTextRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Match not found or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/versions:
    get:
      operationId: listIntentVersions
      tags: [Intents]
      summary: List the text-version history of an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../shared.yaml#/components/schemas/TextVersionDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/qa:
    get:
      operationId: listIntentQa
      tags: [Intents]
      summary: List Q/A pairs collected during interview for an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentQaDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/reviews:
    get:
      operationId: listIntentReviews
      tags: [Intents]
      summary: List review notes attached to an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentReviewDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments:
    get:
      operationId: listIntentAttachments
      tags: [Intents]
      summary: List file attachments for an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentAttachmentDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    post:
      operationId: uploadIntentAttachment
      tags: [Intents]
      summary: Upload one file attachment for an intent.
      description: >
        Multipart upload of a single file. Separate from create/update intent text.
        Server enforces at most 10 attachments per intent and 10 MiB per file.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File bytes (any content type; images are the primary use case).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentAttachmentDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '413':
          description: File exceeds maximum size
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Too many attachments for this intent
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments/{attachment_id}:
    delete:
      operationId: deleteIntentAttachment
      tags: [Intents]
      summary: Delete one file attachment from an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        - in: path
          name: attachment_id
          required: true
          schema:
            type: string
          description: Attachment identifier.
      responses:
        '204':
          description: Deleted
        '404':
          description: Intent or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments/{attachment_id}/content:
    get:
      operationId: downloadIntentAttachment
      tags: [Intents]
      summary: Download one file attachment from an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        - in: path
          name: attachment_id
          required: true
          schema:
            type: string
          description: Attachment identifier.
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Intent or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    CreateIntentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Initial text of the Intent.
        tag_names:
          type: array
          items:
            type: string
          description: Optional tag names (slug-style). Server upserts by name — existing names are reused, new names create tags.
    SetIntentTagsRequest:
      type: object
      required:
        - tag_names
        - expected_version
      properties:
        tag_names:
          type: array
          items:
            type: string
          description: Replacement set of tag names; pass an empty array to detach all tags. Server upserts by name.
        expected_version:
          type: integer
          format: int32
          minimum: 1
          description: current_version observed before this update; tag changes do not bump the value but it must still match.
    TagRefDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Tag identifier.
        name:
          type: string
          description: Normalized hashtag-shaped slug.
    IntentStatus:
      type: string
      enum:
        - draft
        - interview
        - ready_for_work
        - work
        - ready_for_review
        - done
        - reject
      description: Current workflow status of the intent.
    SetIntentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/IntentStatus'
        reject_reason:
          type: string
          minLength: 1
          description: Required when status=reject. Appended to the end of Intent.text.
    IntentListItemDto:
      type: object
      required:
        - id
        - status
        - current_version
        - tags
        - text_short
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        status:
          $ref: '#/components/schemas/IntentStatus'
        current_version:
          type: integer
          format: int32
          minimum: 1
          description: Current text version of the intent.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRefDto'
          description: Tags currently attached to the intent (id + display name).
        text_short:
          type: string
          maxLength: 140
          description: First 140 characters of Intent.Text (no ellipsis); full text via separate read endpoint.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntentDetailDto:
      type: object
      required:
        - id
        - status
        - current_version
        - tags
        - text
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        status:
          $ref: '#/components/schemas/IntentStatus'
        current_version:
          type: integer
          format: int32
          minimum: 1
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRefDto'
          description: Tags currently attached to the intent (id + display name).
        text:
          type: string
          description: Full canonical Intent.Text.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntentTrainingAuthor:
      type: string
      enum: [user, agent, system]
      description: Who recorded this training entry.
    IntentQaDto:
      type: object
      required:
        - id
        - intent_id
        - intent_version_at_write
        - question
        - answer
        - created_at
        - created_by
      properties:
        id:
          type: string
          description: QA record identifier.
        intent_id:
          type: string
          description: Owning intent id.
        intent_version_at_write:
          type: integer
          format: int32
          minimum: 1
          description: Intent.current_version observed when this Q/A was recorded.
        question:
          type: string
        answer:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/IntentTrainingAuthor'
    IntentReviewDto:
      type: object
      required:
        - id
        - intent_id
        - intent_version_at_write
        - note
        - reason
        - created_at
        - created_by
      properties:
        id:
          type: string
          description: Review record identifier.
        intent_id:
          type: string
          description: Owning intent id.
        intent_version_at_write:
          type: integer
          format: int32
          minimum: 1
        note:
          type: string
          description: Reviewer note text.
        reason:
          type: string
          description: Short reason / rationale tag.
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/IntentTrainingAuthor'
    IntentAttachmentDto:
      type: object
      required:
        - id
        - intent_id
        - file_name
        - content_type
        - size_bytes
        - created_at
      properties:
        id:
          type: string
          description: Attachment identifier (24 hex chars, ObjectId-shaped).
        intent_id:
          type: string
          description: Owning intent id.
        file_name:
          type: string
          description: Original file name from the upload.
        content_type:
          type: string
          description: Declared MIME type of the uploaded file.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Stored size in bytes.
        created_at:
          type: string
          format: date-time
