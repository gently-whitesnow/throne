openapi: "3.1.0"
info:
  title: Throne Intents
  version: "1.0.0"
  x-csharp-namespace: Throne.Intents.Contracts.Generated
paths:
  /api/v1/intents:
    get:
      operationId: listIntents
      tags: [Intents]
      summary: List intents (cursor-paginated metadata + short text preview).
      description: >
        Returns a single page of intent metadata (id, current_version, tags, timestamps)
        with a short text preview. Full text must be fetched via a dedicated read endpoint.
        Pagination is opaque-cursor (server-encoded); `next_cursor` is absent on the final page.
        Default page size is 50, capped at 100. Filters (status, tag, untagged, pinned, query)
        and sort order are server-driven so clients don't keep the full result set in memory.
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            description: Opaque continuation cursor returned by the previous page.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Page size, default 50, capped at 100.
        - in: query
          name: status
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IntentStatus'
          style: form
          explode: true
          description: Filter by one or more workflow statuses. Omit to return all intents.
        - in: query
          name: tag
          required: false
          schema:
            type: string
            minLength: 1
          description: Filter to intents that carry this tag (slug-style name).
        - in: query
          name: untagged
          required: false
          schema:
            type: boolean
          description: >
            When true, return only intents that carry no tags at all. Mutually
            exclusive with `tag` (combining them yields an empty page).
        - in: query
          name: pinned
          required: false
          schema:
            type: boolean
          description: >
            When true, return only intents pinned into at least one context.
            Server-side equivalent of the client "pinned" bucket.
        - in: query
          name: terminal_running
          required: false
          schema:
            type: boolean
          description: >
            When true, return only intents that currently have a live embedded-terminal
            session (a `throne-{intent_id}` tmux session). The set is read live from tmux
            (no DB mirror); an empty tmux server yields an empty page.
        - in: query
          name: query
          required: false
          schema:
            type: string
            minLength: 1
          description: >-
            Ranked full-text search over Intent.text (FTS5/BM25). Tokens are matched as
            case-insensitive AND prefixes; results come back ordered by relevance with a
            highlighted `snippet`, and `next_cursor` is null (single ranked page). When
            absent, the list uses the structural order from `sort`.
        - in: query
          name: sort
          required: false
          schema:
            $ref: '#/components/schemas/IntentListSort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentListPageDto'
    post:
      operationId: createIntent
      tags: [Intents]
      summary: Create a new Intent (user-driven).
      description: Creates an Intent and seeds v1 of its text. ChangedBy=user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
  /api/v1/intents/contexts:
    get:
      operationId: getIntentContexts
      tags: [Intents]
      summary: Aggregate intent counts per context bucket (rail sidebar).
      description: >
        Single-shot aggregate for the context rail: counts for the inbox bucket, fridge,
        archive, pinned and untagged buckets plus per-tag breakdowns for the active,
        archive and fridge scopes. Computed server-side (server-side aggregation) so the rail never pulls
        the full intent list just to render counters. Bucket semantics mirror the
        `status` / `tag` / `untagged` / `pinned` filters of `listIntents`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentContextCountsDto'
  /api/v1/intents/{id}:
    get:
      operationId: getIntent
      tags: [Intents]
      summary: Get a single intent (full text).
      description: Returns the full intent including canonical text, tags and version.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteIntent
      tags: [Intents]
      summary: Delete an Intent and cascade its text_versions.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/status:
    post:
      operationId: setIntentStatus
      tags: [Intents]
      summary: Set intent status.
      description: >
        Status change for an intent. Allows any supported status. `reason` is optional
        for any transition (recorded in the status-change log) and required when
        status=reject (additionally appended to the end of Intent.text as the rejection reason).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntentStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: State conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/cleanup-on-done:
    post:
      operationId: setIntentCleanupOnDone
      tags: [Intents]
      summary: Set the teardown-on-done gate.
      description: >
        Sets `cleanup_local_state_on_done` on the intent. When true (default), reaching `done`
        wipes the workspace folder + agent trust entries and kills the agent terminal session;
        when false both survive past `done`. Targeted metadata write — does not bump version nor
        touch text/status. Exposed on both the intent page and the review merge control.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntentCleanupOnDoneRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/tags:
    put:
      operationId: setIntentTags
      tags: [Intents]
      summary: Replace the set of tags attached to an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntentTagsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Intent or tag not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/title:
    put:
      operationId: setIntentTitle
      tags: [Intents]
      summary: Set or clear the optional Intent title.
      description: >
        Title is optional metadata: it does not bump current_version and is not versioned. Pass
        title=null or an empty string to clear it. A card-linked intent must keep a non-empty title
        (422 otherwise).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntentTitleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: A card-linked intent must keep a non-empty title.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/move:
    post:
      operationId: moveIntent
      tags: [Intents]
      summary: Reorder an intent in the user-defined sort order.
      description: >
        Drag-and-drop reorder. The client supplies neighbours by id (`before_id`, `after_id`)
        and the server reads their canonical `sort_key` values to compute the midpoint.
        At least one neighbour must be supplied. Reorder does not bump `current_version`
        nor `updated_at` — the change is purely positional and is not recorded as a text version.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveIntentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Intent or pivot not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (e.g. neither neighbour supplied)
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/pin:
    post:
      operationId: pinIntent
      tags: [IntentPins]
      summary: Pin an intent in a tag-scoped context.
      description: >
        Adds a pin record `(intent_id, context_tag_id)`. Pins are bookmarks: they do not
        change the intent's status nor bump `current_version`. Position inside the
        context's Pinned list is governed by a fractional `pin_sort_key`; supply
        `before_id` and/or `after_id` to insert between existing pins, or omit both
        to append to the end. Idempotent: re-pinning an existing pair without
        neighbours is a no-op; supplying neighbours reorders the existing pin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinIntentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Intent, pivot pin or context not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (e.g. inverted pivots)
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: unpinIntent
      tags: [IntentPins]
      summary: Remove a pin from a tag-scoped context.
      description: >
        Removes the pin record `(intent_id, context_tag_id)`. Idempotent: returns 200
        with the refreshed Intent DTO even if the pin did not exist.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnpinIntentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/pin/move:
    post:
      operationId: movePin
      tags: [IntentPins]
      summary: Reorder a pin inside its context's Pinned list.
      description: >
        Drag-and-drop reorder of an existing pin. Behaves like `/move` for intents
        but operates on `pin_sort_key` instead of `sort_key`. At least one of
        `before_id` / `after_id` must be supplied; pivot ids reference other pinned
        intents inside the same `context_tag_id`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovePinRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Intent or pivot pin not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/replace-text:
    post:
      operationId: replaceIntentText
      tags: [Intents]
      summary: Replace a unique substring of Intent.text (user-driven).
      description: >
        UI and `skills/intent/bin/throne-intent` write path. Optimistic concurrency via
        expected_version. ChangedBy=user.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../shared.yaml#/components/schemas/ReplaceTextRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Match not found or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/versions:
    get:
      operationId: listIntentVersions
      tags: [Intents]
      summary: List the text-version history of an Intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../shared.yaml#/components/schemas/TextVersionDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/events:
    get:
      operationId: listIntentEvents
      tags: [Intents]
      summary: Unified append-only event feed for an intent.
      description: >
        Returns the merged history (text + graph) for the intent in chronological
        order. Backed by `intent_events` (ADR-0019); link events surface on both
        endpoints of an edge via `peer_intent_id`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentEventDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/links/summary:
    get:
      operationId: getIntentLinksSummary
      tags: [IntentLinks]
      summary: Batch-fetch link aggregates for a set of intents (board badges + hover overlay).
      description: >
        Companion to `listIntents`: instead of bloating the list DTO with graph-join
        fields, the board fetches per-intent link aggregates here. For each requested
        id the server returns peer previews for the graph roles surfaced on
        the card (`blocked_by`, `blocks`, `linked_from`, `linked_to`). Edges whose
        peer the caller does not own are dropped from the projection. Missing ids in
        the response map to «no incident edges».
      parameters:
        - in: query
          name: ids
          required: true
          schema:
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 200
          style: form
          explode: true
          description: One or more intent ids to aggregate links for. Repeat the parameter for each id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentLinksSummaryDto'
        '422':
          description: Validation failed (e.g. `ids` empty or above the cap).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/links:
    get:
      operationId: listIntentLinks
      tags: [IntentLinks]
      summary: List directional graph edges incident to this intent.
      description: >
        Returns outgoing and incoming `intent_links` for the intent. The `direction` field on
        each item is computed relative to the queried intent: `outgoing` = the queried intent
        is the `from_id`, `incoming` = it is the `to_id`. Edges whose peer the caller does not
        own (or that point at a deleted intent) are dropped from the projection.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: direction
          required: false
          schema:
            $ref: '#/components/schemas/IntentLinkDirection'
        - in: query
          name: blocking
          required: false
          schema:
            type: boolean
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentLinksPageDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    post:
      operationId: createIntentLink
      tags: [IntentLinks]
      summary: Create one directed edge between two intents (M:N graph).
      description: >
        Creates one directed edge `(from_id=path id, to_id)` in the unified forward
        graph. `blocking=true` marks hard dependency edges; `blocking=false` is soft
        context/provenance. Self-links are rejected with `link.self_link`. Duplicates
        `(from_id, to_id)` are rejected with `link.duplicate`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentLinkRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentLinkDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Duplicate edge
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (self-link)
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/links/{to_id}:
    delete:
      operationId: deleteIntentLink
      tags: [IntentLinks]
      summary: Delete one directed edge by its natural key.
      description: >
        Idempotent delete by natural key `(from_id=path id, to_id)`. Returns 204
        whether the edge existed or not — repeated calls with stale state must be safe.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: to_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted (or already absent)
  /api/v1/intents/{id}/attachments:
    get:
      operationId: listIntentAttachments
      tags: [IntentAttachments]
      summary: List file attachments for an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentAttachmentDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    post:
      operationId: uploadIntentAttachment
      tags: [IntentAttachments]
      summary: Upload one file attachment for an intent.
      description: >
        Multipart upload of a single file. Separate from create/update intent text.
        Server enforces at most 10 attachments per intent and 10 MiB per file.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File bytes (any content type; images are the primary use case).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentAttachmentDto'
        '404':
          description: Intent not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '413':
          description: File exceeds maximum size
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Too many attachments for this intent
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments/{attachment_id}:
    delete:
      operationId: deleteIntentAttachment
      tags: [IntentAttachments]
      summary: Delete one file attachment from an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        - in: path
          name: attachment_id
          required: true
          schema:
            type: string
          description: Attachment identifier.
      responses:
        '204':
          description: Deleted
        '404':
          description: Intent or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/attachments/{attachment_id}/content:
    get:
      operationId: downloadIntentAttachment
      tags: [IntentAttachments]
      summary: Download one file attachment from an intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        - in: path
          name: attachment_id
          required: true
          schema:
            type: string
          description: Attachment identifier.
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Intent or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    CreateIntentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Initial text of the Intent.
        title:
          type: string
          nullable: true
          description: Optional title. Free-form metadata, not versioned; omit or pass null for an untitled intent.
        tag_names:
          type: array
          items:
            type: string
          description: Optional tag names (slug-style). Server upserts by name — existing names are reused, new names create tags.
    MoveIntentRequest:
      type: object
      properties:
        before_id:
          type: string
          description: Id of the intent that should immediately precede the moved intent. Optional when after_id is supplied.
        after_id:
          type: string
          description: Id of the intent that should immediately follow the moved intent. Optional when before_id is supplied.
      description: >
        At least one of before_id / after_id must be present. Supplying both pins the moved
        intent strictly between the two neighbours.
    PinIntentRequest:
      type: object
      required:
        - context_tag_id
      properties:
        context_tag_id:
          type: string
          minLength: 1
          description: Tag id that defines the per-context pin bucket. Must reference a tag owned by the caller.
        before_id:
          type: string
          description: Optional id of the intent whose pin in this context should immediately precede the new pin.
        after_id:
          type: string
          description: Optional id of the intent whose pin in this context should immediately follow the new pin.
      description: >
        Pin an intent inside a tag-scoped Pinned list. When neither pivot is supplied
        the pin is appended to the tail.
    UnpinIntentRequest:
      type: object
      required:
        - context_tag_id
      properties:
        context_tag_id:
          type: string
          minLength: 1
          description: Tag id whose Pinned bucket should drop this intent.
    PinnedContextDto:
      type: object
      required:
        - context_tag_id
        - pin_sort_key
      properties:
        context_tag_id:
          type: string
          description: Tag id whose Pinned bucket holds this entry.
        pin_sort_key:
          type: string
          minLength: 1
          description: Fractional sort key (base62) defining the entry's position inside the bucket. Client-side ordering of the Pinned list inside a tag context is ascending by this key.
    MovePinRequest:
      type: object
      required:
        - context_tag_id
      properties:
        context_tag_id:
          type: string
          minLength: 1
          description: Tag id of the Pinned list to reorder inside.
        before_id:
          type: string
          description: Optional id of the pinned intent that should immediately precede this pin.
        after_id:
          type: string
          description: Optional id of the pinned intent that should immediately follow this pin.
      description: >
        At least one of before_id / after_id must be present. Pivot ids reference other
        intents pinned in the same context.
    SetIntentTagsRequest:
      type: object
      required:
        - tag_names
        - expected_version
      properties:
        tag_names:
          type: array
          items:
            type: string
          description: Replacement set of tag names; pass an empty array to detach all tags. Server upserts by name.
        expected_version:
          type: integer
          format: int32
          minimum: 1
          description: current_version observed before this update; tag changes do not bump the value but it must still match.
    SetIntentTitleRequest:
      type: object
      required:
        - expected_version
      properties:
        title:
          type: string
          nullable: true
          description: New title; pass null or an empty string to clear it. A card-linked intent must keep a non-empty title.
        expected_version:
          type: integer
          format: int32
          minimum: 1
          description: current_version observed before this update; title changes do not bump the value but it must still match.
    TagRefDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Tag identifier.
        name:
          type: string
          description: Normalized hashtag-shaped slug.
    IntentStatus:
      type: string
      enum:
        - draft
        - interview
        - ready_for_work
        - work
        - awaiting_operator
        - done
        - reject
        - fridge
      description: >
        Current workflow status of the intent. `awaiting_operator` is the single «inbox»
        bucket — the next move belongs to the operator. `fridge` is the user-only «later» bucket.
    SetIntentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/IntentStatus'
        reason:
          type: string
          minLength: 1
          description: >
            Optional free-text reason for the transition. Recorded in the status-change
            log. Required when status=reject — in that case the value is also appended
            to the end of Intent.text as the rejection reason.
    SetIntentCleanupOnDoneRequest:
      type: object
      required:
        - cleanup_local_state_on_done
      properties:
        cleanup_local_state_on_done:
          type: boolean
          description: New value of the teardown-on-done gate.
    IntentListSort:
      type: string
      enum:
        - sort_key_asc
        - updated_desc
        - created_desc
        - created_asc
      description: >
        Sort order applied to the list page. `sort_key_asc` (default) reflects the
        user-defined fractional sort_key — same order the board renders.
    IntentListPageDto:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntentListItemDto'
        next_cursor:
          type: string
          description: Opaque continuation token; absent on the final page.
    IntentListItemDto:
      type: object
      required:
        - id
        - status
        - current_version
        - tags
        - text_short
        - sort_key
        - created_at
        - updated_at
        - pinned_in
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        status:
          $ref: '#/components/schemas/IntentStatus'
        current_version:
          type: integer
          format: int32
          minimum: 1
          description: Current text version of the intent.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRefDto'
          description: Tags currently attached to the intent (id + display name).
        title:
          type: string
          nullable: true
          description: Optional title. Null when the intent is untitled; render a text snippet fallback in that case.
        text_short:
          type: string
          maxLength: 140
          description: First 140 characters of Intent.Text (no ellipsis); full text via separate read endpoint.
        snippet:
          type: string
          description: >-
            Relevance snippet of Intent.text with matched terms wrapped in highlight
            markers (STX/ETX control characters). Present only on the ranked `query` path;
            absent on plain list pages. Clients split on the markers and render the enclosed
            run as a highlight (as text, never raw markup).
        sort_key:
          type: string
          minLength: 1
          description: Fractional sort key (base62). Default list order is ascending by this key.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pinned_in:
          type: array
          items:
            $ref: '#/components/schemas/PinnedContextDto'
          description: Per-context pin entries for this intent. Empty array means «not pinned anywhere». Each entry carries the tag id and the fractional pin_sort_key, so clients can render the per-context Pinned list in the server-defined order.
    IntentContextTagCountDto:
      type: object
      required:
        - tag
        - count
      properties:
        tag:
          type: string
          description: Tag display name (slug).
        count:
          type: integer
          format: int32
          minimum: 0
          description: Number of intents in the bucket carrying this tag.
    IntentContextCountsDto:
      type: object
      required:
        - inbox_help
        - fridge
        - archive
        - pinned
        - untagged
        - archive_untagged
        - fridge_untagged
        - terminal_running
        - tags
        - archive_tags
        - fridge_tags
      properties:
        inbox_help:
          type: integer
          format: int32
          minimum: 0
          description: Intents in status `awaiting_operator` (inbox «жду ответа»).
        fridge:
          type: integer
          format: int32
          minimum: 0
          description: Intents in the `fridge` bucket.
        archive:
          type: integer
          format: int32
          minimum: 0
          description: Intents in archive statuses (`done` + `reject`).
        pinned:
          type: integer
          format: int32
          minimum: 0
          description: Distinct intents pinned into at least one context.
        untagged:
          type: integer
          format: int32
          minimum: 0
          description: Active intents (non-archive, non-fridge) carrying no tags.
        archive_untagged:
          type: integer
          format: int32
          minimum: 0
          description: Archive intents carrying no tags.
        fridge_untagged:
          type: integer
          format: int32
          minimum: 0
          description: Fridge intents carrying no tags.
        terminal_running:
          type: integer
          format: int32
          minimum: 0
          description: >
            Intents with a live embedded-terminal tmux session right now (cross-context,
            independent of tag/status). Read live from tmux on every request — there is no
            DB mirror, so the counter self-heals if a realtime hint is lost.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/IntentContextTagCountDto'
          description: >
            Per-tag counts across active intents (non-archive, non-fridge), sorted by
            count desc then tag name asc. An intent with N tags contributes to each tag.
        archive_tags:
          type: array
          items:
            $ref: '#/components/schemas/IntentContextTagCountDto'
          description: Per-tag counts across archive intents, sorted by count desc then tag name asc.
        fridge_tags:
          type: array
          items:
            $ref: '#/components/schemas/IntentContextTagCountDto'
          description: Per-tag counts across fridge intents, sorted by count desc then tag name asc.
    IntentDetailDto:
      type: object
      required:
        - id
        - status
        - current_version
        - tags
        - text
        - sort_key
        - created_at
        - updated_at
        - links
        - pinned_in
        - cleanup_local_state_on_done
      properties:
        id:
          type: string
          description: Intent identifier (24 hex chars, ObjectId-shaped).
        status:
          $ref: '#/components/schemas/IntentStatus'
        current_version:
          type: integer
          format: int32
          minimum: 1
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRefDto'
          description: Tags currently attached to the intent (id + display name).
        title:
          type: string
          nullable: true
          description: Optional title. Null when the intent is untitled; render a text snippet fallback in that case.
        text:
          type: string
          description: Full canonical Intent.Text.
        sort_key:
          type: string
          minLength: 1
          description: Fractional sort key (base62). Stable across edits; only changes via /move.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: '#/components/schemas/IntentLinkViewDto'
          description: >
            Outgoing + incoming graph edges, projected against the current owner's intents.
            Use `list_intent_links` for paginated access when this list grows large.
        pinned_in:
          type: array
          items:
            $ref: '#/components/schemas/PinnedContextDto'
          description: Per-context pin entries for this intent. Empty array means «not pinned anywhere». Each entry carries the tag id and the fractional pin_sort_key, so clients can render the per-context Pinned list in the server-defined order.
        cleanup_local_state_on_done:
          type: boolean
          description: >
            Teardown-on-done gate (default true). When the intent reaches `done` and this is true,
            its local state is destroyed — the workspace folder + agent trust entries are wiped and
            the agent terminal session is killed. Cleared keeps both alive past `done`. Edited via
            `setIntentCleanupOnDone`; surfaced here so the UI can render the current value.
    IntentEventDto:
      type: object
      required:
        - id
        - intent_id
        - kind
        - created_at
      properties:
        id:
          type: string
          description: Event identifier.
        intent_id:
          type: string
          description: >
            Primary subject of the event. For text events — the intent whose text changed.
            For link events — the `from_id` of the edge.
        peer_intent_id:
          type: string
          description: >
            Other endpoint of a link event (the `to_id`); absent for non-link events.
            Allows the timeline of either endpoint to surface the event.
        kind:
          type: string
          enum:
            - text_changed
            - link_added
            - link_removed
        version:
          type: integer
          format: int32
          minimum: 1
          description: For `text_changed`, the resulting `current_version`. Absent for link events.
        text_change:
          $ref: '#/components/schemas/IntentEventTextChangeDto'
        link:
          $ref: '#/components/schemas/IntentEventLinkPayloadDto'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          enum: [user, agent, system]
          description: Author. Absent for `link_removed` (no author tracked at delete time in stage 2).
    IntentEventTextChangeDto:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [create, replace, insert]
        snapshot:
          type: string
          description: Full text snapshot. Present for kind=create (v1).
        old_text:
          type: string
          description: Replaced fragment. Present for kind=replace.
        new_text:
          type: string
          description: New fragment. Present for kind=replace.
        after_line:
          type: integer
          format: int32
        insert_text:
          type: string
    IntentEventLinkPayloadDto:
      type: object
      required:
        - id
        - from_id
        - to_id
        - blocking
        - author
        - created_at
      properties:
        id:
          type: string
        from_id:
          type: string
        to_id:
          type: string
        blocking:
          type: boolean
          description: True when the edge is a hard dependency that blocks work.
        author:
          $ref: '#/components/schemas/IntentLinkAuthor'
        rationale:
          type: string
        created_at:
          type: string
          format: date-time
    IntentLinkAuthor:
      type: string
      enum:
        - user
        - agent
      description: Who authored the edge.
    IntentLinkDirection:
      type: string
      enum:
        - outgoing
        - incoming
      description: Direction of the edge relative to the queried intent.
    IntentLinkDto:
      type: object
      required:
        - id
        - from_id
        - to_id
        - blocking
        - author
        - created_at
      properties:
        id:
          type: string
          description: Edge identifier.
        from_id:
          type: string
          description: Source intent id.
        to_id:
          type: string
          description: Target intent id.
        blocking:
          type: boolean
          description: True when the edge is a hard dependency that blocks work.
        author:
          $ref: '#/components/schemas/IntentLinkAuthor'
        rationale:
          type: string
          description: Optional free-text justification supplied by user/agent.
        created_at:
          type: string
          format: date-time
    IntentLinkPeerDto:
      type: object
      required:
        - id
        - status
        - current_version
        - sort_key
        - text_short
        - tags
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/IntentStatus'
        current_version:
          type: integer
          format: int32
          minimum: 1
        sort_key:
          type: string
        text_short:
          type: string
          maxLength: 140
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRefDto'
    IntentLinkViewDto:
      type: object
      required:
        - link
        - direction
        - peer
      properties:
        link:
          $ref: '#/components/schemas/IntentLinkDto'
        direction:
          $ref: '#/components/schemas/IntentLinkDirection'
        peer:
          $ref: '#/components/schemas/IntentLinkPeerDto'
    IntentLinksPageDto:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntentLinkViewDto'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent on the final page.
    IntentLinksSummaryDto:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntentLinksSummaryEntryDto'
          description: >
            One entry per requested intent id that has at least one incident edge.
            Ids without any edges are omitted; the client must default missing ids
            to «no links».
    IntentLinksSummaryEntryDto:
      type: object
      required:
        - intent_id
        - blocked_by
        - blocks
        - linked_from
        - linked_to
      properties:
        intent_id:
          type: string
          description: Intent the aggregate applies to.
        blocked_by:
          type: array
          items:
            $ref: '#/components/schemas/IntentLinkPeerDto'
          description: >
            Other intents (owned by the caller) that have an incoming
            `blocking=true` edge into this intent — the «blocked by N» badge group.
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/IntentLinkPeerDto'
          description: >
            Intents this intent points to via outgoing `blocking=true` edges.
        linked_from:
          type: array
          items:
            $ref: '#/components/schemas/IntentLinkPeerDto'
          description: >
            Intents that point at this intent via incoming `blocking=false` edges
            (soft parents / context sources).
        linked_to:
          type: array
          items:
            $ref: '#/components/schemas/IntentLinkPeerDto'
          description: >
            Intents this intent points to via outgoing `blocking=false` edges
            (soft descendants / context targets).
    CreateIntentLinkRequest:
      type: object
      required:
        - to_id
        - blocking
      properties:
        to_id:
          type: string
          description: Target intent id (must differ from path id).
        blocking:
          type: boolean
          description: True for hard dependency edges; false for soft context/provenance.
        rationale:
          type: string
          description: Optional free-text justification (≤ 1000 chars).
          maxLength: 1000
    IntentAttachmentDto:
      type: object
      required:
        - id
        - intent_id
        - file_name
        - content_type
        - size_bytes
        - created_at
      properties:
        id:
          type: string
          description: Attachment identifier (24 hex chars, ObjectId-shaped).
        intent_id:
          type: string
          description: Owning intent id.
        file_name:
          type: string
          description: Original file name from the upload.
        content_type:
          type: string
          description: Declared MIME type of the uploaded file.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Stored size in bytes.
        created_at:
          type: string
          format: date-time
