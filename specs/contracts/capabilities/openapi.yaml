openapi: "3.1.0"
info:
  title: Throne Capabilities
  version: "2.0.0"
  x-csharp-namespace: Throne.Capabilities.Contracts.Generated
  description: >
    Carrier-feature surface. A capability has multiple interchangeable providers
    and the operator picks one (e.g. «Открыть в IDE» → VS Code vs Cursor). Plain
    «фичи» that are not multi-provider are not capabilities — their availability
    is observed via the relevant probe surface, not gated by an opt-in toggle.
paths:
  /api/v1/settings/capabilities:
    get:
      operationId: listCapabilities
      tags: [Capabilities]
      summary: List carrier capabilities with available providers and selected provider.
      description: >
        Each entry exposes static metadata (`title`, `description`), the list of
        candidate providers with their live detection status and the currently
        `selected_provider` (null when no provider is selected/detected).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityDto'
  /api/v1/settings/capabilities/{name}/selected-provider:
    put:
      operationId: setCapabilitySelectedProvider
      tags: [Capabilities]
      summary: Select the active provider for a carrier capability.
      description: >
        Persists `selected_provider` for the capability identified by `name`.
        Pass `null` to clear the selection — the UI falls back to «whichever
        provider is detected» when only one candidate is available.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: '#/components/schemas/CapabilityName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCapabilityProviderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDto'
        '404':
          description: Unknown capability name or unknown provider for this capability.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    CapabilityName:
      type: string
      enum:
        - open_in_ide
        - open_in_terminal
      description: >
        Closed set of carrier capability keys. New entries are added only when a
        feature has multiple interchangeable providers.
    CapabilityProviderDto:
      type: object
      required:
        - name
        - title
        - detected
      properties:
        name:
          type: string
          minLength: 1
          description: Stable provider key (e.g. `vscode`, `cursor`).
        title:
          type: string
          minLength: 1
          description: Human label rendered in the radio.
        prerequisite_hint:
          type: string
          description: Operator-facing instruction for installing the missing prerequisite.
        detected:
          type: boolean
          description: True when the provider's prerequisite is satisfied on this host.
        detection_detail:
          type: string
          nullable: true
          description: Short free-form note from the detector (`code 1.95.3`, `cursor not found`).
    CapabilityDto:
      type: object
      required:
        - name
        - title
        - description
        - providers
      properties:
        name:
          $ref: '#/components/schemas/CapabilityName'
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        selected_provider:
          type: string
          nullable: true
          description: >
            Operator-selected provider name. Null when nothing is persisted —
            consumers fall back to the single detected provider when only one
            candidate exists.
        providers:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityProviderDto'
    SetCapabilityProviderRequest:
      type: object
      properties:
        selected_provider:
          type: string
          nullable: true
          description: Provider name to persist as selected. Pass null to clear.
