openapi: "3.1.0"
info:
  title: Throne Instruction Patches
  version: "1.0.0"
  description: >
    HTTP surface for InstructionPatch (ADR-0021 supersedes ADR-0011). Patches
    are first-class entities that supersede the DreamRun + DreamProposal model:
    a frontier agent proposes a patch via MCP `propose_instruction_patch`, and
    the operator decides through this HTTP surface — apply (verbatim or with
    edit) or reject (with mandatory comment ≥10 chars). Apply runs through
    `IInstructionRepository.ReplaceTextAsync(expectedVersion=base_instruction_version)`;
    a mismatch returns `409 instruction_patch.needs_rebase` without mutation.
    On apply every cited InsightCard cascades to `referenced`. All endpoints
    are owner-scoped via the ambient `ICurrentUserAccessor`.
  x-csharp-namespace: Throne.InstructionPatches.Contracts.Generated
paths:
  /api/v1/instruction-patches:
    get:
      operationId: listInstructionPatches
      tags: [InstructionPatches]
      summary: List InstructionPatches (newest first), paginated.
      parameters:
        - in: query
          name: target_kind
          required: false
          schema:
            $ref: '#/components/schemas/InstructionPatchTargetKind'
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/InstructionPatchStatus'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            description: Opaque continuation cursor returned by the previous page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionPatchPageDto'
  /api/v1/instruction-patches/{patch_id}:
    get:
      operationId: getInstructionPatch
      tags: [InstructionPatches]
      summary: Single InstructionPatch with current target instruction text.
      parameters:
        - in: path
          name: patch_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionPatchDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/instruction-patches/{patch_id}/apply:
    post:
      operationId: applyInstructionPatch
      tags: [InstructionPatches]
      summary: Apply a patch (verbatim or with operator edit).
      description: >
        When `final_text` is omitted the patch is applied verbatim and the
        resulting status is `applied`. When `final_text` differs from
        `patch_text` the resulting status is `applied_edited` and `applied_text`
        records the user's edit. Validates `base_instruction_version`; mismatch
        returns 409 `instruction_patch.needs_rebase` without mutation.
      parameters:
        - in: path
          name: patch_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyInstructionPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionPatchDto'
        '404':
          description: Patch or target instruction not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Already decided or needs rebase
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/instruction-patches/{patch_id}/reject:
    post:
      operationId: rejectInstructionPatch
      tags: [InstructionPatches]
      summary: Reject a patch with a mandatory comment (≥10 chars after trimming).
      parameters:
        - in: path
          name: patch_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectInstructionPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionPatchDto'
        '404':
          description: Patch not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Already decided
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (e.g. comment too short)
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    InstructionPatchTargetKind:
      type: string
      enum: [common, interview, work, dream, transfer]
      description: Which user instruction kind the patch is meant to replace.
    InstructionPatchStatus:
      type: string
      enum: [proposed, applied, applied_edited, rejected, superseded]
    InstructionPatchDto:
      type: object
      required:
        - id
        - target_kind
        - status
        - patch_text
        - evidence_card_ids
        - rationale
        - base_instruction_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Server-generated id (32 hex chars).
        target_kind:
          $ref: '#/components/schemas/InstructionPatchTargetKind'
        status:
          $ref: '#/components/schemas/InstructionPatchStatus'
        patch_text:
          type: string
          description: Original proposal as submitted by the agent.
        applied_text:
          type: string
          description: What the user actually applied (may differ from patch_text).
        evidence_card_ids:
          type: array
          items:
            type: string
        rationale:
          type: string
          maxLength: 500
        reject_comment:
          type: string
          minLength: 10
          description: Required when status=rejected; ≥10 chars after trimming.
        base_instruction_version:
          type: integer
          format: int32
          minimum: 1
        applied_instruction_version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
    InstructionPatchPageDto:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstructionPatchDto'
        next_cursor:
          type: string
          description: Opaque continuation token; null when the page exhausted the result set.
    InstructionPatchDetailDto:
      type: object
      required:
        - patch
        - current_instruction_text
        - current_instruction_version
        - base_version_matches_current
        - base_instruction_text
      properties:
        patch:
          $ref: '#/components/schemas/InstructionPatchDto'
        current_instruction_text:
          type: string
          description: Current text of the target user instruction; empty string when missing.
        current_instruction_version:
          type: integer
          format: int32
          minimum: 0
        base_version_matches_current:
          type: boolean
          description: True when patch.base_instruction_version == current_instruction_version.
        base_instruction_text:
          type: string
          description: >
            Instruction text reconstructed at `patch.base_instruction_version` — i.e.
            the text the agent saw when proposing the patch. Empty string when the
            patch creates the instruction from scratch (`base_instruction_version=0`)
            or when version history is not available. Used by the operator UI to
            render a diff `base → patch` (or `base → applied`) regardless of how
            many further versions have been written on top of the base.
    ApplyInstructionPatchRequest:
      type: object
      properties:
        final_text:
          type: string
          description: Operator-edited text. When omitted, the server uses patch_text verbatim.
    RejectInstructionPatchRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 10
          description: Why the user is rejecting the patch. Stored as part of the patch state.
