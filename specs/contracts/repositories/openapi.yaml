openapi: "3.1.0"
info:
  title: Throne Repositories
  version: "1.0.0"
  x-csharp-namespace: Throne.Repositories.Contracts.Generated
paths:
  /api/v1/git-providers/{provider}/repositories/search:
    get:
      operationId: searchGitProviderRepositories
      tags: [GitProviders]
      summary: Search the current user's accessible repositories for a git provider.
      description: >
        Two scopes are supported (see ADR-0024 / ADR-0032). `mine` (default)
        lists only repositories owned by the authenticated account. `involved`
        additionally includes repositories where the account participates
        (GitHub collaborator/org-member, GitLab membership). Provider
        implementations may filter client-side over `full_name`.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Optional case-insensitive substring filter applied client-side over `full_name`.
        - in: query
          name: scope
          required: false
          schema:
            $ref: '#/components/schemas/RepositorySearchScope'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitRepositoryRefDto'
        '422':
          description: Provider unauthenticated or invalid scope.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/git-providers/{provider}/repositories/my:
    get:
      operationId: listGitProviderRepositories
      tags: [GitProviders]
      summary: List repositories owned by the authenticated provider account.
      description: >
        Alias for `searchGitProviderRepositories` with `scope=mine` and no `q`. Provided as a dedicated
        endpoint for the modal's default state so the UI can avoid wiring scope/q parameters.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitRepositoryRefDto'
        '422':
          description: Provider unauthenticated.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/git-providers/{provider}/repositories/{owner}/{repo}/branches:
    get:
      operationId: listGitProviderRepositoryBranches
      tags: [GitProviders]
      summary: List branches of a repository for typeahead.
      description: >
        Backs the branch combobox in the bind-repository modal. Optional `q` is a
        case-insensitive substring filter applied over branch name; `limit` caps
        the page size. Symmetric with `searchGitProviderRepositories`.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitBranchRefDto'
        '422':
          description: Provider unauthenticated or repository unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/git-providers/{provider}/repositories/{owner}/{repo}/pulls:
    get:
      operationId: listGitProviderRepositoryPullRequests
      tags: [GitProviders]
      summary: List open pull requests / merge requests of a repository for typeahead.
      description: >
        Backs the PR/MR combobox in the bind-repository modal. Only open change
        requests are returned. Optional `q` is a case-insensitive substring filter
        over `#{number}` / `title` / `head_ref`.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitPullRequestRefDto'
        '422':
          description: Provider unauthenticated or repository unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories:
    get:
      operationId: listIntentRepositories
      tags: [IntentRepositories]
      summary: List repository bindings attached to an intent.
      description: >
        Full binding cards consumed by the intent page and `bin/throne-review`
        binding discovery.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryBindingDto'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    post:
      operationId: bindIntentRepository
      tags: [IntentRepositories]
      summary: Bind a repository to an intent and enqueue its clone.
      description: >
        Creates an `IntentRepositoryBinding` in `pending` state, returns the binding immediately
        and lets `RepositoryCloneService` (background) move it through `cloning → ready | failed`.
        Re-binding the same `(provider, owner, repo)` to the same intent is rejected with 409
        per ADR-0024 — change PR via unbind + rebind.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindIntentRepositoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryBindingDto'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: A binding for the same (provider, owner, repo) already exists.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (e.g. provider unsupported, owner/repo malformed).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}:
    delete:
      operationId: unbindIntentRepository
      tags: [IntentRepositories]
      summary: Delete a repository binding from an intent.
      description: >
        Removes the binding record AND its on-disk workspace directory. Idempotent —
        returns 204 whether or not the binding existed. If the directory cannot be
        deleted (locked / permission denied) the binding is kept and a 500 is returned
        so the operation can be retried.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted (or already absent).
        '500':
          description: The workspace directory could not be removed; binding left intact.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/sync:
    post:
      operationId: syncIntentRepositoryPullRequest
      tags: [IntentRepositories]
      summary: Synchronously re-read PR review comments from the provider for a binding.
      description: >
        Blocks for the duration of the upstream `gh api` call and returns the freshly observed
        comments straight from the git provider (no durable local comment store).
        `intent.pr_comment_added` is also fanned out via SSE for other open clients.
        Works on closed/merged PRs too — `pull_request_state` is ignored. A 404 from upstream
        flips the binding to `clone_status=broken` per ADR-0024.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestSyncResultDto'
        '404':
          description: Intent or binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/refresh:
    post:
      operationId: refreshIntentRepository
      tags: [IntentRepositories]
      summary: Restore the local clone of a binding whose workspace folder is missing.
      description: >
        Disk-recovery for the «Обновить» button (ADR-0024). The binding lives in Mongo but its
        local workspace folder is gone — typically a second machine that never cloned it. The
        path is recomputed against the live workspace root (not the stored `workspace_path`,
        which may carry another machine's root), and existence is checked on disk only.
        Folder missing → the binding is flipped back to `pending` (regardless of its current
        `clone_status`) and re-enqueued onto the clone pipeline; the response carries the
        binding in `pending`/`cloning` and the UI follows `intent.repository_clone_progress`
        to `ready`. Folder present → no-op, the current binding is returned unchanged.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK — the binding, re-queued for clone when its folder was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryBindingDto'
        '404':
          description: Intent or binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request:
    post:
      operationId: attachIntentRepositoryPullRequest
      tags: [IntentRepositories]
      summary: Attach a pull request to an already-bound repository.
      description: >
        Fills the empty pull-request slot of an existing binding without delete/rebind —
        the workspace is untouched. Rejected with 409 when a PR is already attached (unbind
        and rebind to switch). The auto-bind background pass links PRs created by the agent
        automatically; this endpoint covers the manual case and pointing a secondary intent's
        binding at a shared PR.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachIntentRepositoryPullRequestRequest'
      responses:
        '200':
          description: OK — the binding with its newly attached pull request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryBindingDto'
        '404':
          description: Intent or binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: A pull request is already attached to this binding.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request/comments:
    get:
      operationId: listIntentRepositoryPullRequestComments
      tags: [IntentRepositories]
      summary: List the binding's PR review comments via the git provider.
      description: >
        Proxies the upstream `gh api .../pulls/{n}/comments` call through the binding's git
        provider and returns the freshly observed feed, ordered ascending by `created_at`.
        Comments are NOT durably stored server-side — the git provider is the source of truth;
        the server keeps only an etag/cursor on the binding for the background poller. Review
        comments only (issue-comments are out of scope). Pagination is intentionally absent;
        the server returns the full feed.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: query
          name: since
          required: false
          schema:
            type: string
            format: date-time
          description: When supplied, only comments with `created_at >= since` are returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequestCommentDto'
        '404':
          description: Intent or binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/review/diff:
    get:
      operationId: getIntentRepositoryReviewDiff
      tags: [IntentRepositories]
      summary: Read the provider-derived diff of the binding's pull request or one of its commits.
      description: >
        Slice 4A — backs the review workspace. Diff is read from the provider on demand
        (`gh` / `glab`) and is never persisted server-side. `scope=request` returns the full
        PR/MR diff against its base; `scope=commit` returns the diff of `commit_sha` against
        its parent. SHAs are carried back to the UI so a follow-up `submitIntentRepositoryReviewComment`
        can round-trip the anchor without an extra fetch.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: query
          name: scope
          required: false
          schema:
            $ref: '#/components/schemas/ReviewDiffScope'
        - in: query
          name: commit_sha
          required: false
          schema:
            type: string
            minLength: 7
          description: Required when `scope=commit`; ignored for `scope=request`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestDiffDto'
        '404':
          description: Intent, binding or upstream PR/commit not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Provider unauthenticated, scope mismatch, or missing commit_sha.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/review/file-lines:
    get:
      operationId: getIntentRepositoryReviewFileLines
      tags: [IntentRepositories]
      summary: Read a line range from a file blob in the binding's local clone.
      description: >
        Backs review diff context expansion. The server reads `path` from `sha` in
        the local workspace clone via plain git, retries once with
        `git fetch --filter=blob:none origin {sha}` when the object is missing,
        and returns only a typed ProblemDetails error when the object/path remains
        unavailable. Context is always read from the new file side; clients pass
        `PullRequestDiffDto.head_sha` and `PullRequestDiffFileDto.path`.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: query
          name: sha
          required: true
          schema:
            type: string
            minLength: 7
        - in: query
          name: path
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: from
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: to
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewFileLinesDto'
        '404':
          description: Intent, binding, git object or file path not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Local repository clone is not ready.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Invalid line range or query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/review/pull-request:
    get:
      operationId: getIntentRepositoryPullRequest
      tags: [IntentRepositories]
      summary: Read the header of the binding's pull request (title, state, author, branches, description).
      description: >
        Backs the review-workspace "Описание" tab. The header is read from the provider
        on demand (`gh` / `glab`) and is never persisted server-side — same read-through
        contract as the diff endpoint. The `body` field carries the PR/MR description as
        Markdown for client-side rendering.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestHeaderDto'
        '404':
          description: Intent, binding or upstream PR not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Provider unauthenticated or unsupported.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/review/commits:
    get:
      operationId: listIntentRepositoryReviewCommits
      tags: [IntentRepositories]
      summary: List the commits that belong to the binding's pull request.
      description: >
        Slice 4A — backs the per-commit selector in the review workspace. Read straight
        from the provider (no durable cache). Ordered by commit timestamp ascending.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequestCommitDto'
        '404':
          description: Intent, binding or upstream PR not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Provider unauthenticated.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/review/comments:
    post:
      operationId: submitIntentRepositoryReviewComment
      tags: [IntentRepositories]
      summary: Submit an inline review comment to the provider.
      description: >
        Slice 4A — pushes a single inline review comment directly to the provider
        (GitHub review comment / GitLab MR discussion). Server is pointer-only: the
        comment is not stored locally. Anchor SHAs and paths come from a prior
        `getIntentRepositoryReviewDiff` response. The echoed comment is what the UI
        renders immediately; the comments feed is refreshed via the existing
        `listIntentRepositoryPullRequestComments` path.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewCommentRequest'
      responses:
        '201':
          description: Created — the freshly submitted comment as echoed by the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedReviewCommentDto'
        '404':
          description: Intent, binding or upstream PR not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Anchor invalid (outdated SHA, line not in diff) or provider unauthenticated.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request-comments/{comment_id}:
    delete:
      operationId: deleteIntentRepositoryPullRequestComment
      tags: [IntentRepositories]
      summary: Delete a review comment at the provider.
      description: >
        Removes a single inline review comment directly at the provider
        (GitHub `DELETE .../pulls/comments/{id}` / GitLab discussion note delete).
        Server is pointer-only — nothing is stored locally. `thread_id` is required for
        providers whose delete path is scoped to the thread (GitLab note); GitHub ignores it.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: path
          name: comment_id
          required: true
          schema:
            type: string
          description: Upstream comment id as carried by `PullRequestCommentDto.id`.
        - in: query
          name: thread_id
          required: false
          schema:
            type: string
          description: Provider thread/discussion id; required for GitLab note deletion.
      responses:
        '204':
          description: Comment deleted.
        '404':
          description: Intent, binding or comment not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Provider unauthenticated, or thread_id missing where required.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request-threads/{thread_id}:
    patch:
      operationId: updateIntentRepositoryReviewThread
      tags: [IntentRepositories]
      summary: Resolve or reopen a review thread at the provider.
      description: >
        Toggles the resolution state of a review thread directly at the provider
        (GitHub `resolveReviewThread` / `unresolveReviewThread` graphql mutation,
        GitLab discussion `resolved` flag). Throne stores no local status — the
        returned `resolved` is read back from the provider response.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: path
          name: thread_id
          required: true
          schema:
            type: string
          description: Provider thread/discussion id as carried by `PullRequestCommentDto.thread_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewThreadRequest'
      responses:
        '200':
          description: OK — the thread's resolution state as echoed by the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewThreadDto'
        '404':
          description: Intent, binding or thread not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Provider unauthenticated or thread not resolvable.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request/merge-status:
    get:
      operationId: getIntentRepositoryPullRequestMergeStatus
      tags: [IntentRepositories]
      summary: Read the binding's PR/MR mergeability and checks state from the provider.
      description: >
        Slice C — backs the merge control in the review workspace. Mergeability and
        checks state are read straight from the provider on demand (GitHub
        `mergeable`/`mergeStateStatus`/`statusCheckRollup`, GitLab
        `detailed_merge_status` + head pipeline). `html_url` points at the PR/MR page so
        the UI can send the reviewer to the provider when a merge is not possible.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK — provider-neutral mergeability + checks snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestMergeStatusDto'
        '404':
          description: Intent, binding or upstream PR not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Provider unsupported or unauthenticated.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request/merge:
    post:
      operationId: mergeIntentRepositoryPullRequest
      tags: [IntentRepositories]
      summary: Merge the binding's PR/MR at the provider.
      description: >
        Slice C — merges the attached pull/merge request via the provider CLI
        (`gh pr merge` / `glab mr merge`) with the chosen strategy and optional
        source-branch deletion. When the provider refuses the merge (conflicts,
        failing checks, branch protection) the call returns `409` with the
        provider's reason so the reviewer can resolve it on the provider page.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePullRequestRequest'
      responses:
        '200':
          description: OK — the PR/MR was merged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergePullRequestResultDto'
        '404':
          description: Intent, binding or upstream PR not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no PR attached, or the provider refused the merge.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Provider unsupported or unauthenticated.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories:
    get:
      operationId: listRepositories
      tags: [Repositories]
      summary: List every repository in the registry.
      description: >
        Metadata-only registry rows (ADR-0031), ordered by coordinate. A row materialises
        the first time a `(provider, owner, repo)` coordinate surfaces — from a bind, a tag
        default, a knowledge-page write, or manual `createRepository`. Knowledge pages are
        NOT embedded here; fetch them via `listRepositoryDocuments`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryDto'
    post:
      operationId: createRepository
      tags: [Repositories]
      summary: Manually register a repository by coordinate.
      description: >
        Idempotent registration of a `(provider, owner, repo)` coordinate (ADR-0031), backing
        the manual "add repository" affordance with the provider repository autocomplete.
        Returns `201` when the row is created and `200` when the
        coordinate was already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepositoryRequest'
      responses:
        '200':
          description: The coordinate was already registered; the existing row is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDto'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDto'
        '422':
          description: Coordinate failed validation (unknown provider, malformed owner/repo).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}:
    get:
      operationId: getRepository
      tags: [Repositories]
      summary: Get a single registry row by coordinate.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDto'
        '404':
          description: No registry row for this coordinate.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}/documents:
    get:
      operationId: listRepositoryDocuments
      tags: [Repositories]
      summary: List the knowledge pages of a repository (no bodies).
      description: >
        Summary cards for each `RepositoryArtifact` page anchored to the coordinate (ADR-0031),
        ordered by slug. The markdown `document` body is deliberately omitted here — fetch a
        single page via `getRepositoryDocument`. An unknown coordinate yields an empty array.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryDocumentSummaryDto'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}/documents/{slug}:
    get:
      operationId: getRepositoryDocument
      tags: [Repositories]
      summary: Get a single knowledge page with its markdown body.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDocumentDto'
        '404':
          description: No page with this slug for the coordinate.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    put:
      operationId: putRepositoryDocument
      tags: [Repositories]
      summary: Create or update a knowledge page (manual edit).
      description: >
        User-driven knowledge-page write path (ADR-0031). Upsert: the first write
        (`expected_version` absent or 0) creates version 1; an update requires
        `expected_version == current` or fails with `409`. Optimistic concurrency
        via `expected_version`.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRepositoryDocumentRequest'
      responses:
        '200':
          description: OK — the page after this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDocumentDto'
        '409':
          description: Optimistic concurrency conflict; `expected_version` did not match.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate, slug or body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}/documents/{slug}/versions:
    get:
      operationId: listRepositoryDocumentVersions
      tags: [Repositories]
      summary: Version history timeline of a knowledge page.
      description: >
        Append-only full snapshots of the page (ADR-0031), ordered by `version` ASC, for the
        history timeline. Each entry carries the body at that revision.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryDocumentVersionDto'
        '404':
          description: No page with this slug for the coordinate.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{binding_id}/artifacts:
    get:
      operationId: listPullRequestArtifacts
      tags: [Repositories]
      summary: List latest pull request artifacts for a repository binding.
      description: >
        One-shot PR verification artifacts (ADR-0031), ordered by `type`. The binding must
        exist only for writes; reads return the durable rows currently present for the
        binding id and an unknown binding yields an empty array.
      parameters:
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequestArtifactDto'
  /api/v1/repositories/{binding_id}/artifacts/{type}:
    get:
      operationId: getPullRequestArtifact
      tags: [Repositories]
      summary: Get a single latest pull request artifact by type.
      parameters:
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: path
          name: type
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestArtifactDto'
        '404':
          description: No artifact of this type for the binding.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    put:
      operationId: putPullRequestArtifact
      tags: [Repositories]
      summary: Idempotently ingest a latest pull request artifact.
      description: >
        Durable latest-wins ingest for ADR-0031 PR artifacts. The server derives
        `pull_request_number` from the durable binding; the request replaces the current
        artifact for `(binding_id, type)` wholesale and emits `pull_request.artifact_updated`.
      parameters:
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: path
          name: type
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutPullRequestArtifactRequest'
      responses:
        '200':
          description: OK — the artifact after this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestArtifactDto'
        '404':
          description: Repository binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: The binding has no pull request attached.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Type or body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    GitProvider:
      type: string
      enum:
        - github
        - gitlab
      description: >
        Set of supported git providers.
    RepositorySearchScope:
      type: string
      enum:
        - mine
        - involved
      description: >
        `mine` — only repositories owned by the authenticated user (default).
        `involved` — additionally collaborator / org-member repos.
    CloneStatus:
      type: string
      enum:
        - pending
        - cloning
        - ready
        - failed
        - broken
      description: >
        Lifecycle of a binding's local clone (see ADR-0024). `broken` means the clone was once
        `ready` but the upstream repository stopped responding (404).
    PullRequestState:
      type: string
      enum:
        - open
        - closed
        - merged
      description: Upstream lifecycle state of the linked pull request.
    GitRepositoryRefDto:
      type: object
      required:
        - provider
        - owner
        - repo
        - full_name
        - default_branch
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        host:
          type: string
          minLength: 1
          description: Provider host. GitHub is always `github.com`; GitLab uses the configured self-managed host.
        owner:
          type: string
          minLength: 1
        repo:
          type: string
          minLength: 1
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Stable GitLab project id when known; null for GitHub.
        full_name:
          type: string
          description: '`{owner}/{repo}` — convenience field for UI rendering.'
        default_branch:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        private:
          type: boolean
        html_url:
          type: string
          format: uri
          nullable: true
    GitBranchRefDto:
      type: object
      required:
        - name
        - is_default
      properties:
        name:
          type: string
          minLength: 1
          description: Branch name as reported by upstream (e.g. `main`).
        is_default:
          type: boolean
          description: Whether this is the repository's default branch.
    GitPullRequestRefDto:
      type: object
      required:
        - number
        - title
        - head_ref
        - state
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        head_ref:
          type: string
          minLength: 1
          description: Head branch ref of the pull request (source branch).
        state:
          $ref: '#/components/schemas/PullRequestState'
    AttachIntentRepositoryPullRequestRequest:
      type: object
      required:
        - pull_request_number
      properties:
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          description: Pull request number to attach to the binding.
    BindIntentRepositoryRequest:
      type: object
      required:
        - provider
        - owner
        - repo
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        host:
          type: string
          minLength: 1
          description: >
            Provider host persisted with the binding. GitHub defaults to `github.com`;
            GitLab stores the configured self-managed host.
        owner:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            GitHub user/org login, or GitLab namespace path (`group/subgroup`).
            Validation is provider-aware server-side.
        repo:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Repository leaf slug. Validation is provider-aware server-side.
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Optional GitLab project id to persist once resolved by the bind flow.
        default_branch:
          type: string
          minLength: 1
          description: Optional override; defaults to the upstream's default branch on first clone.
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Optional pull request to track for the PR-comments feed.
    RepositoryBindingSummary:
      type: object
      required:
        - binding_id
        - provider
        - host
        - owner
        - repo
        - default_branch
        - workspace_path
        - clone_status
      properties:
        binding_id:
          type: string
        provider:
          $ref: '#/components/schemas/GitProvider'
        host:
          type: string
        owner:
          type: string
        repo:
          type: string
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        default_branch:
          type: string
        workspace_path:
          type: string
          description: Absolute path to the cloned working tree on the local filesystem.
        clone_status:
          $ref: '#/components/schemas/CloneStatus'
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        pull_request_state:
          allOf:
            - $ref: '#/components/schemas/PullRequestState'
          nullable: true
      description: >
        Compact repository binding projection for history/realtime contexts. The
        HTTP `listIntentRepositories` endpoint returns the full `RepositoryBindingDto`.
    RepositoryBindingDto:
      type: object
      required:
        - id
        - intent_id
        - provider
        - host
        - owner
        - repo
        - default_branch
        - workspace_path
        - clone_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        intent_id:
          type: string
        provider:
          $ref: '#/components/schemas/GitProvider'
        host:
          type: string
        owner:
          type: string
        repo:
          type: string
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        default_branch:
          type: string
        workspace_path:
          type: string
          description: Absolute path of the local clone (see ADR-0024 workspace layout).
        clone_status:
          $ref: '#/components/schemas/CloneStatus'
        clone_error:
          type: string
          nullable: true
          description: Human-readable error message when `clone_status` is `failed` or `broken`.
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        pull_request_state:
          allOf:
            - $ref: '#/components/schemas/PullRequestState'
          nullable: true
        review_comments_etag:
          type: string
          nullable: true
          description: >
            Last ETag observed for the PR review-comments feed. Used for conditional GET on
            the next polling cycle.
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PullRequestCommentDto:
      type: object
      required:
        - id
        - binding_id
        - author_login
        - body
        - created_at
      properties:
        id:
          type: string
          description: Upstream comment id (stringified for wire stability).
        binding_id:
          type: string
        author_login:
          type: string
          description: GitHub login of the comment author.
        author_avatar_url:
          type: string
          format: uri
          nullable: true
        body:
          type: string
        html_url:
          type: string
          format: uri
          nullable: true
        path:
          type: string
          nullable: true
          description: File path the review comment is anchored to, when available.
        line:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: >
            1-based line number on `side` the inline comment is anchored to. Null for
            comments without a diff anchor (issue/discussion-level comments) or outdated
            inline comments whose line no longer exists in the current diff.
        side:
          allOf:
            - $ref: '#/components/schemas/ReviewCommentSide'
          nullable: true
          description: Diff side `line` refers to. Null when the comment has no diff anchor.
        resolved:
          type: boolean
          nullable: true
          description: >
            Resolution state of the comment's review thread, read from the provider
            (Throne stores no local status). Null when the comment is not part of a
            resolvable thread (e.g. GitHub issue-level comments).
        thread_id:
          type: string
          nullable: true
          description: >
            Provider thread/discussion id the comment belongs to — GitHub review-thread
            node id, GitLab discussion id. Round-tripped into
            `updateIntentRepositoryReviewThread`. Null when no resolvable thread exists.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    PullRequestSyncResultDto:
      type: object
      required:
        - binding_id
        - new_comments
        - total_comments
        - comments
      properties:
        binding_id:
          type: string
        new_comments:
          type: integer
          format: int32
          minimum: 0
          description: Number of comments newly observed during this sync (those that triggered fanout).
        total_comments:
          type: integer
          format: int32
          minimum: 0
          description: Full count of review comments in the freshly observed feed after sync.
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestCommentDto'
          description: Full review-comments feed after sync (unpaginated).
        pull_request_state:
          allOf:
            - $ref: '#/components/schemas/PullRequestState'
          nullable: true
        last_synced_at:
          type: string
          format: date-time
          nullable: true
    ReviewDiffScope:
      type: string
      enum:
        - request
        - commit
      description: >
        `request` — diff of the whole pull/merge request against its base (default).
        `commit` — diff of a single commit by SHA (requires `commit_sha`).
    PullRequestDiffFileStatus:
      type: string
      enum:
        - added
        - modified
        - removed
        - renamed
        - copied
      description: Lifecycle of a file inside a provider-derived diff.
    ReviewCommentSide:
      type: string
      enum:
        - right
        - left
      description: >
        Side of the diff a review comment is anchored to. `right` — new (post-change)
        side; `left` — old (pre-change) side. Maps to GitHub `RIGHT`/`LEFT` and to
        GitLab `new_line` / `old_line` position fields respectively.
    PullRequestDiffFileDto:
      type: object
      required:
        - path
        - status
        - patch
      properties:
        path:
          type: string
          minLength: 1
          description: New (post-change) path of the file in the repository.
        previous_path:
          type: string
          nullable: true
          description: Old path when the file was renamed/copied; null otherwise.
        status:
          $ref: '#/components/schemas/PullRequestDiffFileStatus'
        patch:
          type: string
          description: Raw unified-diff hunks for this file; empty for binary/too-large diffs.
    PullRequestHeaderDto:
      type: object
      required:
        - number
        - state
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
          description: PR/MR number within the repository.
        title:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/PullRequestState'
        author_login:
          type: string
          nullable: true
          description: Provider login of the PR/MR author.
        author_avatar_url:
          type: string
          format: uri
          nullable: true
        head_ref:
          type: string
          nullable: true
          description: Source branch the PR/MR merges from.
        base_ref:
          type: string
          nullable: true
          description: Target branch the PR/MR merges into.
        html_url:
          type: string
          format: uri
          nullable: true
        body:
          type: string
          nullable: true
          description: PR/MR description as Markdown.
    PullRequestDiffDto:
      type: object
      required:
        - base_sha
        - head_sha
        - start_sha
        - files
      properties:
        base_sha:
          type: string
          minLength: 7
          description: SHA the diff is computed against (PR base or commit parent).
        head_sha:
          type: string
          minLength: 7
          description: SHA of the diff's head end (PR head or commit itself).
        start_sha:
          type: string
          minLength: 7
          description: >
            Start SHA — equals `base_sha` for the request scope on GitHub. GitLab MRs
            distinguish `start_sha` from `base_sha` for the discussion position; the
            UI must round-trip both back into `submitIntentRepositoryReviewComment`.
        files:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestDiffFileDto'
    ReviewFileLineDto:
      type: object
      required:
        - line
        - content
      properties:
        line:
          type: integer
          format: int32
          minimum: 1
          description: 1-based line number in the requested file blob.
        content:
          type: string
          description: Line content without a trailing newline.
    ReviewFileLinesDto:
      type: object
      required:
        - from
        - to
        - total_lines
        - lines
      properties:
        from:
          type: integer
          format: int32
          minimum: 1
          description: Requested start line.
        to:
          type: integer
          format: int32
          minimum: 0
          description: Actual inclusive end line returned; less than `from` when the range starts after EOF.
        total_lines:
          type: integer
          format: int32
          minimum: 0
          description: Total line count of the blob at `sha:path`.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFileLineDto'
    PullRequestCommitDto:
      type: object
      required:
        - sha
        - message
        - committed_at
      properties:
        sha:
          type: string
          minLength: 7
          description: Full commit SHA.
        message:
          type: string
          description: Commit message — first line is the title.
        author_login:
          type: string
          nullable: true
          description: Author's provider login when available; falls back to display name.
        committed_at:
          type: string
          format: date-time
    SubmitReviewCommentRequest:
      type: object
      required:
        - content
        - path
        - side
        - commit_sha
        - base_sha
        - start_sha
      properties:
        content:
          type: string
          minLength: 1
          description: Comment body (Markdown).
        path:
          type: string
          minLength: 1
          description: New path of the file the comment anchors to.
        previous_path:
          type: string
          nullable: true
          description: Old path when the file was renamed; otherwise omit.
        side:
          $ref: '#/components/schemas/ReviewCommentSide'
        old_line:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: 1-based line on the pre-change side. Set for `del` and context rows; required by GitLab for unchanged-line anchors.
        new_line:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: 1-based line on the post-change side. Set for `add` and context rows. At least one of `old_line` / `new_line` must be supplied.
        commit_sha:
          type: string
          minLength: 7
          description: Head SHA the anchor was computed against (from the diff response).
        base_sha:
          type: string
          minLength: 7
          description: Base SHA from the diff response (GitLab discussion position).
        start_sha:
          type: string
          minLength: 7
          description: Start SHA from the diff response (GitLab discussion position).
    SubmittedReviewCommentDto:
      type: object
      required:
        - id
        - binding_id
        - author_login
        - body
        - created_at
      properties:
        id:
          type: string
        binding_id:
          type: string
        author_login:
          type: string
        body:
          type: string
        html_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
    UpdateReviewThreadRequest:
      type: object
      required:
        - resolved
      properties:
        resolved:
          type: boolean
          description: >
            Target resolution state of the review thread. `true` resolves, `false`
            reopens. Applied at the provider (GitHub `resolveReviewThread` graphql
            mutation / GitLab discussion `resolved` flag); Throne keeps no local status.
    ReviewThreadDto:
      type: object
      required:
        - thread_id
        - resolved
      properties:
        thread_id:
          type: string
          description: Provider thread/discussion id whose state was just changed.
        resolved:
          type: boolean
          description: Resolution state as echoed back by the provider after the change.
    MergeStrategy:
      type: string
      enum:
        - merge
        - squash
        - rebase
      description: >
        How the PR/MR is integrated. `merge` — merge commit, `squash` — squash into
        a single commit, `rebase` — rebase the source commits onto the base. Maps to
        `gh pr merge --merge/--squash/--rebase` and `glab mr merge`/`--squash`/`--rebase`.
    PullRequestMergeability:
      type: string
      enum:
        - mergeable
        - conflicting
        - blocked
        - behind
        - checking
        - unknown
      description: >
        Provider-neutral mergeability. `mergeable` — can merge now; `conflicting` —
        merge conflicts; `blocked` — held by branch protection / approvals / unresolved
        discussions / draft; `behind` — source is behind the base and needs an update;
        `checking` — the provider is still computing the state; `unknown` — unrecognised.
    PullRequestChecksState:
      type: string
      enum:
        - none
        - pending
        - passing
        - failing
        - unknown
      description: >
        Aggregate state of CI checks on the PR/MR head. `none` — no checks configured;
        `pending` — checks still running; `passing` — all succeeded; `failing` — at least
        one failed; `unknown` — unrecognised.
    PullRequestMergeStatusDto:
      type: object
      required:
        - mergeability
        - checks
      properties:
        mergeability:
          $ref: '#/components/schemas/PullRequestMergeability'
        checks:
          $ref: '#/components/schemas/PullRequestChecksState'
        html_url:
          type: string
          format: uri
          nullable: true
          description: Browser-facing URL of the PR/MR page, when the provider reports it.
    MergePullRequestRequest:
      type: object
      required:
        - strategy
      properties:
        strategy:
          $ref: '#/components/schemas/MergeStrategy'
        delete_branch:
          type: boolean
          default: false
          description: Delete the source branch after a successful merge, when the provider allows it.
        suppress_auto_close:
          type: boolean
          default: false
          description: >-
            Auto-close-on-merge control (D2). When false (default) the merge keeps the current
            behaviour: once the PR/MR is observed merged on the next sync, the intent is
            auto-closed to done. Set to true to leave the intent open on this merge so its agent
            session stays alive for follow-up work; provider-neutral, applies to both GitHub and
            GitLab. Persisted on the binding as `SuppressMergeAutoClose`. Orthogonal to the
            teardown-on-done gate (`cleanup_local_state_on_done`), which is owned by the intent
            and edited via the intents `setIntentCleanupOnDone` endpoint.
    MergePullRequestResultDto:
      type: object
      required:
        - merged
        - pull_request_state
      properties:
        merged:
          type: boolean
          description: True when the provider reported the PR/MR as merged.
        pull_request_state:
          $ref: '#/components/schemas/PullRequestState'
        message:
          type: string
          nullable: true
          description: Provider's one-line summary of the merge outcome, when available.
    RepositoryDto:
      type: object
      required:
        - provider
        - host
        - owner
        - repo
        - full_name
        - created_at
        - updated_at
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        host:
          type: string
        owner:
          type: string
        repo:
          type: string
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        full_name:
          type: string
          description: '`{owner}/{repo}` — convenience field for UI rendering.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateRepositoryRequest:
      type: object
      required:
        - provider
        - host
        - owner
        - repo
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        host:
          type: string
          minLength: 1
        owner:
          type: string
          minLength: 1
          maxLength: 255
        repo:
          type: string
          minLength: 1
          maxLength: 100
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
    RepositoryDocumentSummaryDto:
      type: object
      required:
        - slug
        - title
        - version
        - created_at
        - updated_at
      properties:
        slug:
          type: string
        title:
          type: string
        version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: >
        Compact page card used by `listRepositoryDocuments`; omits the markdown `document`
        body to avoid shipping large payloads in a list (see `specs/contracts/AGENTS.md`).
    RepositoryDocumentDto:
      type: object
      required:
        - provider
        - host
        - owner
        - repo
        - slug
        - title
        - document
        - version
        - created_at
        - updated_at
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        host:
          type: string
        owner:
          type: string
        repo:
          type: string
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        slug:
          type: string
        title:
          type: string
        document:
          type: string
          description: Full markdown body of the page.
        version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PutRepositoryDocumentRequest:
      type: object
      required:
        - title
        - document
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        document:
          type: string
          description: Full markdown body; replaces the previous body wholesale on update.
        expected_version:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >
            Current version to update on top of; omit or 0 to create version 1. A mismatch
            fails with `409`.
    RepositoryDocumentVersionDto:
      type: object
      required:
        - version
        - title
        - document
        - created_at
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        document:
          type: string
        created_at:
          type: string
          format: date-time
    PullRequestArtifactRender:
      type: string
      enum:
        - markdown
        - mermaid
        - svg
        - json
      description: How a PR artifact body should be rendered (ADR-0031).
    PullRequestArtifactSource:
      type: string
      enum:
        - static
        - agent
      description: Producer family for a PR artifact.
    ReviewFileRisk:
      type: string
      enum:
        - high
        - medium
        - low
      description: Relative risk/centrality of a file, driving review reading order.
    ReviewFileOrderEntry:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          maxLength: 500
        risk:
          oneOf:
            - $ref: '#/components/schemas/ReviewFileRisk'
          nullable: true
    ReviewRecommendationContent:
      type: object
      description: >
        Typed content for artifacts of `type=review_recommendation` (ADR-0031). Every field is
        optional: a partial payload is valid and the UI degrades gracefully. The artifact's
        `content` string remains the human-readable markdown recommendation; this object carries
        the machine-readable signals the UI consumes (currently AI file ordering — impact and
        provenance fields will be added when a UI consumer materialises).
      properties:
        file_order:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ReviewFileOrderEntry'
    PullRequestArtifactDto:
      type: object
      required:
        - id
        - binding_id
        - pull_request_number
        - type
        - render
        - content
        - summary
        - source
        - source_refs
        - produced_at
      properties:
        id:
          type: string
        binding_id:
          type: string
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
        type:
          type: string
          minLength: 1
          maxLength: 80
        render:
          $ref: '#/components/schemas/PullRequestArtifactRender'
        content:
          type: string
        summary:
          type: string
          minLength: 1
          maxLength: 300
        source:
          $ref: '#/components/schemas/PullRequestArtifactSource'
        source_refs:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 500
        head_sha:
          type: string
          maxLength: 100
          description: >
            Head commit sha of the PR when this artifact was produced. The UI marks the
            artifact stale if the PR head has moved past it. Optional, set by the producer.
        review_recommendation:
          $ref: '#/components/schemas/ReviewRecommendationContent'
        produced_at:
          type: string
          format: date-time
    PutPullRequestArtifactRequest:
      type: object
      required:
        - render
        - content
        - summary
        - source
        - source_refs
        - produced_at
      properties:
        render:
          $ref: '#/components/schemas/PullRequestArtifactRender'
        content:
          type: string
        summary:
          type: string
          minLength: 1
          maxLength: 300
        source:
          $ref: '#/components/schemas/PullRequestArtifactSource'
        source_refs:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 500
        head_sha:
          type: string
          maxLength: 100
          description: >
            Head commit sha of the PR when this artifact was produced. The UI marks the
            artifact stale if the PR head has moved past it. Optional, set by the producer.
        review_recommendation:
          $ref: '#/components/schemas/ReviewRecommendationContent'
        produced_at:
          type: string
          format: date-time
