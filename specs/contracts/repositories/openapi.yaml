openapi: "3.1.0"
info:
  title: Throne Repositories
  version: "1.0.0"
  x-csharp-namespace: Throne.Repositories.Contracts.Generated
paths:
  /api/v1/git-providers/github/repositories/search:
    get:
      operationId: searchGithubRepositories
      tags: [GitProviders]
      summary: Search the current user's accessible GitHub repositories.
      description: >
        Two scopes are supported (see ADR-0024). `mine` (default) lists only repositories owned by
        the authenticated user via `gh repo list --json`. `involved` additionally includes repos
        where the user is a collaborator or org member via
        `gh api /user/repos?affiliation=collaborator,organization_member` and de-duplicates by
        `owner/repo`. Global `gh search repos` is intentionally NOT used.
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Optional case-insensitive substring filter applied client-side over `full_name`.
        - in: query
          name: scope
          required: false
          schema:
            $ref: '#/components/schemas/RepositorySearchScope'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitRepositoryRefDto'
        '422':
          description: Provider unauthenticated or invalid scope.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/git-providers/github/repositories/my:
    get:
      operationId: listMyGithubRepositories
      tags: [GitProviders]
      summary: List repositories owned by the authenticated GitHub user.
      description: >
        Alias for `searchGithubRepositories` with `scope=mine` and no `q`. Provided as a dedicated
        endpoint for the modal's default state so the UI can avoid wiring scope/q parameters.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitRepositoryRefDto'
        '422':
          description: Provider unauthenticated.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/git-providers/github/repositories/{owner}/{repo}/branches:
    get:
      operationId: listGithubRepositoryBranches
      tags: [GitProviders]
      summary: List branches of a GitHub repository for typeahead.
      description: >
        Backs the branch combobox in the bind-repository modal. Shell-outs to
        `gh api repos/{owner}/{repo}/branches`. Optional `q` is a case-insensitive
        substring filter applied client-side over branch name; `limit` caps the
        page size. Symmetric with `searchGithubRepositories`.
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitBranchRefDto'
        '422':
          description: Provider unauthenticated or repository unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/git-providers/github/repositories/{owner}/{repo}/pulls:
    get:
      operationId: listGithubRepositoryPullRequests
      tags: [GitProviders]
      summary: List open pull requests of a GitHub repository for typeahead.
      description: >
        Backs the PR combobox in the bind-repository modal. Shell-outs to
        `gh pr list --state open --json`. Only `state=open` is returned in this
        iteration (closed / merged are out of scope). Optional `q` is a
        case-insensitive substring filter over `#{number}` / `title` / `head_ref`.
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitPullRequestRefDto'
        '422':
          description: Provider unauthenticated or repository unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories:
    get:
      operationId: listIntentRepositories
      tags: [IntentRepositories]
      summary: List repository bindings attached to an intent.
      description: >
        Full binding cards consumed by the intent page. The MCP `get_intent` response uses
        a compact projection (see `RepositoryBindingSummary`) of the same source.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryBindingDto'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    post:
      operationId: bindIntentRepository
      tags: [IntentRepositories]
      summary: Bind a repository to an intent and enqueue its clone.
      description: >
        Creates an `IntentRepositoryBinding` in `pending` state, returns the binding immediately
        and lets `RepositoryCloneService` (background) move it through `cloning → ready | failed`.
        Re-binding the same `(provider, owner, repo)` to the same intent is rejected with 409
        per ADR-0024 — change PR via unbind + rebind.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindIntentRepositoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryBindingDto'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: A binding for the same (provider, owner, repo) already exists.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (e.g. provider unsupported, owner/repo malformed).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}:
    delete:
      operationId: unbindIntentRepository
      tags: [IntentRepositories]
      summary: Delete a repository binding from an intent.
      description: >
        Removes the binding record AND its on-disk workspace directory. Idempotent —
        returns 204 whether or not the binding existed. If the directory cannot be
        deleted (locked / permission denied) the binding is kept and a 500 is returned
        so the operation can be retried.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted (or already absent).
        '500':
          description: The workspace directory could not be removed; binding left intact.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/sync:
    post:
      operationId: syncIntentRepositoryPullRequest
      tags: [IntentRepositories]
      summary: Synchronously re-read PR review comments from the provider for a binding.
      description: >
        Blocks for the duration of the upstream `gh api` call and returns the freshly observed
        comments straight from the git provider (no durable local comment store).
        `intent.pr_comment_added` is also fanned out via SSE for other open clients.
        Works on closed/merged PRs too — `pull_request_state` is ignored. A 404 from upstream
        flips the binding to `clone_status=broken` per ADR-0024.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestSyncResultDto'
        '404':
          description: Intent or binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request:
    post:
      operationId: attachIntentRepositoryPullRequest
      tags: [IntentRepositories]
      summary: Attach a pull request to an already-bound repository.
      description: >
        Fills the empty pull-request slot of an existing binding without delete/rebind —
        the workspace is untouched. Rejected with 409 when a PR is already attached (unbind
        and rebind to switch). The auto-bind background pass links PRs created by the agent
        automatically; this endpoint covers the manual case and pointing a secondary intent's
        binding at a shared PR.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachIntentRepositoryPullRequestRequest'
      responses:
        '200':
          description: OK — the binding with its newly attached pull request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryBindingDto'
        '404':
          description: Intent or binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: A pull request is already attached to this binding.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/repositories/{binding_id}/pull-request/comments:
    get:
      operationId: listIntentRepositoryPullRequestComments
      tags: [IntentRepositories]
      summary: List the binding's PR review comments via the git provider.
      description: >
        Proxies the upstream `gh api .../pulls/{n}/comments` call through the binding's git
        provider and returns the freshly observed feed, ordered ascending by `created_at`.
        Comments are NOT durably stored server-side — the git provider is the source of truth;
        the server keeps only an etag/cursor on the binding for the background poller. Review
        comments only (issue-comments are out of scope). Pagination is intentionally absent;
        the server returns the full feed.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: binding_id
          required: true
          schema:
            type: string
        - in: query
          name: since
          required: false
          schema:
            type: string
            format: date-time
          description: When supplied, only comments with `created_at >= since` are returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequestCommentDto'
        '404':
          description: Intent or binding not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Binding has no associated pull request number.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories:
    get:
      operationId: listRepositories
      tags: [Repositories]
      summary: List every repository in the registry.
      description: >
        Metadata-only registry rows (ADR-0031), ordered by coordinate. A row materialises
        the first time a `(provider, owner, repo)` coordinate surfaces — from a bind, a tag
        default, a knowledge-page write, or manual `createRepository`. Knowledge pages are
        NOT embedded here; fetch them via `listRepositoryDocuments`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryDto'
    post:
      operationId: createRepository
      tags: [Repositories]
      summary: Manually register a repository by coordinate.
      description: >
        Idempotent registration of a `(provider, owner, repo)` coordinate (ADR-0031), backing
        the manual "add repository" affordance with the Slice 1 autocomplete
        (`searchGithubRepositories`). Returns `201` when the row is created and `200` when the
        coordinate was already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepositoryRequest'
      responses:
        '200':
          description: The coordinate was already registered; the existing row is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDto'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDto'
        '422':
          description: Coordinate failed validation (unknown provider, malformed owner/repo).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}:
    get:
      operationId: getRepository
      tags: [Repositories]
      summary: Get a single registry row by coordinate.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDto'
        '404':
          description: No registry row for this coordinate.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}/documents:
    get:
      operationId: listRepositoryDocuments
      tags: [Repositories]
      summary: List the knowledge pages of a repository (no bodies).
      description: >
        Summary cards for each `RepositoryArtifact` page anchored to the coordinate (ADR-0031),
        ordered by slug. The markdown `document` body is deliberately omitted here — fetch a
        single page via `getRepositoryDocument`. An unknown coordinate yields an empty array.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryDocumentSummaryDto'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}/documents/{slug}:
    get:
      operationId: getRepositoryDocument
      tags: [Repositories]
      summary: Get a single knowledge page with its markdown body.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDocumentDto'
        '404':
          description: No page with this slug for the coordinate.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    put:
      operationId: putRepositoryDocument
      tags: [Repositories]
      summary: Create or update a knowledge page (manual edit).
      description: >
        User-driven counterpart to MCP `write_repository_document` (ADR-0031). Upsert: the
        first write (`expected_version` absent or 0) creates version 1; an update requires
        `expected_version == current` or fails with `409`. `render_hint` is NOT sent on the
        wire — it is derived from the slug convention (`db-schema-map` → schema map, every
        other slug → plain markdown). Optimistic concurrency via `expected_version`.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRepositoryDocumentRequest'
      responses:
        '200':
          description: OK — the page after this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryDocumentDto'
        '409':
          description: Optimistic concurrency conflict; `expected_version` did not match.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate, slug or body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/repositories/{provider}/{owner}/{repo}/documents/{slug}/versions:
    get:
      operationId: listRepositoryDocumentVersions
      tags: [Repositories]
      summary: Version history timeline of a knowledge page.
      description: >
        Append-only full snapshots of the page (ADR-0031), ordered by `version` ASC, for the
        history timeline. Each entry carries the body at that revision.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: '#/components/schemas/GitProvider'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryDocumentVersionDto'
        '404':
          description: No page with this slug for the coordinate.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Coordinate failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    GitProvider:
      type: string
      enum:
        - github
      description: >
        Set of supported git providers. Only `github` is shipped today.
    RepositorySearchScope:
      type: string
      enum:
        - mine
        - involved
      description: >
        `mine` — only repositories owned by the authenticated user (default).
        `involved` — additionally collaborator / org-member repos.
    CloneStatus:
      type: string
      enum:
        - pending
        - cloning
        - ready
        - failed
        - broken
      description: >
        Lifecycle of a binding's local clone (see ADR-0024). `broken` means the clone was once
        `ready` but the upstream repository stopped responding (404).
    PullRequestState:
      type: string
      enum:
        - open
        - closed
        - merged
      description: Upstream lifecycle state of the linked pull request.
    GitRepositoryRefDto:
      type: object
      required:
        - provider
        - owner
        - repo
        - full_name
        - default_branch
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        owner:
          type: string
          minLength: 1
        repo:
          type: string
          minLength: 1
        full_name:
          type: string
          description: '`{owner}/{repo}` — convenience field for UI rendering.'
        default_branch:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        private:
          type: boolean
        html_url:
          type: string
          format: uri
          nullable: true
    GitBranchRefDto:
      type: object
      required:
        - name
        - is_default
      properties:
        name:
          type: string
          minLength: 1
          description: Branch name as reported by upstream (e.g. `main`).
        is_default:
          type: boolean
          description: Whether this is the repository's default branch.
    GitPullRequestRefDto:
      type: object
      required:
        - number
        - title
        - head_ref
        - state
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        head_ref:
          type: string
          minLength: 1
          description: Head branch ref of the pull request (source branch).
        state:
          $ref: '#/components/schemas/PullRequestState'
    AttachIntentRepositoryPullRequestRequest:
      type: object
      required:
        - pull_request_number
      properties:
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          description: Pull request number to attach to the binding.
    BindIntentRepositoryRequest:
      type: object
      required:
        - provider
        - owner
        - repo
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        owner:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
          description: >
            GitHub user/org login. Must not contain `..`, `/`, or `__`
            (see ADR-0024 § 1 — workspace path uses `owner__repo` separator).
        repo:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._-]+$'
          description: >
            GitHub repository slug. Must not contain `..`, `/`, or `__`
            (see ADR-0024 § 1 — workspace path uses `owner__repo` separator).
        default_branch:
          type: string
          minLength: 1
          description: Optional override; defaults to the upstream's default branch on first clone.
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Optional pull request to track for the PR-comments feed.
    RepositoryBindingSummary:
      type: object
      required:
        - binding_id
        - provider
        - owner
        - repo
        - default_branch
        - workspace_path
        - clone_status
      properties:
        binding_id:
          type: string
        provider:
          $ref: '#/components/schemas/GitProvider'
        owner:
          type: string
        repo:
          type: string
        default_branch:
          type: string
        workspace_path:
          type: string
          description: Absolute path to the cloned working tree on the local filesystem.
        clone_status:
          $ref: '#/components/schemas/CloneStatus'
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        pull_request_state:
          allOf:
            - $ref: '#/components/schemas/PullRequestState'
          nullable: true
      description: >
        Compact projection used by MCP `get_intent.repositories[]`. The HTTP
        `listIntentRepositories` endpoint returns the full `RepositoryBindingDto`.
    RepositoryBindingDto:
      type: object
      required:
        - id
        - intent_id
        - provider
        - owner
        - repo
        - default_branch
        - workspace_path
        - clone_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        intent_id:
          type: string
        provider:
          $ref: '#/components/schemas/GitProvider'
        owner:
          type: string
        repo:
          type: string
        default_branch:
          type: string
        workspace_path:
          type: string
          description: Absolute path of the local clone (see ADR-0024 workspace layout).
        clone_status:
          $ref: '#/components/schemas/CloneStatus'
        clone_error:
          type: string
          nullable: true
          description: Human-readable error message when `clone_status` is `failed` or `broken`.
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        pull_request_state:
          allOf:
            - $ref: '#/components/schemas/PullRequestState'
          nullable: true
        review_comments_etag:
          type: string
          nullable: true
          description: >
            Last ETag observed for the PR review-comments feed. Used for conditional GET on
            the next polling cycle.
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PullRequestCommentDto:
      type: object
      required:
        - id
        - binding_id
        - author_login
        - body
        - created_at
      properties:
        id:
          type: string
          description: Upstream comment id (stringified for wire stability).
        binding_id:
          type: string
        author_login:
          type: string
          description: GitHub login of the comment author.
        author_avatar_url:
          type: string
          format: uri
          nullable: true
        body:
          type: string
        html_url:
          type: string
          format: uri
          nullable: true
        path:
          type: string
          nullable: true
          description: File path the review comment is anchored to, when available.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    PullRequestSyncResultDto:
      type: object
      required:
        - binding_id
        - new_comments
        - total_comments
        - comments
      properties:
        binding_id:
          type: string
        new_comments:
          type: integer
          format: int32
          minimum: 0
          description: Number of comments newly observed during this sync (those that triggered fanout).
        total_comments:
          type: integer
          format: int32
          minimum: 0
          description: Full count of review comments in the freshly observed feed after sync.
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestCommentDto'
          description: Full review-comments feed after sync (unpaginated).
        pull_request_state:
          allOf:
            - $ref: '#/components/schemas/PullRequestState'
          nullable: true
        last_synced_at:
          type: string
          format: date-time
          nullable: true
    RepositoryArtifactRenderHint:
      type: string
      enum:
        - markdown
        - schema_map
      description: >
        Read-only render hint of a knowledge page, derived from its slug (ADR-0031):
        the `db-schema-map` slug renders as a mermaid schema map, every other slug as plain
        markdown. Never sent on a write — derived server-side.
    RepositoryDto:
      type: object
      required:
        - provider
        - owner
        - repo
        - full_name
        - created_at
        - updated_at
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        owner:
          type: string
        repo:
          type: string
        full_name:
          type: string
          description: '`{owner}/{repo}` — convenience field for UI rendering.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateRepositoryRequest:
      type: object
      required:
        - provider
        - owner
        - repo
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        owner:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
        repo:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._-]+$'
    RepositoryDocumentSummaryDto:
      type: object
      required:
        - slug
        - title
        - render_hint
        - version
        - created_at
        - updated_at
      properties:
        slug:
          type: string
        title:
          type: string
        render_hint:
          $ref: '#/components/schemas/RepositoryArtifactRenderHint'
        version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: >
        Compact page card used by `listRepositoryDocuments`; omits the markdown `document`
        body to avoid shipping large payloads in a list (see `specs/contracts/AGENTS.md`).
    RepositoryDocumentDto:
      type: object
      required:
        - provider
        - owner
        - repo
        - slug
        - title
        - document
        - render_hint
        - version
        - created_at
        - updated_at
      properties:
        provider:
          $ref: '#/components/schemas/GitProvider'
        owner:
          type: string
        repo:
          type: string
        slug:
          type: string
        title:
          type: string
        document:
          type: string
          description: Full markdown body of the page.
        render_hint:
          $ref: '#/components/schemas/RepositoryArtifactRenderHint'
        version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PutRepositoryDocumentRequest:
      type: object
      required:
        - title
        - document
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        document:
          type: string
          description: Full markdown body; replaces the previous body wholesale on update.
        expected_version:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >
            Current version to update on top of; omit or 0 to create version 1. A mismatch
            fails with `409`.
    RepositoryDocumentVersionDto:
      type: object
      required:
        - version
        - title
        - document
        - render_hint
        - created_at
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        document:
          type: string
        render_hint:
          $ref: '#/components/schemas/RepositoryArtifactRenderHint'
        created_at:
          type: string
          format: date-time
