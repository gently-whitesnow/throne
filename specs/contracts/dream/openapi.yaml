openapi: "3.1.0"
info:
  title: Throne Dream
  version: "1.0.0"
  description: >
    HTTP surface for the Dream loop (ADR-0011). Pending proposals live inside DreamRun
    aggregates and never become text_versions; applying a proposal injects the rule into
    the target instruction's `## Learned rules` section as an ordinary text version.
    Readiness is reported as a token counter over the Intents that would feed the next
    /dream invocation. There is no blocking threshold — /dream is a manual user command.
  x-csharp-namespace: Throne.Dream.Contracts.Generated
paths:
  /api/v1/dream-runs/readiness:
    get:
      operationId: getDreamReadiness
      tags: [Dream]
      summary: Readiness snapshot for the «dream» pipeline.
      description: >
        Returns the «fuel meter» — count of unique-content tokens that would be passed
        to /dream, count of intents in the safe window, the safe window the server is
        currently considering, and an informational suggested action (Run /dream | Wait |
        Review pending). The status is informational and does NOT block /dream.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreamReadinessDto'
  /api/v1/dream-runs/pending:
    get:
      operationId: listPendingDreamRuns
      tags: [Dream]
      summary: List currently pending DreamRuns (with embedded proposals).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DreamRunDto'
  /api/v1/dream-runs/pending/count:
    get:
      operationId: getPendingDreamProposalsCount
      tags: [Dream]
      summary: Count of pending proposals across all pending DreamRuns.
      description: >
        Strictly proposals, not runs. The fuel meter uses pending_runs_count and
        pending_proposals_count separately; this endpoint exists for shell badges.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreamPendingCountDto'
  /api/v1/dream-runs/{run_id}:
    get:
      operationId: getDreamRun
      tags: [Dream]
      summary: Single DreamRun with proposals and per-proposal preview diff.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreamRunDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/dream-runs/{run_id}/close:
    post:
      operationId: closeDreamRun
      tags: [Dream]
      summary: Close a DreamRun manually.
      description: >
        Default release_evidence depends on the run shape: empty run → release (don't
        consume); non-empty run → consume (standard path). Explicit boolean overrides.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseDreamRunRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreamRunDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Already closed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/dream-runs/{run_id}/proposals/{proposal_id}/apply:
    post:
      operationId: applyDreamProposal
      tags: [Dream]
      summary: Apply a pending proposal to its target instruction.
      description: >
        Injects `final_rule` (or `proposed_rule` when omitted) into the instruction's
        `## Learned rules` section, creating a new text version through the standard
        instruction replace path. Validates `base_instruction_version`; mismatch returns
        409 dream.proposal.needs_rebase without mutation.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
        - in: path
          name: proposal_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyDreamProposalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreamRunDto'
        '404':
          description: Run, proposal, or instruction not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Already decided, run closed, or needs rebase
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/dream-runs/{run_id}/proposals/{proposal_id}/skip:
    post:
      operationId: skipDreamProposal
      tags: [Dream]
      summary: Reject a pending proposal with a reason.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
        - in: path
          name: proposal_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipDreamProposalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreamRunDto'
        '404':
          description: Run or proposal not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Already decided or run closed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    DreamReadinessStatus:
      type: string
      enum: [empty, has_content, pending_review]
    DreamReadinessDto:
      type: object
      required:
        - status
        - available_tokens
        - locked_tokens
        - intent_count
        - safe_window_start
        - safe_window_end
        - pending_proposals_count
        - pending_runs_count
        - suggested_action
      properties:
        status:
          $ref: '#/components/schemas/DreamReadinessStatus'
        available_tokens:
          type: integer
          format: int32
          minimum: 0
          description: Sum of cl100k_base tokens of unique content that would feed the next /dream.
        locked_tokens:
          type: integer
          format: int32
          minimum: 0
          description: Tokens of intents already snapshotted by pending DreamRuns.
        intent_count:
          type: integer
          format: int32
          minimum: 0
          description: Number of distinct intents currently available for /dream.
        safe_window_start:
          type: string
          format: date-time
        safe_window_end:
          type: string
          format: date-time
        pending_proposals_count:
          type: integer
          format: int32
          minimum: 0
        pending_runs_count:
          type: integer
          format: int32
          minimum: 0
        suggested_action:
          type: string
          description: Informational hint (Run /dream | Wait for more signals | Review pending dream proposals). Never blocking.
    DreamIntentRefDto:
      type: object
      required: [intent_id, token_count, snapshotted_at]
      properties:
        intent_id:
          type: string
        token_count:
          type: integer
          format: int32
          minimum: 0
        snapshotted_at:
          type: string
          format: date-time
    DreamProposalDto:
      type: object
      required:
        - id
        - target_instruction_id
        - target_kind
        - base_instruction_version
        - proposed_rule
        - evidence_summary
        - intent_refs
        - rationale
        - severity
        - decision
      properties:
        id:
          type: string
        target_instruction_id:
          type: string
        target_kind:
          type: string
        base_instruction_version:
          type: integer
          format: int32
          minimum: 1
        proposed_rule:
          type: string
          maxLength: 280
        evidence_summary:
          type: string
        intent_refs:
          type: array
          items:
            $ref: '#/components/schemas/DreamIntentRefDto'
        rationale:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        decision:
          type: string
          enum: [pending, applied, skipped]
        final_rule:
          type: string
        applied_instruction_version:
          type: integer
          format: int32
          minimum: 1
        rejected_reason:
          type: string
    DreamRunDto:
      type: object
      required:
        - id
        - status
        - window_start
        - window_end
        - token_count
        - intent_refs
        - proposals
        - created_at
        - evidence_processed
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, closed]
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        token_count:
          type: integer
          format: int32
          minimum: 0
        intent_refs:
          type: array
          items:
            $ref: '#/components/schemas/DreamIntentRefDto'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/DreamProposalDto'
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        evidence_processed:
          type: boolean
    DreamProposalPreviewDto:
      type: object
      required:
        - proposal_id
        - current_text
        - proposed_text
        - current_instruction_version
        - base_version_matches_current
      properties:
        proposal_id:
          type: string
        current_text:
          type: string
        proposed_text:
          type: string
        current_instruction_version:
          type: integer
          format: int32
          minimum: 0
        base_version_matches_current:
          type: boolean
    DreamRunDetailDto:
      type: object
      required: [run, previews]
      properties:
        run:
          $ref: '#/components/schemas/DreamRunDto'
        previews:
          type: array
          items:
            $ref: '#/components/schemas/DreamProposalPreviewDto'
    DreamPendingCountDto:
      type: object
      required: [pending_proposals_count]
      properties:
        pending_proposals_count:
          type: integer
          format: int32
          minimum: 0
    CloseDreamRunRequest:
      type: object
      properties:
        release_evidence:
          type: boolean
          description: >
            Override default. Default is (run.proposals.length == 0). True forces evidence
            back into the unprocessed pool; false marks evidence consumed.
    ApplyDreamProposalRequest:
      type: object
      properties:
        final_rule:
          type: string
          maxLength: 280
          description: User-edited rule text. When omitted, server uses proposed_rule.
    SkipDreamProposalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          description: Why the user rejected this proposal. Becomes a learning signal.
