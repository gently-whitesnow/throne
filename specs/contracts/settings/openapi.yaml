openapi: "3.1.0"
info:
  title: Throne Settings
  version: "1.0.0"
  x-csharp-namespace: Throne.Settings.Contracts.Generated
paths:
  /api/v1/settings/workspace:
    get:
      operationId: getWorkspaceSettings
      tags: [Settings]
      summary: Read the workspace root configuration and its current size.
      description: >
        Returns the resolved `Throne:Workspace:Root` plus an optional global size on disk.
        `status=calculating` lets the UI render a skeleton while the size computation runs
        in the background; `status=ready` means `total_size_bytes` is fresh. Per-intent
        sizes are out of scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsDto'
  /api/v1/settings/workspace/clean:
    post:
      operationId: cleanWorkspace
      tags: [Settings]
      summary: Bulk-remove intent repository clones from the workspace root.
      description: >
        Mass unbind: deletes the on-disk clones under `Throne:Workspace:Root` AND their
        `IntentRepositoryBinding` records, so no orphaned (folder-less) bindings remain.
        `mode=all` clears the whole root (every clone, including active intents) and drops
        every binding; `mode=closed_only` touches only intents in `done` / `reject` / `fridge`.
        Repo-level metadata (the `Repository` registry and its artifacts) lives in persistence, not on
        disk, and is never cascaded. With `dry_run=true` nothing is deleted — the response is the
        preview (`removed_clones` / `freed_bytes` that *would* be removed) for the confirm dialog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCleanRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCleanResultDto'
        '422':
          description: Validation failed (unknown mode).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/settings/terminal:
    get:
      operationId: getTerminalSettings
      tags: [Settings]
      summary: Read the default agent vendor for new terminal sessions.
      description: >
        Returns the operator-chosen `default_terminal_vendor` used to pre-fill the
        embedded-terminal launch controls and as the server-side fallback when a
        `run`/`restart` request omits `vendor`. Model and effort defaults are native
        to the vendor and are NOT persisted here — only the vendor is a setting.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSettingsDto'
    put:
      operationId: setTerminalSettings
      tags: [Settings]
      summary: Set the default agent vendor for new terminal sessions.
      description: >
        Persists `default_terminal_vendor` (claude | codex). Idempotent upsert of the
        settings singleton; takes effect on the next launch (live sessions are not
        touched).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTerminalSettingsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSettingsDto'
        '422':
          description: Validation failed (unknown vendor).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/settings/skill-mode-defaults:
    get:
      operationId: getSkillModeDefaults
      tags: [Settings]
      summary: Read default session skills per launch mode.
      description: >
        Returns the global instance-level matrix of session skill defaults. The skill
        catalog is source-aware (`source=throne` today) but defaults are keyed only by
        `(mode, skill_id)`; vendor is a delivery detail.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillModeDefaultsDto'
    put:
      operationId: setSkillModeDefaults
      tags: [Settings]
      summary: Replace default session skill toggles.
      description: >
        Upserts the provided `(mode, skill_id) → enabled` entries. Missing entries keep
        their current value; the UI normally sends the full matrix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillModeDefaultsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillModeDefaultsDto'
        '422':
          description: Validation failed (unknown mode or skill).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/settings/local-model/models:
    get:
      operationId: getLocalModelCatalog
      tags: [Settings]
      summary: Discover models from the configured local OpenAI-compatible endpoint.
      description: >
        Reads `Throne:LocalModel:BaseUrl` and probes `GET {BaseUrl}/v1/models`, the single source
        of truth for dynamic local models (never the human-readable `opencode models`). The response
        is a controlled state machine so the settings UI never crashes on a missing or unreachable
        endpoint: `not_configured` when `BaseUrl` is empty, `ready` with the normalized `models` list
        when the endpoint answers, `empty` when it answers with no models, and `unreachable` with the
        probe `error` on any transport/HTTP/parse failure.
      responses:
        '200':
          description: Discovery snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalModelCatalogDto'
  /api/v1/settings/git-providers/status:
    get:
      operationId: getGitProvidersStatus
      tags: [Settings]
      summary: Authentication status for every configured git provider CLI.
      description: >
        Drives the settings page indicator. Throne never persists provider tokens itself —
        the underlying `gh` / `glab` CLIs own auth (see ADR-0024). GitLab uses the host
        persisted via `setGitLabHost` (default `gitlab.com`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProvidersStatusDto'
  /api/v1/settings/git-providers/gitlab/host:
    put:
      operationId: setGitLabHost
      tags: [Settings]
      summary: Persist the GitLab host used by `glab` (e.g. `gitlab.com`, `gitlab.example.com`).
      description: >
        Replaces the singleton GitLab host setting in persistence. There is no env-var fallback;
        the very first read materialises the default `gitlab.com`. Takes effect on the next
        `glab` invocation (auth probe, repo search, clone) without restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGitLabHostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitLabHostSettingsDto'
        '422':
          description: Empty or invalid host.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/settings/task-trackers:
    get:
      operationId: getTaskTrackerConnections
      tags: [Settings]
      summary: Catalog of task-tracker providers with their saved connection state.
      description: >
        One row per provider registered in this Throne build (the catalog half), each carrying its
        persisted connection state (the status half). `not_configured` means no connection is saved;
        `connected` means a validated `base_url` + token is on file. The token itself is never
        returned — only the base URL. This read does not re-probe the upstream tracker; validation
        happens on the connection upsert. The provider list comes straight from the task-tracker
        registry (ADR-0045/0046), so the provider-neutral core returns an empty list until an adapter
        is registered.
      responses:
        '200':
          description: Saved connection state per registered task-tracker provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerConnectionsDto'
  /api/v1/settings/task-trackers/{tracker}/connection:
    put:
      operationId: setTaskTrackerConnection
      tags: [Settings]
      summary: Validate and persist a task-tracker connection (base URL + API token).
      description: >
        Validates the credentials against the provider's API, then persists them on success. The
        token is stored encrypted at rest in the local SQLite database (ADR-0047/0029); only the base
        URL is ever read back. A rejected token returns `invalid` and an unreachable host returns
        `unreachable` — neither is persisted, and both arrive as a `200` so the settings card can
        render the state inline. One connection (url + token) per provider; re-issuing replaces it.
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskTrackerConnectionRequest'
      responses:
        '200':
          description: Connection probe outcome (persisted only when `state=connected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerConnectionDto'
        '422':
          description: Unknown tracker key, or empty base URL / token.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteTaskTrackerConnection
      tags: [Settings]
      summary: Remove a saved task-tracker connection and its board selection.
      description: >
        Drops the persisted connection (encrypted token included) and any board selection bound to
        it. Idempotent: deleting an absent connection still returns `204`.
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerKey'
      responses:
        '204':
          description: Connection removed (or was already absent).
        '422':
          description: Unknown tracker key.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/settings/task-trackers/{tracker}/boards:
    get:
      operationId: getTaskTrackerBoards
      tags: [Settings]
      summary: List the boards available through the connection, grouped by space.
      description: >
        Reads the live space/board topology from the provider using the saved connection, then folds
        in the current selection so each board carries its `selected` flag and chosen grouping
        `context_field`. Requires a configured connection — a missing one returns `409`.
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerKey'
      responses:
        '200':
          description: Available boards grouped by space, merged with the saved selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerBoardsDto'
        '409':
          description: No connection is configured for this tracker.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Unknown tracker key.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '502':
          description: The upstream tracker API was unreachable or rejected the saved token.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    put:
      operationId: setTaskTrackerBoards
      tags: [Settings]
      summary: Persist the selected boards and their per-board grouping context.
      description: >
        Replaces the board selection for this tracker. Each entry pins a board plus the field used to
        derive the card «context» (`lane` / `tags` / `type`, or `none` to opt out). Boards omitted
        from the request become unselected. The response re-reads the live topology so the caller sees
        the saved selection reflected against the current boards.
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskTrackerBoardsRequest'
      responses:
        '200':
          description: Saved selection, merged against the live topology.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerBoardsDto'
        '409':
          description: No connection is configured for this tracker.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Unknown tracker key or unknown context field.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '502':
          description: The upstream tracker API was unreachable or rejected the saved token.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    TerminalAgentVendor:
      type: string
      minLength: 1
      pattern: '^[a-z0-9][a-z0-9-]*$'
      description: >
        Default agent CLI for new embedded-terminal sessions. Mirror of
        `terminal#/components/schemas/TerminalAgentVendor` — duplicated because NSwag
        does not resolve `$ref` across OpenAPI documents. The value set is intentionally
        open and validated by the terminal vendor catalog.
    TerminalSettingsDto:
      type: object
      required:
        - default_vendor
      properties:
        default_vendor:
          $ref: '#/components/schemas/TerminalAgentVendor'
    UpdateTerminalSettingsRequest:
      type: object
      required:
        - default_vendor
      properties:
        default_vendor:
          $ref: '#/components/schemas/TerminalAgentVendor'
    SkillCatalogItemDto:
      type: object
      required:
        - skill_id
        - source
        - title
        - description
      properties:
        skill_id:
          type: string
        source:
          type: string
        title:
          type: string
        description:
          type: string
    SkillModeDefaultDto:
      type: object
      required:
        - skill_id
        - enabled
      properties:
        skill_id:
          type: string
        enabled:
          type: boolean
    SkillModeDefaultsModeDto:
      type: object
      required:
        - mode
        - defaults
      properties:
        mode:
          type: string
        defaults:
          type: array
          items:
            $ref: '#/components/schemas/SkillModeDefaultDto'
    SkillModeDefaultsDto:
      type: object
      required:
        - skills
        - modes
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillCatalogItemDto'
        modes:
          type: array
          items:
            $ref: '#/components/schemas/SkillModeDefaultsModeDto'
    UpdateSkillModeDefaultEntry:
      type: object
      required:
        - mode
        - skill_id
        - enabled
      properties:
        mode:
          type: string
        skill_id:
          type: string
        enabled:
          type: boolean
    UpdateSkillModeDefaultsRequest:
      type: object
      required:
        - defaults
      properties:
        defaults:
          type: array
          items:
            $ref: '#/components/schemas/UpdateSkillModeDefaultEntry'
    WorkspaceStatus:
      type: string
      enum:
        - ready
        - calculating
      description: >
        `ready` — `total_size_bytes` reflects the latest scan.
        `calculating` — background sweep in progress; size will arrive on the next request.
    WorkspaceSettingsDto:
      type: object
      required:
        - root
        - status
        - writable
      properties:
        root:
          type: string
          minLength: 1
          description: Absolute path to `Throne:Workspace:Root` (default `~/.throne/workspaces`).
        writable:
          type: boolean
          description: >
            Whether `root` currently exists and is writable (probed by creating and deleting a
            throw-away file). Feeds the «Throne готов» readiness check — a non-writable workspace
            root blocks clones into intent workspaces.
        total_size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Aggregate disk usage of all intent workspaces under `root`. Omitted while `status=calculating`.
        status:
          $ref: '#/components/schemas/WorkspaceStatus'
    WorkspaceCleanMode:
      type: string
      enum:
        - all
        - closed_only
      description: >
        `all` — remove every clone under the root and drop every binding.
        `closed_only` — remove only clones of intents in `done` / `reject` / `fridge`.
    WorkspaceCleanRequestDto:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/WorkspaceCleanMode'
        dry_run:
          type: boolean
          default: false
          description: >
            When true, compute the summary without deleting anything. Drives the confirm
            dialog so the operator sees how many clones and how many bytes will be removed.
    WorkspaceCleanResultDto:
      type: object
      required:
        - removed_clones
        - freed_bytes
        - dry_run
      properties:
        removed_clones:
          type: integer
          format: int32
          minimum: 0
          description: Number of repository clones removed (or that would be removed when `dry_run=true`).
        freed_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes freed on disk (or that would be freed when `dry_run=true`).
        dry_run:
          type: boolean
          description: Echoes the request flag so the caller can tell a preview from an executed run.
    LocalModelDiscoveryStatus:
      type: string
      enum:
        - not_configured
        - ready
        - empty
        - unreachable
      description: >
        `not_configured` — `Throne:LocalModel:BaseUrl` is empty; nothing was probed.
        `ready` — the endpoint answered and `models` lists at least one id.
        `empty` — the endpoint answered but advertises no models.
        `unreachable` — transport/HTTP/parse failure; see `error`.
    LocalModelCatalogDto:
      type: object
      required:
        - status
        - models
      properties:
        status:
          $ref: '#/components/schemas/LocalModelDiscoveryStatus'
        base_url:
          type: string
          nullable: true
          description: The probed `Throne:LocalModel:BaseUrl`. Null only when `status=not_configured`.
        models:
          type: array
          items:
            type: string
            minLength: 1
          description: >
            Normalized model ids from `/v1/models`, deduplicated in advertised order. Stable shape
            for backend metadata consumers and a future OpenCode `provider.models` map. Empty unless
            `status=ready`.
        error:
          type: string
          nullable: true
          description: Probe failure detail. Present only when `status=unreachable`.
    GitProviderAuthStatusDto:
      type: object
      required:
        - authenticated
        - state
      properties:
        authenticated:
          type: boolean
          description: True when the underlying CLI reports a usable session.
        state:
          $ref: '#/components/schemas/GitProviderAuthState'
        host:
          type: string
          nullable: true
          description: Provider host that was probed.
        login:
          type: string
          description: Authenticated account login (from `gh api user`).
        scopes:
          type: array
          items:
            type: string
          description: OAuth scopes parsed from the `X-OAuth-Scopes` response header.
        error:
          type: string
          description: Last error message from the provider CLI when `authenticated=false`.
    GitProviderAuthState:
      type: string
      enum:
        - authenticated
        - unauthenticated
        - offline
        - missing
      description: >
        UI-level health state. `offline` is a transient NetworkError; `missing`
        means the CLI or required host setting is absent; `unauthenticated` means
        the CLI is present but has no usable login.
    GitProvidersStatusDto:
      type: object
      required:
        - providers
      properties:
        providers:
          type: array
          description: Auth status for every registered git provider, in registry order.
          items:
            $ref: '#/components/schemas/GitProviderStatusDto'
    GitProviderStatusDto:
      type: object
      required:
        - provider
        - status
      properties:
        provider:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: Stable git provider key from the backend registry.
        status:
          $ref: '#/components/schemas/GitProviderAuthStatusDto'
    GitLabHostSettingsDto:
      type: object
      required:
        - host
      properties:
        host:
          type: string
          minLength: 1
          description: Hostname used by `glab` (e.g. `gitlab.com`, `gitlab.example.com`).
    UpdateGitLabHostRequest:
      type: object
      required:
        - host
      properties:
        host:
          type: string
          minLength: 1
          description: Status for the configured GitLab host.
    TaskTrackerKey:
      type: string
      minLength: 1
      pattern: '^[a-z0-9][a-z0-9-]*$'
      description: >
        Stable task-tracker provider key. Open wire string (ADR-0046): supported providers come from
        the backend registry and unknown values are rejected server-side (422). Mirror of
        `task-trackers#/components/schemas/TaskTrackerProvider` — duplicated because NSwag does not
        resolve `$ref` across OpenAPI documents.
    TaskTrackerConnectionState:
      type: string
      enum:
        - not_configured
        - connected
        - invalid
        - unreachable
      description: >
        `not_configured` — no connection saved.
        `connected` — a validated base URL + token is persisted.
        `invalid` — the token was rejected by the tracker API (upsert only; not persisted).
        `unreachable` — the tracker API could not be reached (upsert only; not persisted).
    TaskTrackerConnectionDto:
      type: object
      required:
        - tracker
        - display_name
        - state
      properties:
        tracker:
          $ref: '#/components/schemas/TaskTrackerKey'
        display_name:
          type: string
          minLength: 1
          description: Human-readable provider label from the registry.
        state:
          $ref: '#/components/schemas/TaskTrackerConnectionState'
        base_url:
          type: string
          nullable: true
          description: Persisted workspace base URL. Null unless a connection is saved. Token is never returned.
        error:
          type: string
          nullable: true
          description: Probe failure detail. Present only for `invalid` / `unreachable`.
    TaskTrackerConnectionsDto:
      type: object
      required:
        - connections
      properties:
        connections:
          type: array
          description: One row per registered task-tracker provider, in registry order.
          items:
            $ref: '#/components/schemas/TaskTrackerConnectionDto'
    UpdateTaskTrackerConnectionRequest:
      type: object
      required:
        - base_url
        - token
      properties:
        base_url:
          type: string
          minLength: 1
          description: Workspace base URL, e.g. `https://mycompany.kaiten.ru`.
        token:
          type: string
          minLength: 1
          description: API token. Stored encrypted at rest; never read back.
    TaskTrackerContextField:
      type: string
      enum:
        - lane
        - tags
        - type
        - none
      description: >
        Board field used to derive a card's «context» during sync. `none` is the explicit
        opt-out / fallback when no field maps cleanly.
    TaskTrackerBoardDto:
      type: object
      required:
        - board_id
        - board_title
        - selected
        - context_field
      properties:
        board_id:
          type: string
          minLength: 1
          description: Provider-native board identifier (opaque string, provider-neutral).
        board_title:
          type: string
          description: Human-readable board name.
        selected:
          type: boolean
          description: Whether this board is part of the saved selection.
        context_field:
          $ref: '#/components/schemas/TaskTrackerContextField'
    TaskTrackerSpaceDto:
      type: object
      required:
        - space_id
        - space_title
        - boards
      properties:
        space_id:
          type: string
          minLength: 1
          description: Provider-native space identifier (opaque string).
        space_title:
          type: string
          description: Human-readable space name.
        boards:
          type: array
          items:
            $ref: '#/components/schemas/TaskTrackerBoardDto'
    TaskTrackerBoardsDto:
      type: object
      required:
        - tracker
        - spaces
      properties:
        tracker:
          $ref: '#/components/schemas/TaskTrackerKey'
        spaces:
          type: array
          description: Live space/board topology, merged with the saved selection.
          items:
            $ref: '#/components/schemas/TaskTrackerSpaceDto'
    TaskTrackerBoardSelectionEntry:
      type: object
      required:
        - space_id
        - board_id
        - context_field
      properties:
        space_id:
          type: string
          minLength: 1
        space_title:
          type: string
          description: Cached space title so the selection is self-describing for sync.
        board_id:
          type: string
          minLength: 1
        board_title:
          type: string
          description: Cached board title so the selection is self-describing for sync.
        context_field:
          $ref: '#/components/schemas/TaskTrackerContextField'
    UpdateTaskTrackerBoardsRequest:
      type: object
      required:
        - boards
      properties:
        boards:
          type: array
          description: The full selected set. Boards not listed become unselected.
          items:
            $ref: '#/components/schemas/TaskTrackerBoardSelectionEntry'
