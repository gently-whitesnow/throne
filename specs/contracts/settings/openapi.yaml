openapi: "3.1.0"
info:
  title: Throne Settings
  version: "1.0.0"
  x-csharp-namespace: Throne.Settings.Contracts.Generated
paths:
  /api/v1/settings/workspace:
    get:
      operationId: getWorkspaceSettings
      tags: [Settings]
      summary: Read the workspace root configuration and its current size.
      description: >
        Returns the resolved `Throne:Workspace:Root` plus an optional global size on disk.
        `status=calculating` lets the UI render a skeleton while the size computation runs
        in the background; `status=ready` means `total_size_bytes` is fresh. Per-intent
        sizes are out of scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsDto'
  /api/v1/settings/workspace/clean:
    post:
      operationId: cleanWorkspace
      tags: [Settings]
      summary: Bulk-remove intent repository clones from the workspace root.
      description: >
        Mass unbind: deletes the on-disk clones under `Throne:Workspace:Root` AND their
        `IntentRepositoryBinding` records, so no orphaned (folder-less) bindings remain.
        `mode=all` clears the whole root (every clone, including active intents) and drops
        every binding; `mode=closed_only` touches only intents in `done` / `reject` / `fridge`.
        Repo-level metadata (the `Repository` registry and its artifacts) lives in Mongo, not on
        disk, and is never cascaded. With `dry_run=true` nothing is deleted — the response is the
        preview (`removed_clones` / `freed_bytes` that *would* be removed) for the confirm dialog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCleanRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCleanResultDto'
        '422':
          description: Validation failed (unknown mode).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/settings/git-providers/status:
    get:
      operationId: getGitProvidersStatus
      tags: [Settings]
      summary: Authentication status for every configured git provider CLI.
      description: >
        Drives the settings page indicator. Throne never persists provider tokens itself —
        the underlying `gh` / `glab` CLIs own auth (see ADR-0024). GitLab uses
        the configured `Throne:GitLab:Host`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProvidersStatusDto'
components:
  schemas:
    WorkspaceStatus:
      type: string
      enum:
        - ready
        - calculating
      description: >
        `ready` — `total_size_bytes` reflects the latest scan.
        `calculating` — background sweep in progress; size will arrive on the next request.
    WorkspaceSettingsDto:
      type: object
      required:
        - root
        - status
      properties:
        root:
          type: string
          minLength: 1
          description: Absolute path to `Throne:Workspace:Root` (default `~/.throne/workspaces`). Inside docker this is the in-container mount point, not a host path.
        host_root:
          type: string
          minLength: 1
          nullable: true
          description: >
            Optional host-side path for the workspace, configured via `Throne:Workspace:HostRoot`.
            Relevant only when the API runs inside a container whose `root` is a bind-mount, so the
            UI can show where clones live on the operator's machine. Empty in the native host-backend
            mode (ADR-0027), where `root` is already the real host path.
        total_size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Aggregate disk usage of all intent workspaces under `root`. Omitted while `status=calculating`.
        status:
          $ref: '#/components/schemas/WorkspaceStatus'
    WorkspaceCleanMode:
      type: string
      enum:
        - all
        - closed_only
      description: >
        `all` — remove every clone under the root and drop every binding.
        `closed_only` — remove only clones of intents in `done` / `reject` / `fridge`.
    WorkspaceCleanRequestDto:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/WorkspaceCleanMode'
        dry_run:
          type: boolean
          default: false
          description: >
            When true, compute the summary without deleting anything. Drives the confirm
            dialog so the operator sees how many clones and how many bytes will be removed.
    WorkspaceCleanResultDto:
      type: object
      required:
        - removed_clones
        - freed_bytes
        - dry_run
      properties:
        removed_clones:
          type: integer
          format: int32
          minimum: 0
          description: Number of repository clones removed (or that would be removed when `dry_run=true`).
        freed_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes freed on disk (or that would be freed when `dry_run=true`).
        dry_run:
          type: boolean
          description: Echoes the request flag so the caller can tell a preview from an executed run.
    GitProviderAuthStatusDto:
      type: object
      required:
        - authenticated
        - state
      properties:
        authenticated:
          type: boolean
          description: True when the underlying CLI reports a usable session.
        state:
          $ref: '#/components/schemas/GitProviderAuthState'
        host:
          type: string
          nullable: true
          description: Provider host that was probed.
        login:
          type: string
          description: Authenticated account login (from `gh api user`).
        scopes:
          type: array
          items:
            type: string
          description: OAuth scopes parsed from the `X-OAuth-Scopes` response header.
        error:
          type: string
          description: Last error message from the provider CLI when `authenticated=false`.
    GitProviderAuthState:
      type: string
      enum:
        - authenticated
        - unauthenticated
        - offline
        - missing
      description: >
        UI-level health state. `offline` is a transient NetworkError; `missing`
        means the CLI or required host setting is absent; `unauthenticated` means
        the CLI is present but has no usable login.
    GitProvidersStatusDto:
      type: object
      required:
        - github
        - gitlab
      properties:
        github:
          $ref: '#/components/schemas/GitProviderAuthStatusDto'
        gitlab:
          $ref: '#/components/schemas/GitProviderAuthStatusDto'
          description: Status for the configured GitLab host.
