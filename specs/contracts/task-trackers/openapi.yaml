openapi: "3.1.0"
info:
  title: Throne Task Trackers
  version: "1.0.0"
  x-csharp-namespace: Throne.TaskTrackers.Contracts.Generated
  description: >
    Provider-neutral catalog surface for the task-tracker extension axis (ADR-0045/0046).
    The backend is the single source of truth for which trackers are compiled in; the frontend
    discovers them from this catalog instead of a generated enum. The `tracker` key is an open
    wire string — unknown values are rejected server-side (422) against the provider registry.
    Connection settings (base URL / token) and board selection live on the settings axis, not here.
paths:
  /api/v1/task-trackers:
    get:
      operationId: listTaskTrackers
      tags: [TaskTrackers]
      summary: List the task-tracker providers registered in this Throne build.
      description: >
        Backed by the in-process provider registry. Returns every registered provider exactly once,
        in registration order. Provider-neutral core ships with no adapters, so an empty list is a
        valid response until an adapter (Kaiten, …) is registered.
      responses:
        '200':
          description: Registered task-tracker providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerCatalogResponse'
  /api/v1/task-trackers/{tracker}:
    get:
      operationId: getTaskTracker
      tags: [TaskTrackers]
      summary: Resolve a single task-tracker provider by its open wire key.
      description: >
        The first server boundary that closes the open wire key: a registered key returns its
        catalog row, an unknown key returns 422 (provider-unsupported).
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerProvider'
      responses:
        '200':
          description: Registered provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerProviderDto'
        '422':
          description: Tracker key is not registered on this Throne build.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/task-trackers/{tracker}/boards/{board}/cards:
    get:
      operationId: listBoardCards
      tags: [TaskTrackers]
      summary: List the active cards visible on a board (card-browser read surface).
      description: >
        Operator read surface for browsing a connected board (ADR-0052/0053) — never touches intents.
        Returns every non-archived card across all columns of the board; no server-side search or
        pagination in this MVP. Connection degradation is classified per ADR-0053: a revoked token is
        409, a tariff wall 402, an unreachable tracker 502.
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerProvider'
        - in: path
          name: board
          required: true
          schema:
            type: string
            minLength: 1
          description: Provider-native board/space id to list cards from.
      responses:
        '200':
          description: Active cards on the board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerBoardCardsResponse'
        '402':
          description: The tracker refused the request on tariff-plan grounds (blocked).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: The tracker has no saved connection, or its token was rejected (reconnect).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Tracker key is not registered on this Throne build.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '502':
          description: The tracker was unreachable while listing cards (offline).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/task-trackers/{tracker}/boards/{board}/cards/search:
    get:
      operationId: searchBoardCards
      tags: [TaskTrackers]
      summary: Search cards inside a board for the attach-card picker.
      description: >
        Read surface for the «Attach card» combobox: an empty `query` returns the most recently touched
        cards (top-N by upstream `updated_at desc`), a non-empty one hands the text filter to the
        tracker's own search (Kaiten `query`) and returns the first page only. Archived cards excluded.
        No local cache — the endpoint proxies live to the tracker. Connection degradation is classified
        as for the browser (`listBoardCards`): 409 auth, 402 blocked, 502 offline.
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerProvider'
        - in: path
          name: board
          required: true
          schema:
            type: string
            minLength: 1
          description: Provider-native board/space id to search cards in.
        - in: query
          name: query
          required: false
          schema:
            type: string
          description: Text filter forwarded to the tracker; empty = recent-first mode.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
          description: Cap on returned cards. Server clamps to a sane range.
      responses:
        '200':
          description: Matching cards (single page).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerBoardCardsResponse'
        '402':
          description: The tracker refused the request on tariff-plan grounds (blocked).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: The tracker has no saved connection, or its token was rejected (reconnect).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Tracker key is not registered on this Throne build.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '502':
          description: The tracker was unreachable while searching cards (offline).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/task-trackers/{tracker}/boards/{board}/cards/{card}:
    get:
      operationId: getBoardCard
      tags: [TaskTrackers]
      summary: Read a single card of a board read-only.
      description: >
        Pulls one card snapshot from the provider (`GetCardAsync`) for read-only preview — the source
        of the full text shown in the card browser. Never touches intents. A vanished/forbidden card
        or one that does not belong to this board is 404; connection degradation is classified per
        ADR-0053 (409 auth, 402 blocked, 502 offline).
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerProvider'
        - in: path
          name: board
          required: true
          schema:
            type: string
            minLength: 1
          description: Provider-native board/space id the card must belong to.
        - in: path
          name: card
          required: true
          schema:
            type: string
            minLength: 1
          description: Provider-native card/issue id.
      responses:
        '200':
          description: The card snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerCardDto'
        '402':
          description: The tracker refused the request on tariff-plan grounds (blocked).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '404':
          description: The card is gone/forbidden upstream, or not on the requested board.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: The tracker has no saved connection, or its token was rejected (reconnect).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Tracker key is not registered on this Throne build.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '502':
          description: The tracker was unreachable while reading the card (offline).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    TaskTrackerProvider:
      type: string
      minLength: 1
      pattern: '^[a-z0-9][a-z0-9-]*$'
      description: >
        Stable task-tracker provider key. Value set intentionally open (ADR-0046); supported
        providers are delivered by the backend registry and unknown values are rejected server-side.
    TaskTrackerProviderDto:
      type: object
      required:
        - tracker
        - display_name
      properties:
        tracker:
          $ref: '#/components/schemas/TaskTrackerProvider'
        display_name:
          type: string
          minLength: 1
          description: Human-readable label for settings/catalog rows.
    TaskTrackerCatalogResponse:
      type: object
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/TaskTrackerProviderDto'
    TaskTrackerCardDto:
      type: object
      description: >
        Provider-neutral projection of an external card as the card browser sees it (ADR-0052). A
        read-only, non-authoritative view — never an intent and never written back upstream.
      required:
        - card_id
        - board_id
        - text
        - archived
      properties:
        card_id:
          type: string
          description: Provider-native card/issue id.
        board_id:
          type: string
          description: Provider-native board/space id the card lives on.
        column_id:
          type: string
          nullable: true
          description: Provider-native column id, when the tracker exposes columns.
        column_title:
          type: string
          nullable: true
          description: Human-readable title of the card's current column.
        text:
          type: string
          description: Full card Markdown as provided by the tracker.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last upstream update time, when the tracker exposes it.
        archived:
          type: boolean
          description: Always false in browser results — archived cards are excluded.
        card_version:
          type: string
          nullable: true
          description: Opaque provider-supplied revision cursor (for Kaiten — card.version).
        web_url:
          type: string
          nullable: true
          description: >
            Per-request derived URL to the card in the provider's UI. Composed from the current
            connection base_url + card_id (short form; provider redirects to human-readable path).
            Null when the tracker cannot form the URL (no active connection, or the card_id is not
            usable). Non-authoritative — never persisted alongside the read-only projection.
    TaskTrackerBoardCardsResponse:
      type: object
      required:
        - cards
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/TaskTrackerCardDto'
