openapi: "3.1.0"
info:
  title: Throne Task Trackers
  version: "1.0.0"
  x-csharp-namespace: Throne.TaskTrackers.Contracts.Generated
  description: >
    Provider-neutral catalog surface for the task-tracker extension axis (ADR-0045/0046).
    The backend is the single source of truth for which trackers are compiled in; the frontend
    discovers them from this catalog instead of a generated enum. The `tracker` key is an open
    wire string — unknown values are rejected server-side (422) against the provider registry.
    Connection settings (base URL / token) and board selection live on the settings axis, not here.
paths:
  /api/v1/task-trackers:
    get:
      operationId: listTaskTrackers
      tags: [TaskTrackers]
      summary: List the task-tracker providers registered in this Throne build.
      description: >
        Backed by the in-process provider registry. Returns every registered provider exactly once,
        in registration order. Provider-neutral core ships with no adapters, so an empty list is a
        valid response until an adapter (Kaiten, …) is registered.
      responses:
        '200':
          description: Registered task-tracker providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerCatalogResponse'
  /api/v1/task-trackers/{tracker}:
    get:
      operationId: getTaskTracker
      tags: [TaskTrackers]
      summary: Resolve a single task-tracker provider by its open wire key.
      description: >
        The first server boundary that closes the open wire key: a registered key returns its
        catalog row, an unknown key returns 422 (provider-unsupported).
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerProvider'
      responses:
        '200':
          description: Registered provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerProviderDto'
        '422':
          description: Tracker key is not registered on this Throne build.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{id}/task-tracker/refresh:
    post:
      operationId: forceRefreshIntentTaskTrackerCard
      tags: [TaskTrackers]
      summary: Force-pull the linked tracker card for an intent (sync-on-open / «Обновить»).
      description: >
        Synchronously fetches the linked card straight from the tracker and re-applies it to the mirror
        intent before the caller renders. A vanished/forbidden card (404/403) demotes the mirror to a
        stub instead of failing. Returns the resulting sync state; the refreshed intent content arrives
        over the realtime stream (intent.text_changed). An intent with no link returns
        `status=not_linked`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The force-pull outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerCardSyncDto'
  /api/v1/task-trackers/{tracker}/boards/{board}/refresh:
    post:
      operationId: forceRefreshTaskTrackerBoard
      tags: [TaskTrackers]
      summary: Run the periodic board sync for one board right now («Обновить» on the board group).
      description: >
        Triggers the same delta poll the background sync runs for this board (cards changed since
        last_seen), bypassing the per-board backoff so the operator does not wait for the next tick.
        Mirror intents are created/updated and vanished cards are stubbed exactly as in the periodic
        loop; refreshed content arrives over the realtime stream. Not a bulk re-fetch of every card —
        it reuses the existing polling path. Returns `not_connected` when the tracker has no saved
        connection and `unavailable` when the tracker is unreachable.
      parameters:
        - in: path
          name: tracker
          required: true
          schema:
            $ref: '#/components/schemas/TaskTrackerProvider'
        - in: path
          name: board
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The board sync outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTrackerBoardSyncDto'
        '422':
          description: Tracker key is not registered on this Throne build.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    TaskTrackerCardSyncDto:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [not_linked, refreshed, stubbed, unavailable]
          description: >
            `refreshed` — card re-applied; `stubbed` — card gone upstream, mirror kept without content;
            `unavailable` — tracker unreachable or not connected; `not_linked` — intent has no card link.
        tracker:
          type: string
          description: Provider key of the link, when one exists.
        card_id:
          type: string
          description: Linked card id, when one exists.
        state:
          type: string
          enum: [linked, stub]
          description: Resulting link lifecycle, when a link exists.
    TaskTrackerBoardSyncDto:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [synced, unavailable, not_connected]
          description: >
            `synced` — the board poll ran (see `cards_changed`); `unavailable` — the tracker was
            unreachable mid-poll; `not_connected` — no saved connection for this tracker.
        cards_changed:
          type: integer
          format: int32
          minimum: 0
          description: Cards whose mirror content changed in this run, when `status=synced`.
    TaskTrackerProvider:
      type: string
      minLength: 1
      pattern: '^[a-z0-9][a-z0-9-]*$'
      description: >
        Stable task-tracker provider key. Value set intentionally open (ADR-0046); supported
        providers are delivered by the backend registry and unknown values are rejected server-side.
    TaskTrackerProviderDto:
      type: object
      required:
        - tracker
        - display_name
      properties:
        tracker:
          $ref: '#/components/schemas/TaskTrackerProvider'
        display_name:
          type: string
          minLength: 1
          description: Human-readable label for settings/catalog rows.
    TaskTrackerCatalogResponse:
      type: object
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/TaskTrackerProviderDto'
