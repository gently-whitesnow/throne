openapi: "3.1.0"
info:
  title: Throne Terminal
  version: "1.0.0"
  x-csharp-namespace: Throne.Terminal.Contracts.Generated
  description: >
    REST surface for the embedded agent terminal. Spawns and restarts a `tmux`-backed
    session per intent. The bidirectional WebSocket channel for PTY frames lives
    outside OpenAPI — see `specs/contracts/realtime/websocket/terminal.yaml` and the
    Slice 2 ADR for rationale (`realtime/events.yaml` is SSE-only by ADR-0008).
paths:
  /api/v1/terminal/vendors:
    get:
      operationId: listTerminalVendors
      tags: [Terminal]
      summary: Vendor metadata catalog for the embedded-terminal launch surface.
      description: >
        Backend is the single source of truth for terminal vendor metadata and curated
        model lists. The frontend builds its launch dropdowns (vendor / model / effort)
        and the settings default-vendor selector from this response instead of mirroring
        `TerminalAgentCatalog` by hand. The `terminal` capability itself does not gate
        the response — the dropdowns are populated even before that capability is on. Every
        registered vendor is returned with its `login_status` (probed CLI login) and a
        `selectable` flag; the settings vendor cards render all of them, while the launch
        dropdowns keep only `selectable=true`. Currently `opencode` reports
        `login_status=in_development` and `selectable=false` (local-model rework pending).
        Curated model lists for `claude`/`codex` are backend-static (`model_source=static`); `opencode`
        reports `model_source=local` and its `models` list is materialised on the fly from
        the operator's local OpenAI-compatible endpoint (`Throne:LocalModel:BaseUrl`,
        probed via `GET {BaseUrl}/v1/models`).
      responses:
        '200':
          description: Vendor catalog snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalVendorCatalogResponse'
  /api/v1/intents/{intent_id}/terminal/run:
    post:
      operationId: runIntentTerminal
      tags: [Terminal]
      summary: Pre-flight workspace and spawn the agent in a tmux session.
      description: >
        Single trigger for the Slice 2 Run pipeline. The server stages the
        workspace before the session starts:

        1. Stateless auto-bind: union `Tag.default_repositories` across the intent's
           tags, dedupe by `(provider, owner, repo)`, bind whatever is missing.
        2. For every binding still `pending` or `failed`, enqueue a partial clone
           (`--filter=blob:none`) into `RepositoryCloneService`. Clones run in parallel
           up to `Throne:Clone:MaxParallel` (default 4).
        3. Wait until every binding reaches `clone_status=ready`. If anything settles
           on `failed` / `broken`, the spawn is skipped and `session_state=blocked`
           with `blocking_bindings` populated.
        4. Validate `selected_part_ids`, optionally persist `intent_text_update`
           (optimistic concurrency — a conflict aborts here), then spawn the chosen
           agent with `system_prompt` as upfront system context and `user_prompt` as the
           initial message, only after all bindings are ready.
           `tmux has-session -t throne-{intent_id}` is the single source of truth for
           liveness — Throne persists no session *state*. The resolved launch axis
           (`launch`: mode/vendor/model/effort) IS persisted per intent on each
           successful spawn so the next page load can both restore the operator's
           per-intent choice and show the live session's actual parameters (ADR-0041).

        Status is 202 because clones may still be running when the response is
        written; the UI subscribes to `intent.repository_clone_progress` (SSE) for
        per-binding progress and re-fetches `session_state` from the next `run` /
        `restart` response (Slice 2 keeps realtime SSE additions out of scope —
        session-state delivery via response is sufficient for the local-only,
        single-user surface).
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunIntentTerminalRequest'
      responses:
        '202':
          description: Pre-flight accepted. Inspect `session_state` and `bindings` for current progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunIntentTerminalResponse'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: >
            A tmux session for this intent is already running (call `restart` instead), or the
            `intent_text_update.expected_version` no longer matches — the spawn was aborted.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Capability `terminal` disabled, prerequisite missing, invalid mode, or unknown selected parts.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/terminal/session:
    get:
      operationId: getIntentTerminalSession
      tags: [Terminal]
      summary: Observe the current tmux session state for an intent.
      description: >
        Read-only status probe used by the intent page on mount/reload. It does not
        auto-bind repositories, enqueue clone jobs, spawn tmux, or mutate any persisted
        state. `tmux has-session -t throne-{intent_id}` remains the source of truth for
        liveness; when it returns true the UI can immediately attach the WebSocket to the
        existing session and show tmux scrollback. The response echoes the persisted
        `launch` axis (ADR-0041) when the intent was ever launched: with a live session it
        is that session's actual mode/vendor/model/effort, otherwise the intent's last-used
        choice the launch controls pre-fill from.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current terminal session snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunIntentTerminalResponse'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Capability `terminal` disabled.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/terminal/restart:
    post:
      operationId: restartIntentTerminal
      tags: [Terminal]
      summary: Kill the live tmux session and re-run the pre-flight pipeline.
      description: >
        `tmux kill-session -t throne-{intent_id}` followed by the same staged
        pre-flight as `run`. Pre-flight is idempotent — a ready workspace produces
        an immediate spawn. The user is fully responsible for interrupting whatever
        was running inside the session; the server does NOT confirm.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunIntentTerminalRequest'
      responses:
        '202':
          description: Restart accepted; same payload shape as `run`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunIntentTerminalResponse'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: The `intent_text_update.expected_version` no longer matches — the spawn was aborted.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Capability `terminal` disabled, prerequisite missing, invalid mode, or unknown selected parts.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/terminal/kill:
    post:
      operationId: killIntentTerminal
      tags: [Terminal]
      summary: Kill the live tmux session without respawning.
      description: >
        `tmux kill-session -t throne-{intent_id}`, then return the post-kill snapshot
        with `session_state=exited`. Unlike `restart` this does not re-run the pre-flight
        pipeline or spawn a new session — it just tears the session down. Idempotent: a
        missing session is reported as `exited` all the same. The user is fully
        responsible for whatever was running inside; the server does NOT confirm.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session torn down; `session_state=exited`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunIntentTerminalResponse'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Capability `terminal` disabled.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/terminal/skills/attach:
    post:
      operationId: attachIntentTerminalSkills
      tags: [Terminal]
      summary: Hot-attach session skills into a live tmux session.
      description: >
        Loads the requested skill packages into a running agent session without a
        restart when the persisted launch vendor has native skill hot-reload
        (Claude or Codex). The handler writes the canonical `SKILL.md` to
        `skills/{id}/SKILL.md` and a thin vendor pointer to
        `.claude/skills/{id}/SKILL.md` for Claude or
        `.agents/skills/{id}/SKILL.md` for Codex. It does not inject messages
        into the live tmux pane; the agent discovers the file change natively.
        The selection is persisted in `terminal_launches.attached_skill_ids` and
        re-applied on the next preflight preview as default-on. Idempotent:
        re-attaching an already attached skill is a no-op for the persisted set.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachIntentTerminalSkillsRequest'
      responses:
        '200':
          description: Skills attached; updated set echoed back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachIntentTerminalSkillsResponse'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: No live tmux session — attach requires a running session (use `run` first).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Unknown skill id, skill not materializable for the current intent, or vendor unsupported.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/intents/{intent_id}/terminal/hooks/{event}:
    post:
      operationId: receiveIntentTerminalHook
      tags: [Terminal]
      summary: Receive a local agent hook callback.
      description: >
        Agent-only local runtime callback injected into the per-session agent config
        (Claude `--settings` file, Codex inline `-c hooks.*` override, OpenCode project plugin).
        Drives deterministic intent-status derivation in the embedded contour (ADR-0034 §4).
        `SessionReady` is a provider-neutral readiness signal for the initial prompt paste and is
        intentionally ignored by status derivation.
        Two Throne events park the intent in `awaiting_operator` — `Stop` (turn yielded) and
        `Notification` (a permission prompt blocks the agent without ending the turn, so no
        `Stop` fires; Claude scopes it to `permission_prompt` via matcher, OpenCode maps
        `permission.asked`) — and two return it to the spawn phase
        (`work`/`review`/`free` → `work`, `interview` → `interview`):
        `UserPromptSubmit` (operator answered) and `PostToolUse` (agent resumed after an
        approval, which is not a `UserPromptSubmit`). OpenCode maps `session.idle`,
        `tui.prompt.append`, `permission.replied`, and `tool.execute.after` onto those Throne
        events. The `mode` query carries that spawn phase so the return is stateless — the hook
        knows its own session mode. Bundle-less `dream` passes through without a status change.
        Codex still injects only the turn-boundary pair.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
        - in: path
          name: event
          required: true
          schema:
            type: string
            enum:
              - Stop
              - UserPromptSubmit
              - SessionReady
              - Notification
              - PostToolUse
        - in: query
          name: mode
          required: false
          description: >
            Spawn phase of the session the hook fires from. Baked into the per-session hook
            URL at spawn time; the endpoint maps it to the return status on `UserPromptSubmit`
            /`PostToolUse` and gates the `Stop`/`Notification` → `awaiting_operator` park.
            Omitted only by legacy callers.
          schema:
            $ref: '#/components/schemas/TerminalRunMode'
      responses:
        '200':
          description: Hook callback accepted.
  /api/v1/intents/{intent_id}/terminal/preview:
    post:
      operationId: previewIntentTerminal
      tags: [Terminal]
      summary: Resolve the embedded prompt composition before spawn (ADR-0036).
      description: >
        Returns the effective prompt composition for the requested embedded mode: mandatory
        parts (projected from the skill manifest) plus the operator-authored optional parts
        with their per-mode roles. `selected_part_ids` overrides the default-on optional
        selection; omit it to get the mode defaults. `system_prompt` is the assembled rules
        block (mandatory + selected optional) destined for `--append-system-prompt`;
        `user_prompt` is the intent body draft for the task zone. The frontend renders the
        pre-flight modal from this response and never assembles the runtime prompt itself.
        Only embedded modes `work`/`interview`/`review`/`free` are surfaced in the intent UI.
        `review` additionally requires at least one attached PR/MR on the intent; when more
        than one is attached, `run`/`restart` receives the chosen `review_binding_id`.
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewIntentTerminalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentTerminalPreviewResponse'
        '404':
          description: Intent not found.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Mode not supported for embedded preview (e.g. dream).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    TerminalModelSource:
      type: string
      enum:
        - static
        - local
      description: >
        Provenance of a vendor's curated model list. `static` — the list is hardcoded in
        the backend descriptor and changes only by editing the catalog (`claude`, `codex`).
        `local` — the list comes from the operator's local OpenAI-compatible endpoint
        (`Throne:LocalModel:BaseUrl`, probed via `GET {BaseUrl}/v1/models`); used by
        `opencode`. `models` may be empty when the endpoint is unconfigured/unreachable.
    TerminalVendorMetadataDto:
      type: object
      required:
        - vendor
        - label
        - supports_effort
        - models
        - efforts
        - model_source
        - login_status
        - selectable
      properties:
        vendor:
          $ref: '#/components/schemas/TerminalAgentVendor'
        label:
          type: string
          minLength: 1
          description: Human-facing vendor label for the launch/settings dropdown.
        supports_effort:
          type: boolean
          description: >
            Whether the vendor exposes a reasoning-effort axis. False → the launch surface
            hides the effort control and no effort reaches the spawn argv.
        models:
          type: array
          items:
            type: string
            minLength: 1
          description: >
            Model whitelist, native-default-first. Always at least one entry for
            `model_source=static`; may be empty for `model_source=local` when the local
            endpoint is unconfigured or unreachable — the launch surface then disables
            the model picker for that vendor.
        default_model:
          type: string
          minLength: 1
          nullable: true
          description: >
            Native default model = first entry of `models`. Null when `models` is empty
            (only possible for `model_source=local`).
        efforts:
          type: array
          items:
            type: string
            minLength: 1
          description: >
            Reasoning-effort tiers selectable for this vendor. Wire values come
            from the `TerminalReasoningEffort` dictionary (`low`/`medium`/`high`/`xhigh`).
            Typed as `string[]` rather than `TerminalReasoningEffort[]` so the API
            mapper writes wire strings directly: NSwag cannot attach an
            `ItemConverterType` for System.Text.Json, so an enum array would leak
            integer codes onto the wire. Empty when `supports_effort=false`.
        default_effort:
          nullable: true
          description: >
            Native default effort. Present iff `supports_effort=true`; null for an
            effort-less vendor.
          allOf:
            - $ref: '#/components/schemas/TerminalReasoningEffort'
        model_source:
          $ref: '#/components/schemas/TerminalModelSource'
        login_status:
          description: >
            Result of the per-vendor login probe (CLI present + authenticated). Feeds the
            vendor card in `/settings` and the «Throne готов» readiness check (≥1 vendor with
            `ready`). `in_development` is a static placeholder (currently `opencode`) — the
            vendor is shown but not launchable; see `selectable`.
          allOf:
            - $ref: '#/components/schemas/TerminalVendorLoginStatus'
        login_detail:
          type: string
          minLength: 1
          nullable: true
          description: >
            Short diagnostic from the login probe (`claude 2.x`, `codex: not logged in`,
            `в разработке`). Surfaced as the vendor-card subtitle; null when the probe has
            nothing to add.
        selectable:
          type: boolean
          description: >
            Whether the launch surface may offer this vendor. False for `in_development`
            vendors (and any whose capability prerequisite is unavailable) — they still
            appear in `/settings` with their status, but the launch dropdown filters them out.
    TerminalVendorLoginStatus:
      type: string
      enum:
        - ready
        - logged_out
        - missing
        - in_development
      description: >
        Login readiness of a terminal vendor's CLI. `ready` — CLI on PATH and authenticated
        (`claude auth status` / `codex login status` exit 0). `logged_out` — CLI present but
        not authenticated. `missing` — CLI not found on PATH. `in_development` — vendor is
        intentionally not wired for launch yet (e.g. `opencode` pending local-model rework);
        it is excluded from the readiness check and not `selectable`.
    TerminalVendorCatalogResponse:
      type: object
      required:
        - default_vendor
        - vendors
      properties:
        default_vendor:
          description: >
            Vendor pre-selected on the launch surface when neither the request nor the
            persisted setting pins one.
          allOf:
            - $ref: '#/components/schemas/TerminalAgentVendor'
        vendors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TerminalVendorMetadataDto'
          description: Every registered vendor, in catalog order.
    TerminalRunMode:
      type: string
      enum:
        - work
        - interview
        - review
        - dream
        - free
      description: >
        Embedded run mode. Drives which mandatory parts the pre-flight preview projects
        (`work`/`interview`/`review` from the matching manifest bundle; `free` curates everything by hand)
        and the spawn phase the status hooks return to. The embedded contour injects the
        operator-curated `system_prompt`/`user_prompt` upfront (ADR-0034) — it does not ask the
        agent to read a bundle. Session skills are selected separately in the launch
        window and materialised only when their spawn identity is available.
    TerminalSessionState:
      type: string
      enum:
        - spawning
        - running
        - blocked
        - exited
      description: >
        Lifecycle of the per-intent tmux session, derived from `tmux has-session` at
        observation time.

        `spawning` — pre-flight finished, `tmux new -ADs` not yet observed alive.
        `running` — session is alive.
        `blocked` — at least one binding is `failed` / `broken`; spawn was skipped.
        `exited` — session was alive previously but has since been torn down.
    TerminalAgentVendor:
      type: string
      enum:
        - claude
        - codex
        - opencode
      description: >
        Which agent CLI the tmux session boots. Provider-neutral axis: the spawn
        command is built per vendor (`claude --model … --effort …` vs
        `codex -m … -c model_reasoning_effort=…` vs `opencode --model throne-local/…`,
        no effort axis). Omitted on the request → the server falls back to
        `default_terminal_vendor` from settings.
    TerminalReasoningEffort:
      type: string
      enum:
        - low
        - medium
        - high
        - xhigh
      description: >
        Single reasoning-effort axis shared across vendors (the vendor effort
        dictionaries overlap on low/medium/high/xhigh). The claude-only `max`
        tier is intentionally excluded.
    RunIntentTerminalRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/TerminalRunMode'
        vendor:
          nullable: true
          description: Omitted → server falls back to `default_terminal_vendor` from settings.
          allOf:
            - $ref: '#/components/schemas/TerminalAgentVendor'
        model:
          type: string
          minLength: 1
          nullable: true
          description: >
            Model id from the vendor's whitelist (claude: opus | sonnet | haiku; codex:
            gpt-5.5 | gpt-5.4 | gpt-5.3-codex; opencode: any id advertised by the local
            `/v1/models` endpoint). Omitted → the vendor's native default. An id outside
            the whitelist for the chosen vendor → 400.
        effort:
          nullable: true
          description: Omitted → the chosen vendor's native default effort.
          allOf:
            - $ref: '#/components/schemas/TerminalReasoningEffort'
        selected_part_ids:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Optional part ids the operator left enabled in the pre-flight modal. The server
            validates each id against the parts available in `mode` (unknown ids → 422) but
            does NOT recompose `system_prompt` from them — the assembled text travels in
            `system_prompt`. Omitted → no optional parts were curated for this run.
        selected_skill_ids:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Session skill ids the operator enabled for this launch. The server validates
            every id against the session skill catalog and checks materializability after
            repository preflight. Unknown or unavailable ids abort preflight with 422.
        review_binding_id:
          type: string
          minLength: 1
          nullable: true
          description: >
            Binding id of the attached PR/MR to review when `mode=review` and the intent has
            more than one attached pull request. Omitted with a single attached PR/MR → the
            server selects it implicitly. A value outside the intent's attached PR/MR bindings
            aborts pre-flight with 422.
        system_prompt:
          type: string
          nullable: true
          description: >
            Final rules block assembled by the pre-flight preview (mandatory + selected
            optional parts) including any session-only inline edit. Delivered verbatim to the
            agent's system-context flag (Claude `--append-system-prompt`, Codex
            `-c developer_instructions`). Empty/omitted → no system context is injected.
        user_prompt:
          type: string
          nullable: true
          description: >
            Final task text (intent body draft plus the operator's per-run input) delivered
            verbatim as the agent's initial user message. Empty/omitted → the agent boots
            without a pre-filled prompt.
        intent_text_update:
          nullable: true
          description: >
            Present only when the operator opted to persist their task-zone edit to
            `Intent.text` before spawn. Applied with optimistic concurrency; a version
            conflict aborts the spawn (the agent never starts on a stale edit).
          allOf:
            - $ref: '#/components/schemas/IntentTextUpdate'
    IntentTextUpdate:
      type: object
      required:
        - expected_version
        - old_text
        - new_text
      properties:
        expected_version:
          type: integer
          format: int32
          minimum: 1
          description: current_version observed at preview time; must still match or the spawn is blocked with 409.
        old_text:
          type: string
          description: Intent body as shown in the modal before editing (the full pre-edit text).
        new_text:
          type: string
          description: Edited intent body to persist.
    BindingCloneStatus:
      type: string
      enum:
        - pending
        - cloning
        - ready
        - failed
        - broken
      description: >
        Mirror of `repositories#/components/schemas/CloneStatus`. Duplicated here so this
        contract generator never reaches out across files (NSwag does not resolve
        relative `$ref` between OpenAPI documents). Keep enum values in sync — see
        ADR-0024 § 5 for the lifecycle.
    RunIntentBindingStatusDto:
      type: object
      required:
        - binding_id
        - clone_status
      properties:
        binding_id:
          type: string
        clone_status:
          $ref: '#/components/schemas/BindingCloneStatus'
        clone_error:
          type: string
          nullable: true
    RunIntentTerminalResponse:
      type: object
      required:
        - intent_id
        - session_name
        - session_state
        - bindings
      properties:
        intent_id:
          type: string
        session_name:
          type: string
          minLength: 1
          description: Deterministic tmux session name `throne-{intent_id}`.
        session_state:
          $ref: '#/components/schemas/TerminalSessionState'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/RunIntentBindingStatusDto'
          description: >
            Compact snapshot of every binding attached to the intent after the auto-bind
            step. Full binding cards live under `listIntentRepositories` (Repositories
            module); the UI joins by `binding_id`.
        blocking_bindings:
          type: array
          items:
            type: string
          description: >
            IDs of bindings whose `clone_status` is `failed` or `broken`. Present when
            `session_state=blocked`; the UI uses them to render an actionable error per row.
        launch:
          nullable: true
          description: >
            Resolved launch axis (mode/vendor/model/effort) of this intent. On `run`/`restart`
            it echoes the axis the spawn actually used (defaults applied). On the status probe
            it is the persisted last-used axis: with a live session those are the running
            session's real parameters; otherwise the choice the controls pre-fill from. Null
            only when the intent was never launched (no persisted record).
          allOf:
            - $ref: '#/components/schemas/TerminalLaunchArgs'
    TerminalLaunchArgs:
      type: object
      required:
        - mode
        - vendor
        - model
      properties:
        mode:
          $ref: '#/components/schemas/TerminalRunMode'
        vendor:
          $ref: '#/components/schemas/TerminalAgentVendor'
        model:
          type: string
          minLength: 1
          description: Resolved model id from the vendor's whitelist.
        effort:
          nullable: true
          description: Resolved reasoning effort; null for a vendor with no effort axis.
          allOf:
            - $ref: '#/components/schemas/TerminalReasoningEffort'
        attached_skill_ids:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Скилы, догруженные в живую сессию через POST /terminal/skills/attach.
            Persist в `terminal_launches`, на следующий restart preflight модалка
            пометит эти скилы как default-on. Не путать с `selected_skill_ids` в
            `RunIntentTerminalRequest` (выбор на спавн-время).
    AttachIntentTerminalSkillsRequest:
      type: object
      required: [skill_ids]
      properties:
        skill_ids:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Skill ids from the session skill catalog to hot-attach to the live session.
    AttachIntentTerminalSkillsResponse:
      type: object
      required: [attached_skill_ids]
      properties:
        attached_skill_ids:
          type: array
          items:
            type: string
          description: >
            Full set of skills currently attached to the live session after the call (union of previous and the new request).
    PreviewIntentTerminalRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/TerminalRunMode'
        selected_part_ids:
          type: array
          nullable: true
          description: >
            Explicit selection of optional part ids. Omitted → the mode defaults (every
            `default_on` optional part). Mandatory parts are always included regardless.
          items:
            type: string
    PromptPartPreviewDto:
      type: object
      required:
        - part_id
        - key
        - scope
        - role
        - order
        - editable
        - present
        - selected
        - text
      properties:
        part_id:
          type: string
          description: Mongo id of the prompt part (ADR-0036).
        key:
          type: string
          description: Part key, unique within scope.
        scope:
          type: string
          description: system | user.
        role:
          type: string
          description: mandatory | default_on | default_off.
        order:
          type: integer
          format: int32
          minimum: 0
        editable:
          type: boolean
          description: True for user-scope parts; false for system parts.
        present:
          type: boolean
          description: False when a mandatory user part has no record yet (seeded on first patch apply).
        selected:
          type: boolean
          description: Whether the part is included in the assembled system_prompt.
        text:
          type: string
    AvailableSessionSkillDto:
      type: object
      required:
        - skill_id
        - source
        - title
        - description
        - materializable
        - default_enabled
        - selected
      properties:
        skill_id:
          type: string
          description: Stable string id from the session skill catalog.
        source:
          type: string
          description: Skill package origin discriminator (`throne` today).
        title:
          type: string
        description:
          type: string
        materializable:
          type: boolean
          description: Whether the current intent has the stable spawn identity this skill needs.
        reason:
          type: string
          nullable: true
          description: Human-readable reason when `materializable=false`.
        default_enabled:
          type: boolean
          description: Persisted mode default from `skill_mode_defaults`.
        selected:
          type: boolean
          description: Effective launch selection after per-intent memory overrides defaults.
    IntentTerminalPreviewResponse:
      type: object
      required:
        - intent_id
        - intent_version
        - mode
        - parts
        - available_skills_for_mode
        - selected_part_ids
        - system_prompt
        - user_prompt
      properties:
        intent_id:
          type: string
        intent_version:
          type: integer
          format: int32
          minimum: 1
          description: >
            current_version of the intent at preview time. The modal echoes it back as
            `intent_text_update.expected_version` when the operator persists a task-zone edit.
        mode:
          $ref: '#/components/schemas/TerminalRunMode'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PromptPartPreviewDto'
          description: Every part available in the mode (mandatory + optional), ordered as assembled.
        available_skills_for_mode:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSessionSkillDto'
          description: Catalog skills with materializability and effective selection for this mode.
        selected_part_ids:
          type: array
          items:
            type: string
          description: Part ids included in system_prompt (mandatory + selected optional).
        system_prompt:
          type: string
          description: Assembled rules block destined for `--append-system-prompt`.
        user_prompt:
          type: string
          description: Intent body draft for the task zone (first user message).
