openapi: "3.1.0"
info:
  title: Throne Me
  version: "1.0.0"
  x-csharp-namespace: Throne.Me.Contracts.Generated
paths:
  /api/v1/me/mcp-token:
    get:
      operationId: getMcpToken
      tags: [Me]
      summary: Get metadata about the current user's MCP Personal Access Token.
      description: >
        Returns whether a PAT exists for the authenticated user and, if so, a non-sensitive
        fingerprint (createdAt + lastFour). The plaintext secret is never returned by GET —
        it is shown exactly once on POST (creation/regeneration).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpTokenMetaDto'
    post:
      operationId: regenerateMcpToken
      tags: [Me]
      summary: Issue a new MCP Personal Access Token for the current user.
      description: >
        Replaces the user's existing PAT (if any) atomically. Returns the plaintext secret
        exactly once — clients must store it immediately. Subsequent GET requests will only
        return metadata.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpTokenIssuedDto'
components:
  schemas:
    McpTokenMetaDto:
      type: object
      required:
        - has_token
      properties:
        has_token:
          type: boolean
          description: Whether the user has an active PAT.
        created_at:
          type: string
          format: date-time
          description: When the active PAT was issued. Absent if has_token=false.
        last_four:
          type: string
          minLength: 4
          maxLength: 4
          description: Last 4 chars of the plaintext for fingerprint UI. Absent if has_token=false.
    McpTokenIssuedDto:
      type: object
      required:
        - token
        - created_at
        - last_four
      properties:
        token:
          type: string
          description: Plaintext PAT secret. Returned exactly once.
        created_at:
          type: string
          format: date-time
        last_four:
          type: string
          minLength: 4
          maxLength: 4
