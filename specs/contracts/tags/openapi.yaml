openapi: "3.1.0"
info:
  title: Throne Tags
  version: "1.0.0"
  x-csharp-namespace: Throne.Tags.Contracts.Generated
paths:
  /api/v1/tags:
    get:
      operationId: listTags
      tags: [Tags]
      summary: List all tags ordered by name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagDto'
    post:
      operationId: createTag
      tags: [Tags]
      summary: Create a new tag (user-driven).
      description: Normalizes the name (trim, lowercase, strip leading hashes). Returns 409 if a tag with the same normalized name already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDto'
        '409':
          description: Tag with the same name already exists
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Invalid tag name
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/tags/{id}:
    get:
      operationId: getTag
      tags: [Tags]
      summary: Read a tag including its default repositories list.
      description: >
        Returns full tag state with the `default_repositories[]` collection used by
        the Slice 2 Run pre-flight (auto-bind union across the intent's tags).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    patch:
      operationId: renameTag
      tags: [Tags]
      summary: Rename a tag.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTagRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict or name taken
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Invalid tag name
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: Delete a tag.
      description: When detach=true the server removes this tag from every intent currently using it before deleting the tag itself. Without detach=true the call is rejected with 409 if the tag is still attached to any intent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: detach
          required: false
          schema:
            type: boolean
            default: false
          description: Detach the tag from all intents before deleting.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTagResponse'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Tag still attached to intents and detach was not confirmed
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/tags/{id}/usage:
    get:
      operationId: getTagUsage
      tags: [Tags]
      summary: Count of intents currently referencing the tag.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagUsageDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/tags/{id}/default-repositories:
    put:
      operationId: setTagDefaultRepositories
      tags: [Tags]
      summary: Replace the tag's default repositories list.
      description: >
        Whole-list replace (no PATCH). The server normalizes by deduplicating on
        `(provider, owner, repo)`. Empty array is accepted and clears the list.
        Existing intent bindings are not touched — the pre-flight pipeline only
        runs when the operator presses Run.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTagDefaultRepositoriesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDetailDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (provider unsupported, owner/repo malformed).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    TagDto:
      type: object
      required:
        - id
        - name
        - current_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Tag identifier (32 hex chars).
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Normalized hashtag-shaped slug (a-z, 0-9, '-', '_').
        current_version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    RenameTagRequest:
      type: object
      required:
        - name
        - expected_version
      properties:
        name:
          type: string
          minLength: 1
        expected_version:
          type: integer
          format: int32
          minimum: 1
    TagUsageDto:
      type: object
      required:
        - tag_id
        - intents_count
      properties:
        tag_id:
          type: string
        intents_count:
          type: integer
          format: int32
          minimum: 0
    DeleteTagResponse:
      type: object
      required:
        - tag_id
        - intents_detached
      properties:
        tag_id:
          type: string
        intents_detached:
          type: integer
          format: int32
          minimum: 0
    TagDefaultGitProvider:
      type: string
      enum:
        - github
        - gitlab
      description: >
        Mirror of `repositories#/components/schemas/GitProvider`. Duplicated locally so
        the tags contract generator never reaches across files (NSwag does not resolve
        relative `$ref` between OpenAPI documents). Keep enum values in sync — see
        ADR-0024 for the canonical list.
    TagDefaultRepositoryDto:
      type: object
      required:
        - provider
        - owner
        - repo
      properties:
        provider:
          $ref: '#/components/schemas/TagDefaultGitProvider'
        host:
          type: string
          minLength: 1
        owner:
          type: string
          minLength: 1
          maxLength: 255
        repo:
          type: string
          minLength: 1
          maxLength: 100
        project_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        default_branch:
          type: string
          minLength: 1
          nullable: true
          description: >
            Optional branch hint for the Run pre-flight; falls back to upstream's
            default branch on first clone (ADR-0024 § 1).
    TagDetailDto:
      type: object
      required:
        - id
        - name
        - current_version
        - created_at
        - updated_at
        - default_repositories
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 40
        current_version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        default_repositories:
          type: array
          items:
            $ref: '#/components/schemas/TagDefaultRepositoryDto'
          description: >
            Repositories the Slice 2 Run pre-flight auto-binds for every intent that
            carries this tag. Uniqueness is enforced on `(provider, owner, repo)`.
    SetTagDefaultRepositoriesRequest:
      type: object
      required:
        - expected_version
        - default_repositories
      properties:
        expected_version:
          type: integer
          format: int32
          minimum: 1
        default_repositories:
          type: array
          items:
            $ref: '#/components/schemas/TagDefaultRepositoryDto'
