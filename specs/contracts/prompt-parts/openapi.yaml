openapi: "3.1.0"
info:
  title: Throne Prompt Parts
  version: "1.0.0"
  x-csharp-namespace: Throne.PromptParts.Contracts.Generated
  description: >
    User-authored optional prompt parts for the embedded terminal (ADR-0035). A part is a
    named unit of rule text with per-mode roles (mandatory | default_on | default_off). The
    mandatory system/user instructions are NOT managed here — they are projected from the
    skill manifest into the embedded composition (see terminal/preview). This module owns only
    the operator-authored optional parts stored in Mongo.
paths:
  /api/v1/prompt-parts:
    get:
      operationId: listPromptParts
      tags: [PromptParts]
      summary: List user prompt parts (metadata + roles + short text preview).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromptPartListItemDto'
    post:
      operationId: createPromptPart
      tags: [PromptParts]
      summary: Create a user prompt part.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptPartRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPartDto'
        '409':
          description: A part with the same key already exists.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (unknown mode/role, blank key, duplicate mode).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/prompt-parts/{id}:
    get:
      operationId: getPromptPart
      tags: [PromptParts]
      summary: Get a single prompt part (full text + roles).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPartDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    delete:
      operationId: deletePromptPart
      tags: [PromptParts]
      summary: Hard-delete a user prompt part (only when it has no roles in any mode).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePromptPartResponse'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: The part still has roles in one or more modes. Detach all roles first.
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/prompt-parts/{id}/replace-text:
    post:
      operationId: replacePromptPartText
      tags: [PromptParts]
      summary: Replace a unique substring of the part text (optimistic concurrency).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../shared.yaml#/components/schemas/ReplaceTextRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPartDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Match not found or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/prompt-parts/{id}/roles:
    put:
      operationId: setPromptPartRoles
      tags: [PromptParts]
      summary: Replace the per-mode roles of a prompt part (whole-replace).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPromptPartRolesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPartDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        '422':
          description: Validation failed (unknown mode/role, duplicate mode).
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
  /api/v1/prompt-parts/bundles-tree:
    get:
      operationId: getBundlesTree
      tags: [PromptParts]
      summary: Precomputed bundle → prompt-parts tree.
      description: >
        Returns the runtime composition that a frontier agent receives for each bundle mode.
        Source of truth is the declarative manifest (specs/manifest/throne-skills.yaml) for the
        ordering of mandatory parts; the texts are read from the prompt_parts collection.
        For every bundle mode the response includes the mode and its ordered includes (system +
        user parts) with full text payload. User-scope entries carry editable=true; system
        entries are read-only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesTreeDto'
  /api/v1/prompt-parts/{id}/versions:
    get:
      operationId: listPromptPartVersions
      tags: [PromptParts]
      summary: List the text-version history of a prompt part.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../shared.yaml#/components/schemas/TextVersionDto'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '../shared.yaml#/components/schemas/ProblemDetails'
components:
  schemas:
    BundlesTreeDto:
      type: object
      required:
        - bundles
      properties:
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/BundleNodeDto'
    BundleNodeDto:
      type: object
      required:
        - mode
        - includes
      properties:
        mode:
          type: string
          description: Bundle mode (interview | work | dream | schema_map).
        includes:
          type: array
          items:
            $ref: '#/components/schemas/BundleEntryNodeDto'
    BundleEntryNodeDto:
      type: object
      required:
        - scope
        - key
        - current_version
        - text
        - editable
        - present
      properties:
        scope:
          type: string
          description: system | user.
        key:
          type: string
          description: Prompt part key.
        prompt_part_id:
          type: string
          nullable: true
          description: PromptPart id. Null when a user entry is missing.
        current_version:
          type: integer
          format: int32
          minimum: 0
          description: Mongo current_version, or 0 if no record exists yet.
        text:
          type: string
          description: Full text of the prompt part (empty string when a user entry is missing).
        editable:
          type: boolean
          description: True only for user-scope entries.
        present:
          type: boolean
          description: False when a user-scope record does not yet exist in Mongo.
    PromptPartModeRoleDto:
      type: object
      required:
        - mode
        - role
        - order
      properties:
        mode:
          type: string
          description: Embedded run mode (work | interview | free).
        role:
          type: string
          description: Role in the mode (mandatory | default_on | default_off).
        order:
          type: integer
          format: int32
          minimum: 0
          description: Sort position of the part within its mode block.
    PromptPartDto:
      type: object
      required:
        - id
        - key
        - scope
        - text
        - current_version
        - mode_roles
        - created_at
        - updated_at
      properties:
        id:
          type: string
        key:
          type: string
          description: Stable operator-facing key, unique within scope.
        scope:
          type: string
          description: system | user. Only user parts are managed via this API.
        text:
          type: string
        description:
          type: string
          nullable: true
        current_version:
          type: integer
          format: int32
          minimum: 1
        mode_roles:
          type: array
          items:
            $ref: '#/components/schemas/PromptPartModeRoleDto'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PromptPartListItemDto:
      type: object
      required:
        - id
        - key
        - scope
        - text_short
        - current_version
        - mode_roles
        - created_at
        - updated_at
      properties:
        id:
          type: string
        key:
          type: string
        scope:
          type: string
        description:
          type: string
          nullable: true
        text_short:
          type: string
          maxLength: 140
          description: First 140 characters of the part text (no ellipsis).
        current_version:
          type: integer
          format: int32
          minimum: 1
        mode_roles:
          type: array
          items:
            $ref: '#/components/schemas/PromptPartModeRoleDto'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePromptPartRequest:
      type: object
      required:
        - key
        - text
      properties:
        key:
          type: string
          minLength: 1
          description: Stable operator-facing key, unique within user scope.
        text:
          type: string
          description: Initial part text. May be empty.
        description:
          type: string
          nullable: true
        mode_roles:
          type: array
          nullable: true
          description: Optional initial per-mode roles. Defaults to empty (part not yet bound to any mode).
          items:
            $ref: '#/components/schemas/PromptPartModeRoleDto'
    SetPromptPartRolesRequest:
      type: object
      required:
        - mode_roles
      properties:
        mode_roles:
          type: array
          description: Whole-replace list of per-mode roles. Empty array detaches the part from every mode.
          items:
            $ref: '#/components/schemas/PromptPartModeRoleDto'
    DeletePromptPartResponse:
      type: object
      required:
        - prompt_part_id
      properties:
        prompt_part_id:
          type: string
          description: Id of the deleted prompt part.
