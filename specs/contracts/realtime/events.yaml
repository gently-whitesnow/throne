version: 1
# Source of truth for server-to-client realtime events.
# Adding an event here is the FIRST step. The realtime gate fails until:
#   - a domain-event record exists in Throne.Application/Events/IntentEvents.cs,
#   - the repository raises that event by carrying it on its outcome,
#   - RealtimeDomainEventHandler maps it to RealtimeEventNames.<PascalName>,
#   - the frontend subscribes via useRealtimeEvent('<name>') in at least one place.
#
# The dispatching IUnitOfWork decorator fans out events automatically — handlers
# never publish realtime events themselves. See ADR-0008 for rationale.
#
# Transport: Server-Sent Events at GET /api/v1/realtime/stream.

events:
  intent.created:
    description: A new Intent was created.
    payload_ref: intents#/components/schemas/IntentDetailDto
  intent.deleted:
    description: An Intent was deleted.
    payload:
      type: object
      required: [intent_id]
      properties:
        intent_id:
          type: string
  intent.text_changed:
    description: Intent.text was edited (replace or insert).
    payload_ref: intents#/components/schemas/IntentDetailDto
  intent.status_changed:
    description: Intent status transitioned.
    payload_ref: intents#/components/schemas/IntentDetailDto
  intent.qa_added:
    description: A Q/A pair was appended to an Intent's training log.
    payload_ref: intents#/components/schemas/IntentQaDto
  intent.review_added:
    description: A review note was appended to an Intent's training log.
    payload_ref: intents#/components/schemas/IntentReviewDto
  intent.attachment_added:
    description: A file attachment was uploaded for an Intent.
    payload_ref: intents#/components/schemas/IntentAttachmentDto
  intent.attachment_deleted:
    description: A file attachment was removed from an Intent.
    payload:
      type: object
      required: [intent_id, attachment_id]
      properties:
        intent_id:
          type: string
        attachment_id:
          type: string
  intent.tags_changed:
    description: The set of tags attached to an Intent changed.
    payload_ref: intents#/components/schemas/IntentDetailDto
  tag.created:
    description: A new tag was created (by user or auto-upsert during create_intent / set_intent_tags).
    payload_ref: tags#/components/schemas/TagDto
  tag.updated:
    description: A tag was renamed.
    payload_ref: tags#/components/schemas/TagDto
  tag.deleted:
    description: A tag was deleted.
    payload:
      type: object
      required: [tag_id]
      properties:
        tag_id:
          type: string
  dream.run_created:
    description: A new DreamRun was created (server captured a fresh evidence window).
    payload_ref: dream#/components/schemas/DreamRunDto
  dream.proposal_created:
    description: A pending proposal was added to a DreamRun.
    payload_ref: dream#/components/schemas/DreamRunDto
  dream.proposal_applied:
    description: A pending proposal was applied (text version created on its target instruction).
    payload_ref: dream#/components/schemas/DreamRunDto
  dream.proposal_skipped:
    description: A pending proposal was rejected with a reason.
    payload_ref: dream#/components/schemas/DreamRunDto
  dream.run_closed:
    description: A DreamRun was closed (auto after all proposals decided, or manually).
    payload_ref: dream#/components/schemas/DreamRunDto
  dream.fuel_changed:
    description: Best-effort, debounced fuel-meter signal — UI may also poll /readiness.
    payload:
      type: object
      required: [available_tokens, status]
      properties:
        available_tokens:
          type: integer
          format: int32
        status:
          type: string
          enum: [empty, has_content, pending_review]
