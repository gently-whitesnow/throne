version: 1
# Source of truth for server-to-client realtime events.
# Adding an event here is the FIRST step. The realtime gate fails until:
#   - a domain-event record exists in Throne.Application/Events/IntentEvents.cs,
#   - the repository raises that event by carrying it on its outcome,
#   - RealtimeDomainEventHandler maps it to RealtimeEventNames.<PascalName>,
#   - the frontend subscribes via useRealtimeEvent('<name>') in at least one place.
#
# The dispatching IUnitOfWork decorator fans out events automatically — handlers
# never publish realtime events themselves. See ADR-0008 for rationale.
#
# Transport: Server-Sent Events at GET /api/v1/realtime/stream.

events:
  intent.created:
    description: A new Intent was created.
    payload_ref: intents#/components/schemas/IntentDetailDto
  intent.deleted:
    description: An Intent was deleted.
    payload:
      type: object
      required: [intent_id]
      properties:
        intent_id:
          type: string
  intent.text_changed:
    description: Intent.text was edited (replace or insert).
    payload_ref: intents#/components/schemas/IntentDetailDto
  intent.status_changed:
    description: Intent status transitioned.
    payload_ref: intents#/components/schemas/IntentDetailDto
  intent.attachment_added:
    description: A file attachment was uploaded for an Intent.
    payload_ref: intents#/components/schemas/IntentAttachmentDto
  intent.attachment_deleted:
    description: A file attachment was removed from an Intent.
    payload:
      type: object
      required: [intent_id, attachment_id]
      properties:
        intent_id:
          type: string
        attachment_id:
          type: string
  intent.tags_changed:
    description: The set of tags attached to an Intent changed.
    payload_ref: intents#/components/schemas/IntentDetailDto
  intent.link_added:
    description: A graph edge was added between two intents.
    payload_ref: intents#/components/schemas/IntentLinkDto
  intent.link_removed:
    description: A graph edge was removed.
    payload:
      type: object
      required: [id, from_id, to_id, type]
      properties:
        id:
          type: string
        from_id:
          type: string
        to_id:
          type: string
        type:
          $ref: 'intents#/components/schemas/IntentLinkType'
  intent.reordered:
    description: An Intent's sort_key changed (drag-and-drop reorder).
    payload:
      type: object
      required: [intent_id, sort_key]
      properties:
        intent_id:
          type: string
        sort_key:
          type: string
  intent.pinned:
    description: An Intent was pinned in a tag-scoped context.
    payload:
      type: object
      required: [intent_id, context_tag_id, pin_sort_key]
      properties:
        intent_id:
          type: string
        context_tag_id:
          type: string
        pin_sort_key:
          type: string
  intent.unpinned:
    description: An Intent was unpinned from a tag-scoped context.
    payload:
      type: object
      required: [intent_id, context_tag_id]
      properties:
        intent_id:
          type: string
        context_tag_id:
          type: string
  intent.pin_moved:
    description: A pin was reordered inside its context's Pinned list.
    payload:
      type: object
      required: [intent_id, context_tag_id, pin_sort_key]
      properties:
        intent_id:
          type: string
        context_tag_id:
          type: string
        pin_sort_key:
          type: string
  intent.repository_bound:
    description: A new repository binding was attached to an intent (ADR-0024).
    payload_ref: repositories#/components/schemas/RepositoryBindingDto
  intent.repository_unbound:
    description: >
      A repository binding was deleted from an intent. Its on-disk workspace directory is
      removed as part of the delete (ADR-0024); the event fires only after both the record
      and the directory are gone.
    payload:
      type: object
      required: [intent_id, binding_id]
      properties:
        intent_id:
          type: string
        binding_id:
          type: string
  intent.repository_clone_progress:
    description: >
      The clone lifecycle for a binding advanced. Emitted on every `clone_status` transition
      (pending → cloning → ready | failed, ready → broken). See ADR-0024.
    payload:
      type: object
      required: [intent_id, binding_id, status]
      properties:
        intent_id:
          type: string
        binding_id:
          type: string
        status:
          $ref: 'repositories#/components/schemas/CloneStatus'
        error:
          type: string
          description: Human-readable error message when `status` is `failed` or `broken`.
  intent.pr_comment_added:
    description: A new review comment was observed on the binding's pull request (polling or manual sync).
    payload:
      type: object
      required: [intent_id, binding_id, comment]
      properties:
        intent_id:
          type: string
        binding_id:
          type: string
        comment:
          $ref: 'repositories#/components/schemas/PullRequestCommentDto'
  repository.registered:
    description: >
      A repository registry row was materialised for a coordinate the first time it surfaced
      (ADR-0031). Fires on every path that ensures the registry — manual create, intent bind,
      tag default, or the first knowledge-page write — but only when a new row is inserted,
      never on the idempotent no-op.
    payload_ref: repositories#/components/schemas/RepositoryDto
  repository.document_updated:
    description: >
      A RepositoryArtifact knowledge page was written (create or update) — covers both the
      MCP write_repository_document authoring path and the HTTP PUT manual edit. Pointer-only:
      the markdown body and the version timeline are refetched by the client, so the frame
      carries just the coordinate + slug + new version (ADR-0031, ADR-0008).
    payload:
      type: object
      required: [provider, owner, repo, slug, version]
      properties:
        provider:
          type: string
        owner:
          type: string
        repo:
          type: string
        slug:
          type: string
        version:
          type: integer
          format: int32
          minimum: 1
  pull_request.artifact_updated:
    description: >
      A PullRequestArtifact was written for a repository binding (ADR-0031). Latest-wins:
      clients refetch the artifact list or the single `(binding_id, type)` row.
    payload:
      type: object
      required: [binding_id, pull_request_number, type, produced_at]
      properties:
        binding_id:
          type: string
        pull_request_number:
          type: integer
          format: int32
          minimum: 1
        type:
          type: string
        head_sha:
          type: string
          description: Head commit sha when the artifact was produced; lets clients flag staleness without a refetch.
        produced_at:
          type: string
          format: date-time
  tag.created:
    description: A new tag was created (by user or auto-upsert during create_intent / set_intent_tags).
    payload_ref: tags#/components/schemas/TagDto
  tag.updated:
    description: A tag was renamed.
    payload_ref: tags#/components/schemas/TagDto
  tag.deleted:
    description: A tag was deleted.
    payload:
      type: object
      required: [tag_id]
      properties:
        tag_id:
          type: string
  prompt_part_patch.proposed:
    description: A frontier agent proposed a new patch for a prompt part (ADR-0036).
    payload_ref: prompt-part-patches#/components/schemas/PromptPartPatchDto
  prompt_part_patch.applied:
    description: A patch was applied (verbatim or after user edit). The target prompt part got a new text version.
    payload_ref: prompt-part-patches#/components/schemas/PromptPartPatchDto
  prompt_part_patch.rejected:
    description: A user rejected the patch with a comment (≥10 chars after trimming).
    payload_ref: prompt-part-patches#/components/schemas/PromptPartPatchDto
  prompt_part_patch.superseded:
    description: A newer patch on the same target invalidated this one.
    payload_ref: prompt-part-patches#/components/schemas/PromptPartPatchDto
  dream_session.recorded:
    description: A frontier agent recorded a DreamSession at the end of a /dream pass (ADR-0022).
    payload_ref: dreams#/components/schemas/DreamSessionDto
  terminal.session_started:
    description: >
      A tmux terminal session (throne-{intent_id}) was confirmed alive after a spawn.
      tmux is the source of truth for liveness; this event is a best-effort hint so the
      "terminal running" sidebar bucket updates without polling — the counter self-heals
      from tmux on the next /intents/contexts refresh if the event is lost.
    payload:
      type: object
      required: [intent_id]
      properties:
        intent_id:
          type: string
  terminal.session_stopped:
    description: >
      A tmux terminal session ended — either killed (restart flow) or exited naturally
      (the agent process terminated). Best-effort like session_started; the sidebar bucket
      self-heals from tmux on the next refresh.
    payload:
      type: object
      required: [intent_id]
      properties:
        intent_id:
          type: string
