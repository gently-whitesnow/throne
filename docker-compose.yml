# Контейнерный режим (дефолт): весь стек в контейнере, host-capabilities выключены.
# Профили: API + веб — `--profile full`; только веб — `--profile ui`.
#
# Host-фичи (terminal / Run / vscode / repositories) требуют доступа к хосту,
# которого у контейнера нет, поэтому в этом режиме они OFF (capability default,
# graceful degrade). Для них есть host-backend режим — см. docker-compose.host.yml
# и ADR-0027.

services:
  web:
    profiles: ["full", "ui"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
